syntax = "proto3";
package ksp.geflipper.v1;
option java_package = "com.ksp.geflipper.proto.v1";
option java_multiple_files = true;

message ItemQuantity { int32 item_id = 1; int64 quantity = 2; }
enum Side { SIDE_UNSPECIFIED = 0; BUY = 1; SELL = 2; }
enum RiskLevel { RISK_UNSPECIFIED = 0; LOW = 1; MEDIUM = 2; HIGH = 3; }
enum SuggestionType { SUGGESTION_UNSPECIFIED = 0; SUGGEST_BUY = 1; SUGGEST_SELL = 2; MODIFY_BUY = 3; MODIFY_SELL = 4; ABORT = 5; WAIT = 6; }

message StrategyPreferences {
  int32 timeframe_minutes = 1; RiskLevel risk_level = 2; bool sell_only = 3; bool allow_buy_and_hold = 4;
  bool dump_enabled = 5; int32 reserved_slots = 6; int32 dump_slots = 7; int64 min_expected_profit = 8;
  int64 min_dump_expected_profit = 9; double max_item_exposure_pct = 10; double modify_threshold_pct = 11; double abort_threshold_pct = 12;
}
message GeOfferState {
  int32 slot = 1; int32 item_id = 2; Side side = 3; int64 offer_price = 4; int32 total_quantity = 5;
  int32 filled_quantity = 6; int64 amount_spent = 7; bool active = 8; int64 first_seen_epoch_ms = 9;
  int64 last_changed_epoch_ms = 10; bool recommended_price_used = 11; string suggestion_id = 12;
}
message AccountState {
  string account_key = 1; bool world_member = 2; bool account_member = 3; bool f2p_only = 4; int64 gp = 5;
  repeated ItemQuantity inventory = 6; repeated ItemQuantity bank = 7; repeated ItemQuantity uncollected = 8;
  repeated ItemQuantity other_storage = 9; repeated GeOfferState offers = 10; repeated int32 blocked_items = 11; StrategyPreferences strategy = 12;
}
message ForecastPoint { int64 epoch_ms = 1; double mean = 2; double q25 = 3; double q75 = 4; }
message ItemForecast { int32 item_id = 1; repeated ForecastPoint low = 2; repeated ForecastPoint high = 3; double confidence = 4; string quality = 5; }
message TradeSuggestion {
  string id = 1; SuggestionType type = 2; int32 slot = 3; int32 item_id = 4; string name = 5; int64 price = 6;
  int64 exit_price = 7; int32 quantity = 8; int64 expected_profit = 9; int64 expected_duration_seconds = 10;
  double expected_gp_per_hour = 11; double confidence = 12; bool hold = 13; string explanation = 14; int64 generated_at_epoch_ms = 15;
}
message TradeExecution {
  string id = 1; string account_key = 2; int32 item_id = 3; Side side = 4; int64 price = 5; int32 quantity = 6;
  int64 amount_spent = 7; int64 timestamp_epoch_ms = 8; string suggestion_id = 9; bool recommendation_price_used = 10;
  bool recommendation_originated_trade = 11; int64 first_fill_epoch_ms = 12; int64 full_fill_epoch_ms = 13;
}
message DumpSignal { string id = 1; int32 item_id = 2; string name = 3; double severity = 4; double recovery_probability = 5; int64 current_low = 6; int64 predicted_recovery_price = 7; int64 estimated_recovery_seconds = 8; int64 expected_profit = 9; }
message Position { string id = 1; string account_key = 2; int32 item_id = 3; string type = 4; int32 open_quantity = 5; int32 closed_quantity = 6; int64 total_buy_cost = 7; int64 total_sell_revenue = 8; int64 tax_paid = 9; string status = 10; }
