name: One-shot GE helper migration

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/remove-ksp-ge-helpers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Migrate KSP GE helper callers
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path('.')
          SAFE = 'KspGrandExchangeSafe'
          HELPER = 'KspGrandExchangeHelper'

          def split_args(src: str):
              out, cur = [], []
              depth = 0
              quote = None
              escape = False
              for ch in src:
                  if quote:
                      cur.append(ch)
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      cur.append(ch)
                  elif ch in '([{':
                      depth += 1
                      cur.append(ch)
                  elif ch in ')]}':
                      depth -= 1
                      cur.append(ch)
                  elif ch == ',' and depth == 0:
                      out.append(''.join(cur).strip())
                      cur = []
                  else:
                      cur.append(ch)
              out.append(''.join(cur).strip())
              return out

          def replace_calls(text, marker, builder):
              count = 0
              pos = 0
              while True:
                  i = text.find(marker, pos)
                  if i < 0:
                      break
                  arg_start = i + len(marker)
                  depth = 1
                  quote = None
                  escape = False
                  j = arg_start
                  while j < len(text):
                      ch = text[j]
                      if quote:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      else:
                          if ch in ('"', "'"):
                              quote = ch
                          elif ch == '(':
                              depth += 1
                          elif ch == ')':
                              depth -= 1
                              if depth == 0:
                                  break
                      j += 1
                  if depth != 0:
                      raise RuntimeError(f'Unbalanced call for {marker}')
                  args = split_args(text[arg_start:j])
                  replacement = builder(args)
                  text = text[:i] + replacement + text[j+1:]
                  pos = i + len(replacement)
                  count += 1
              return text, count

          def int_price(expr):
              expr = re.sub(r'^\(long\)\s*', '', expr.strip())
              return f'(int) Math.min(Integer.MAX_VALUE, (long) ({expr}))'

          def buy(args):
              if len(args) != 5:
                  raise RuntimeError(f'Unexpected safe buy args: {args}')
              item, qty, price, exact, close = args
              # Rs2GrandExchange.buyItem is exact-name and keeps GE open by default.
              return f'Rs2GrandExchange.buyItem({item}, {int_price(price)}, {qty})'

          def sell(args):
              if len(args) != 5:
                  raise RuntimeError(f'Unexpected safe sell args: {args}')
              item, qty, price, exact, close = args
              return f'Rs2GrandExchange.sellItem({item}, {qty}, {int_price(price)})'

          def process(args):
              if len(args) != 7:
                  raise RuntimeError(f'Unexpected safe processOffer args: {args}')
              slot, action, item, exact, qty, price, close = args
              return (
                  'Rs2GrandExchange.processOffer(GrandExchangeRequest.builder()'
                  f'.slot({slot}).action({action}).itemName({item}).exact({exact})'
                  f'.quantity({qty}).price({int_price(price)}).closeAfterCompletion({close}).build())'
              )

          def chatbox(args):
              if len(args) != 1:
                  raise RuntimeError(f'Unexpected setChatboxValue args: {args}')
              return f'Rs2GrandExchange.setChatboxValue({int_price(args[0])})'

          changed = []
          for path in ROOT.rglob('*.java'):
              if path.as_posix() in {
                  'ksputil/KspGrandExchangeSafe.java',
                  'kspaccountbuilder/ksputil/KspGrandExchangeHelper.java'
              }:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Remove temporary helper imports.
              text = re.sub(r'^import\s+net\.runelite\.client\.plugins\.microbot\.ksputil\.KspGrandExchangeSafe;\s*\n', '', text, flags=re.M)
              text = re.sub(r'^import\s+net\.runelite\.client\.plugins\.microbot\.kspaccountbuilder\.ksputil\.KspGrandExchangeHelper;\s*\n', '', text, flags=re.M)

              # Replace Account Builder helper lifecycle calls with native GE/bank APIs.
              text = text.replace('KspGrandExchangeHelper.closeBankBeforeExchange()', 'Rs2Bank.closeBank()')
              text = re.sub(
                  r'KspGrandExchangeHelper\.openExchangeDirectly\(\)\s*\|\|\s*KspGrandExchangeHelper\.interactClerk\(\)',
                  'Rs2GrandExchange.openExchange()', text)
              text = text.replace('KspGrandExchangeHelper.openExchangeDirectly()', 'Rs2GrandExchange.openExchange()')
              text = text.replace('KspGrandExchangeHelper.interactClerk()', 'Rs2GrandExchange.openExchange()')

              # Replace temporary compatibility calls with current native Microbot GE APIs.
              text, c1 = replace_calls(text, 'KspGrandExchangeSafe.buy(', buy)
              text, c2 = replace_calls(text, 'KspGrandExchangeSafe.sell(', sell)
              text, c3 = replace_calls(text, 'KspGrandExchangeSafe.processOffer(', process)
              text, c4 = replace_calls(text, 'KspGrandExchangeSafe.setChatboxValue(', chatbox)

              if c3 and 'import net.runelite.client.plugins.microbot.util.grandexchange.GrandExchangeRequest;' not in text:
                  anchor = 'import net.runelite.client.plugins.microbot.util.grandexchange.Rs2GrandExchange;'
                  if anchor not in text:
                      raise RuntimeError(f'{path}: processOffer migration needs Rs2GrandExchange import anchor')
                  text = text.replace(anchor, 'import net.runelite.client.plugins.microbot.util.grandexchange.GrandExchangeRequest;\n' + anchor)

              if (c1 or c2 or c3 or c4 or HELPER in original) and 'import net.runelite.client.plugins.microbot.util.grandexchange.Rs2GrandExchange;' not in text:
                  raise RuntimeError(f'{path}: migrated GE caller lacks Rs2GrandExchange import')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          # Temporary compatibility classes are intentionally removed.
          Path('ksputil/KspGrandExchangeSafe.java').unlink(missing_ok=True)
          Path('kspaccountbuilder/ksputil/KspGrandExchangeHelper.java').unlink(missing_ok=True)

          # The workflow itself is one-shot and must not remain in main.
          Path('.github/workflows/ge-helper-migration.yml').unlink(missing_ok=True)

          # Hard fail if any Java caller still references either helper.
          leftovers = []
          for path in ROOT.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              if SAFE in text or HELPER in text:
                  leftovers.append(path.as_posix())
          if leftovers:
              raise SystemExit('Remaining KSP GE helper references:\n' + '\n'.join(leftovers))

          print('Migrated files:')
          for p in changed:
              print(' -', p)

      - name: Verify removed helper classes and show GE callers
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ksputil/KspGrandExchangeSafe.java
          test ! -e kspaccountbuilder/ksputil/KspGrandExchangeHelper.java
          ! grep -R --line-number --include='*.java' -E 'KspGrandExchangeSafe|KspGrandExchangeHelper' .
          echo 'Current GE API callers:'
          grep -R --line-number --include='*.java' 'Rs2GrandExchange' . | head -n 300 || true

      - name: Commit migration to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Remove obsolete KSP Grand Exchange helpers'
          git push origin HEAD:${{ github.head_ref }}
