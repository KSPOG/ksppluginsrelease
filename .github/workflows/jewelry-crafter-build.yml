name: Build KSP Jewelry Crafter

on:
  push:
    branches:
      - dev
    paths:
      - 'kspjewelrycrafter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/tests/jewelrycrafter/**'
      - '.github/workflows/jewelry-crafter-build.yml'
  pull_request:
    paths:
      - 'kspjewelrycrafter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/tests/jewelrycrafter/**'
      - '.github/workflows/jewelry-crafter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jewelry-crafter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspJewelryCrafterPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install jewellery plugin and shared KSP support
        shell: bash
        run: |
          set -euo pipefail
          ROOT="hub/src/main/java/net/runelite/client/plugins/microbot"
          for component in kspjewelrycrafter kspsupport kspmule kspbank; do
            rm -rf "$ROOT/$component"
            cp -R "release/$component" "$ROOT/$component"
          done

      - name: Include shared KSP support in Jewellery Crafter source set
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = needle + """
                    if (plugin.name == "KspJewelryCrafterPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                        include "${project.ext.getPluginsIncludePath()}/kspmule/**"
                        include "${project.ext.getPluginsIncludePath()}/kspbank/**"
                    }"""
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Build KSP Jewelry Crafter
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspJewelryCrafterPlugin --stacktrace --no-daemon

      - name: Run furnace location JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_JAR="$(find hub/build/libs -maxdepth 1 -name 'KspJewelryCrafterPlugin-*.jar' -type f -print -quit)"
          test -n "$PLUGIN_JAR"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar \
            -o /tmp/junit-platform-console-standalone.jar
          TEST_DIR=/tmp/ksp-jewelrycrafter-tests
          mkdir -p "$TEST_DIR"
          javac --release 11 -cp "/tmp/junit-platform-console-standalone.jar:$PLUGIN_JAR" -d "$TEST_DIR" \
            release/.github/tests/jewelrycrafter/src/test/java/net/runelite/client/plugins/microbot/kspjewelrycrafter/JewelryFurnaceLocationTest.java
          java -jar /tmp/junit-platform-console-standalone.jar execute \
            --class-path "$PLUGIN_JAR:$TEST_DIR" \
            --select-class net.runelite.client.plugins.microbot.kspjewelrycrafter.JewelryFurnaceLocationTest \
            --details summary

      - name: Upload Jewellery Crafter JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspJewelryCrafterPlugin-${{ github.sha }}
          path: hub/build/libs/KspJewelryCrafterPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
