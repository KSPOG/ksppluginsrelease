name: Build KSP Jewelry Crafter

on:
  push:
    branches:
      - dev
    paths:
      - 'kspjewelrycrafter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/tests/jewelrycrafter/**'
      - '.github/workflows/jewelry-crafter-build.yml'
  pull_request:
    paths:
      - 'kspjewelrycrafter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/tests/jewelrycrafter/**'
      - '.github/workflows/jewelry-crafter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jewelry-crafter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspJewelryCrafterPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install jewellery plugin and shared KSP support
        shell: bash
        run: |
          set -euo pipefail
          ROOT="hub/src/main/java/net/runelite/client/plugins/microbot"
          for component in kspjewelrycrafter kspsupport kspmule kspbank; do
            rm -rf "$ROOT/$component"
            cp -R "release/$component" "$ROOT/$component"
          done
          # Compile the furnace tests through Gradle's existing RuneLite
          # test classpath (the plugin artifact is not a fat API jar).
          TEST_DIR="hub/src/test/java/net/runelite/client/plugins/microbot/kspjewelrycrafter"
          mkdir -p "$TEST_DIR"
          cp release/.github/tests/jewelrycrafter/src/test/java/net/runelite/client/plugins/microbot/kspjewelrycrafter/JewelryFurnaceLocationTest.java "$TEST_DIR/"

      - name: Include shared KSP support in Jewellery Crafter source set
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = needle + """
                    if (plugin.name == "KspJewelryCrafterPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                        include "${project.ext.getPluginsIncludePath()}/kspmule/**"
                        include "${project.ext.getPluginsIncludePath()}/kspbank/**"
                    }"""
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Build KSP Jewelry Crafter
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspJewelryCrafterPlugin --stacktrace --no-daemon

      - name: Verify five furnace location JUnit tests passed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('hub/build/test-results/test').rglob('*JewelryFurnaceLocationTest*.xml'))
          assert reports, 'Gradle did not execute JewelryFurnaceLocationTest'
          cases = [x for path in reports for x in ET.parse(path).iter('testcase')]
          assert len(cases) == 5, f'Expected 5 tests, found {len(cases)}'
          problems = [x.attrib.get('name') for x in cases if any(y.tag in ('failure', 'error', 'skipped') for y in x)]
          assert not problems, f'Furnace test failures or skips: {problems}'
          print('PASS: all 5 Jewellery Crafter furnace tests executed and passed')
          PY

      - name: Upload Jewellery Crafter JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspJewelryCrafterPlugin-${{ github.sha }}
          path: hub/build/libs/KspJewelryCrafterPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
