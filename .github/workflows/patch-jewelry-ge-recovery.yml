name: Patch Jewelry GE recovery

on:
  push:
    branches:
      - fix/jewelry-ge-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-ge-recovery

      - name: Patch Jewelry Crafter
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          dec = lambda value: base64.b64decode(value).decode('utf-8')
          helpers = dec('')
          old_sell = dec('')
          new_sell = dec('ICAgICAgICBpZiAoIXBsYWNlU2VsbE9mZmVyU2FmZWx5KG91dHB1dCwgcXR5LCBwcmljZSkpIHJldHVybjsK')
          old_buy = dec('')
          new_buy = dec('')

          path = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          s = path.read_text(encoding='utf-8')
          s = s.replace('import net.runelite.client.plugins.microbot.util.grandexchange.GrandExchangeRequest;\n', '', 1)
          marker = '    private static final int GE_PRICE_X_CHILD = 12;\n'
          replacement = ('    private static final int GE_QUANTITY_X_CHILD = 7;\n'
                         '    private static final int GE_PRICE_X_CHILD = 12;\n'
                         '    private static final int GE_SEARCH_GROUP = 162;\n'
                         '    private static final int GE_SEARCH_PROMPT_CHILD = 52;\n')
          assert marker in s, 'GE constants marker not found'
          s = s.replace(marker, replacement, 1)
          sell_marker = '    private void sellOutput()\n'
          assert sell_marker in s, 'sellOutput marker not found'
          s = s.replace(sell_marker, helpers + sell_marker, 1)
          assert old_sell in s, 'native sell block not found'
          s = s.replace(old_sell, new_sell, 1)
          assert old_buy in s, 'native buy block not found'
          s = s.replace(old_buy, new_buy, 1)
          path.write_text(s, encoding='utf-8')

          plugin = Path('kspjewelrycrafter/KspJewelryCrafterPlugin.java')
          p = plugin.read_text(encoding='utf-8')
          assert 'public static final String VERSION = "0.1.18";' in p, 'version marker not found'
          p = p.replace('public static final String VERSION = "0.1.18";', 'public static final String VERSION = "0.1.19";', 1)
          plugin.write_text(p, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-jewelry-ge-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Jewelry Crafter GE offer recovery"
          git push origin HEAD:fix/jewelry-ge-recovery
