name: Apply Smelter and Jewelry anti-ban patch

on:
  push:
    branches:
      - feat/smelter-jewelry-antiban

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[antiban-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smelter-jewelry-antiban
      - name: Apply patch when script is present
        shell: bash
        run: |
          if [ -f .github/scripts/apply_smelter_jewelry_antiban.py ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_smelter_jewelry_antiban.py')
          text = path.read_text(encoding='utf-8')
          old = '''    replace_once(overlay,
          ''' + "'''        addLine(\"Status\", script.getStatus());\n'''" + ''',
          ''' + "'''        addLine(\"Status\", script.getStatus());\n        addLine(\"Anti-ban\", script.getAntibanStatus());\n'''" + ''')'''
          new = '''    replace_once(overlay,
          ''' + "'''        line(\"Status\", shorten(script.getStatus(), 40));\n'''" + ''',
          ''' + "'''        line(\"Status\", shorten(script.getStatus(), 40));\n        line(\"Anti-ban\", shorten(script.getAntibanStatus(), 40));\n'''" + ''')'''
          if old not in text:
              raise SystemExit('Jewellery overlay patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            python .github/scripts/apply_smelter_jewelry_antiban.py
          else
            echo "Patch script not present yet; waiting for next push."
          fi
      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspsmartsmelter kspjewelrycrafter
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add task-aware anti-ban to smelter and jewelry [antiban-patched]"
          git push origin HEAD:feat/smelter-jewelry-antiban
