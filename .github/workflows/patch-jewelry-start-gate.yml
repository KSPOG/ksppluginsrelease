name: Patch Jewelry Crafter start gate
on:
  push:
    branches: [fix-jewelry-output-input-confusion]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-jewelry-output-input-confusion
      - name: Separate clean-start gate from active crafting
        shell: python
        run: |
          from pathlib import Path
          p = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          s = p.read_text(encoding='utf-8')

          # Only the transitions INTO crafting require an output-free inventory.
          # Once a batch is actively crafting, outputs naturally accumulate while
          # bars/gems remain and must not terminate the batch after one item.
          needle = 'if (hasCraftingInputsInInventory())'
          occurrences = s.count(needle)
          if occurrences != 2:
              raise SystemExit(f'expected 2 evaluate start-gate occurrences, found {occurrences}')
          s = s.replace(needle, 'if (inventoryReadyToStartCrafting())', 2)

          needle2 = 'if (!bankWidgetOpen() && hasCraftingInputsInInventory())'
          if needle2 not in s:
              raise SystemExit('bank start gate not found')
          s = s.replace(needle2, 'if (!bankWidgetOpen() && inventoryReadyToStartCrafting())', 1)

          old = '''    private boolean hasCraftingInputsInInventory()\n    {\n        if (activeRecipe == null || hasAnyCraftedJewelryInInventory()) return false;\n        int mouldId = recipeMouldId();\n        int barId = recipeBarId();\n        int gemId = recipeGemId();\n        if (mouldId <= 0 || barId <= 0 || inventoryCountById(mouldId) <= 0) return false;\n        int bars = inventoryCountById(barId);\n        return bars > 0 && (!activeRecipe.usesGem() || (gemId > 0 && inventoryCountById(gemId) > 0));\n    }\n'''
          new = '''    private boolean inventoryReadyToStartCrafting()\n    {\n        // Finished jewellery from any recipe means this is a dirty inventory.\n        // Bank it before re-entering the furnace state.\n        return !hasAnyCraftedJewelryInInventory() && hasCraftingInputsInInventory();\n    }\n\n    private boolean hasCraftingInputsInInventory()\n    {\n        if (activeRecipe == null) return false;\n        int mouldId = recipeMouldId();\n        int barId = recipeBarId();\n        int gemId = recipeGemId();\n        if (mouldId <= 0 || barId <= 0 || inventoryCountById(mouldId) <= 0) return false;\n        int bars = inventoryCountById(barId);\n        return bars > 0 && (!activeRecipe.usesGem() || (gemId > 0 && inventoryCountById(gemId) > 0));\n    }\n'''
          if old not in s:
              raise SystemExit('hasCraftingInputsInInventory block not found')
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/patch-jewelry-start-gate.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bank outputs before starting Jewelry crafting'
          git push origin HEAD:fix-jewelry-output-input-confusion
