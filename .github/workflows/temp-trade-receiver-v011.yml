name: Validate Trade Receiver v0.1.1

on:
  push:
    branches:
      - fix/trade-receiver-counterparty-accept-v005

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-receiver-counterparty-accept-v005

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Compile Trade Receiver against Microbot
        shell: bash
        run: |
          set -euo pipefail
          TARGET="microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/KSPTradeReceiver"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp KSPTradeReceiver/*.java "$TARGET/"

          # Public Microbot does not include the source-loader-specific KSP constants.
          cat > microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
              private PluginConstants() {}
          }
          EOF

          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/temp-trade-receiver-v011.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-trade-receiver-v011.yml
          git diff --cached --quiet || git commit -m "Remove temporary Trade Receiver v0.1.1 validation"
          git push origin HEAD:fix/trade-receiver-counterparty-accept-v005
