name: Apply Jewelry GE Search Selection Fix

on:
  push:
    branches:
      - fix/jewelry-ge-search-selection-v0120

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-ge-search-selection-v0120

      - name: Patch Jewelry GE item selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    private static final int GE_SEARCH_PROMPT_CHILD = 52;\n    private static final int GE_PRICE_CLICK_DELAY_MIN_MS = 650;',
                  '    private static final int GE_SEARCH_PROMPT_CHILD = 52;\n    private static final int GE_SELECTED_PRICE_CHILD = 41;\n    private static final int GE_PRICE_CLICK_DELAY_MIN_MS = 650;'
              ),
              (
                  '''    private boolean selectGeBuyItem(String itemName)\n    {\n        if (!geSearchResultReady(itemName))\n        {\n            status = "Waiting for GE item search";\n            if (!Rs2Widget.sleepUntilHasWidgetText(\n                "Start typing the name of an item to search for it",\n                GE_SEARCH_GROUP, GE_SEARCH_PROMPT_CHILD, false, 3_500))\n                return false;\n\n            Rs2Keyboard.typeString(itemName);\n            if (!sleepUntil(() -> geSearchResultReady(itemName), 3_500))\n                return false;\n        }\n\n        status = "Selecting GE item: " + itemName;\n        if (!clickGeSearchResultSafely(itemName)) return false;\n        return sleepUntil(this::geSetupControlsReady, 3_500);\n    }\n''',
                  '''    private boolean selectGeBuyItem(String itemName)\n    {\n        if (geSelectedOfferReady()) return true;\n\n        if (!geSearchResultReady(itemName))\n        {\n            status = "Waiting for GE item search";\n            if (!Rs2Widget.sleepUntilHasWidgetText(\n                "Start typing the name of an item to search for it",\n                GE_SEARCH_GROUP, GE_SEARCH_PROMPT_CHILD, false, 3_500))\n                return false;\n\n            Rs2Keyboard.typeString(itemName);\n            if (!sleepUntil(() -> geSearchResultReady(itemName), 3_500))\n                return false;\n        }\n\n        for (int attempt = 1; attempt <= 3; attempt++)\n        {\n            if (geSelectedOfferReady()) return true;\n            if (!geSearchResultReady(itemName))\n            {\n                if (sleepUntil(this::geSelectedOfferReady, 900)) return true;\n                status = "Waiting for GE search result: " + itemName;\n                continue;\n            }\n\n            status = attempt == 1\n                ? "Selecting GE item: " + itemName\n                : "Retrying GE item selection (" + attempt + "/3): " + itemName;\n            sleep(250, 450);\n            if (!clickGeSearchResultSafely(itemName))\n            {\n                sleep(250, 400);\n                continue;\n            }\n            if (sleepUntil(this::geSelectedOfferReady, 2_000))\n            {\n                sleep(250, 450);\n                return true;\n            }\n            sleep(300, 500);\n        }\n\n        status = "GE item did not select: " + itemName;\n        return false;\n    }\n'''
              ),
              (
                  '    private boolean clickGeSearchResultSafely(String itemName)\n    {',
                  '''    private boolean geSelectedOfferReady()\n    {\n        return Microbot.getClientThread().runOnClientThreadOptional(() ->\n        {\n            Widget setup = Microbot.getClient().getWidget(InterfaceID.GeOffers.SETUP);\n            if (setup == null || setup.isHidden()) return false;\n            Widget itemPrice = setup.getChild(GE_SELECTED_PRICE_CHILD);\n            if (itemPrice == null || itemPrice.isHidden()) return false;\n            String text = itemPrice.getText();\n            if (text == null || text.isBlank()) return false;\n            for (int i = 0; i < text.length(); i++)\n                if (Character.isDigit(text.charAt(i))) return true;\n            return false;\n        }).orElse(false);\n    }\n\n    private boolean clickGeSearchResultSafely(String itemName)\n    {'''
              ),
              (
                  '        return Rs2GrandExchange.isOpen() && geSetupOpen()\n            && geSetupChildVisible(GE_PRICE_X_CHILD)\n            && geSetupChildVisible(GE_QUANTITY_X_CHILD);',
                  '        return Rs2GrandExchange.isOpen() && geSetupOpen()\n            && geSelectedOfferReady()\n            && geSetupChildVisible(GE_PRICE_X_CHILD)\n            && geSetupChildVisible(GE_QUANTITY_X_CHILD);'
              ),
          ]

          for index, (old, new) in enumerate(replacements, 1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {index}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify Jewelry GE selection state guard
        shell: python
        run: |
          from pathlib import Path
          text = Path('kspjewelrycrafter/KspJewelryCrafterScript.java').read_text(encoding='utf-8')
          assert 'GE_SELECTED_PRICE_CHILD = 41' in text
          assert 'private boolean geSelectedOfferReady()' in text
          assert 'for (int attempt = 1; attempt <= 3; attempt++)' in text
          assert '&& geSelectedOfferReady()' in text
          assert 'GE item did not select: ' in text
          assert 'return sleepUntil(this::geSetupControlsReady, 3_500);' not in text

      - name: Commit source and remove workflow
        run: |
          rm .github/workflows/apply-jewelry-ge-search-selection-v0120.yml
          git config user.name "KSPOG"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspjewelrycrafter/KspJewelryCrafterScript.java .github/workflows/apply-jewelry-ge-search-selection-v0120.yml
          git commit -m "Fix Jewelry Crafter GE search result selection"
          git push origin HEAD:fix/jewelry-ge-search-selection-v0120
