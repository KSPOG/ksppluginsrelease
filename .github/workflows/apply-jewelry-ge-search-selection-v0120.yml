name: Apply Jewelry GE Search Selection Fix
on:
  push:
    branches:
      - fix/jewelry-ge-search-selection-v0120
    paths:
      - .github/workflows/apply-jewelry-ge-search-selection-v0120.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-ge-search-selection-v0120
          fetch-depth: 0
      - name: Patch Jewelry GE item selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          text = path.read_text()

          old = '''    private static final int GE_SEARCH_GROUP = 162;
    private static final int GE_SEARCH_PROMPT_CHILD = 52;
    private static final int GE_PRICE_CLICK_DELAY_MIN_MS = 650;'''
          new = '''    private static final int GE_SEARCH_GROUP = 162;
    private static final int GE_SEARCH_PROMPT_CHILD = 52;
    private static final int GE_SELECTED_PRICE_CHILD = 41;
    private static final int GE_PRICE_CLICK_DELAY_MIN_MS = 650;'''
          assert text.count(old) == 1, 'GE constants anchor changed'
          text = text.replace(old, new, 1)

          old = '''    private boolean selectGeBuyItem(String itemName)
    {
        if (!geSearchResultReady(itemName))
        {
            status = "Waiting for GE item search";
            if (!Rs2Widget.sleepUntilHasWidgetText(
                "Start typing the name of an item to search for it",
                GE_SEARCH_GROUP, GE_SEARCH_PROMPT_CHILD, false, 3_500))
                return false;

            Rs2Keyboard.typeString(itemName);
            if (!sleepUntil(() -> geSearchResultReady(itemName), 3_500))
                return false;
        }

        status = "Selecting GE item: " + itemName;
        if (!clickGeSearchResultSafely(itemName)) return false;
        return sleepUntil(this::geSetupControlsReady, 3_500);
    }
'''
          new = '''    private boolean selectGeBuyItem(String itemName)
    {
        if (geSelectedOfferReady()) return true;

        if (!geSearchResultReady(itemName))
        {
            status = "Waiting for GE item search";
            if (!Rs2Widget.sleepUntilHasWidgetText(
                "Start typing the name of an item to search for it",
                GE_SEARCH_GROUP, GE_SEARCH_PROMPT_CHILD, false, 3_500))
                return false;

            Rs2Keyboard.typeString(itemName);
            if (!sleepUntil(() -> geSearchResultReady(itemName), 3_500))
                return false;
        }

        for (int attempt = 1; attempt <= 3; attempt++)
        {
            if (geSelectedOfferReady()) return true;
            if (!geSearchResultReady(itemName))
            {
                if (sleepUntil(this::geSelectedOfferReady, 900)) return true;
                status = "Waiting for GE search result: " + itemName;
                continue;
            }

            status = attempt == 1
                ? "Selecting GE item: " + itemName
                : "Retrying GE item selection (" + attempt + "/3): " + itemName;
            sleep(250, 450);
            if (!clickGeSearchResultSafely(itemName))
            {
                sleep(250, 400);
                continue;
            }
            if (sleepUntil(this::geSelectedOfferReady, 2_000))
            {
                sleep(250, 450);
                return true;
            }
            sleep(300, 500);
        }

        status = "GE item did not select: " + itemName;
        return false;
    }
'''
          assert text.count(old) == 1, 'selectGeBuyItem anchor changed'
          text = text.replace(old, new, 1)

          old = '''    private boolean clickGeSearchResultSafely(String itemName)
    {'''
          helper = '''    private boolean geSelectedOfferReady()
    {
        return Microbot.getClientThread().runOnClientThreadOptional(() ->
        {
            Widget setup = Microbot.getClient().getWidget(InterfaceID.GeOffers.SETUP);
            if (setup == null || setup.isHidden()) return false;
            Widget itemPrice = setup.getChild(GE_SELECTED_PRICE_CHILD);
            if (itemPrice == null || itemPrice.isHidden()) return false;
            String text = itemPrice.getText();
            if (text == null || text.isBlank()) return false;
            for (int i = 0; i < text.length(); i++)
                if (Character.isDigit(text.charAt(i))) return true;
            return false;
        }).orElse(false);
    }

    private boolean clickGeSearchResultSafely(String itemName)
    {'''
          assert text.count(old) == 1, 'clickGeSearchResultSafely anchor changed'
          text = text.replace(old, helper, 1)

          old = '''    private boolean geSetupControlsReady()
    {
        return Rs2GrandExchange.isOpen() && geSetupOpen()
            && geSetupChildVisible(GE_PRICE_X_CHILD)
            && geSetupChildVisible(GE_QUANTITY_X_CHILD);
    }'''
          new = '''    private boolean geSetupControlsReady()
    {
        return Rs2GrandExchange.isOpen() && geSetupOpen()
            && geSelectedOfferReady()
            && geSetupChildVisible(GE_PRICE_X_CHILD)
            && geSetupChildVisible(GE_QUANTITY_X_CHILD);
    }'''
          assert text.count(old) == 1, 'geSetupControlsReady anchor changed'
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Verify Jewelry GE selection state guard
        shell: python
        run: |
          from pathlib import Path
          text = Path('kspjewelrycrafter/KspJewelryCrafterScript.java').read_text()
          assert 'private static final int GE_SELECTED_PRICE_CHILD = 41;' in text
          assert 'private boolean geSelectedOfferReady()' in text
          assert 'for (int attempt = 1; attempt <= 3; attempt++)' in text
          assert '&& geSelectedOfferReady()' in text
          assert 'GE item did not select: ' in text
          assert 'return sleepUntil(this::geSetupControlsReady, 3_500);' not in text
      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-jewelry-ge-search-selection-v0120.yml
          git config user.name "KSPOG"
          git config user.email "kratosmaximusosrs@gmail.com"
          git add kspjewelrycrafter/KspJewelryCrafterScript.java .github/workflows/apply-jewelry-ge-search-selection-v0120.yml
          git commit -m "Fix Jewelry Crafter GE search result selection"
          git push origin HEAD:fix/jewelry-ge-search-selection-v0120