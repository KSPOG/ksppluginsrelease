name: Patch Smart Smelter Edgeville direct interaction

on:
  push:
    branches:
      - fix-smart-smelter-edgeville-direct-interact

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[smart-smelter-edgeville-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Smart Smelter patch
        run: python .github/scripts/patch_smart_smelter_edgeville.py
      - name: Commit Smart Smelter patch
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: direct interact Edgeville bank and furnace [smart-smelter-edgeville-done]"
          git push
