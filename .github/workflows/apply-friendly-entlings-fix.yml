name: Apply Friendly Entlings fix

on:
  push:
    branches:
      - fix/chopper-friendly-entlings-2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[entlings-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chopper-friendly-entlings-2
      - name: Patch Friendly Entlings handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patch anchor not found in {path}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ent = Path('kspwillowchopper/forestry/KspEntlingsEvent.java')
          text = ent.read_text(encoding='utf-8')
          text = text.replace('import java.util.Comparator;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Objects;\n',
                              'import java.util.Comparator;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Map;\nimport java.util.Objects;\n')
          start = text.index('    @Override\n    public boolean execute() {')
          end = text.index('    private List<Rs2NpcModel> getRegularEntlings() {', start)
          new_execute = '''    @Override\n    public boolean execute() {\n        plugin.setCurrentForestryEvent(KspForestryEvent.FRIENDLY_ENTLINGS);\n        if (!plugin.ensureInventorySpace(2)) {\n            return true;\n        }\n\n        long deadline = System.currentTimeMillis() + MAX_EVENT_MS;\n        long lastClickMillis = 0L;\n        Map<Integer, Integer> actionPhaseByNpc = new HashMap<>();\n\n        while (plugin.isForestryEventEnabled(KspForestryEvent.FRIENDLY_ENTLINGS)\n                && Microbot.isLoggedIn()\n                && System.currentTimeMillis() < deadline) {\n            List<Rs2NpcModel> entlings = getRegularEntlings();\n            if (entlings.isEmpty()) {\n                break;\n            }\n\n            entlings.sort(Comparator.comparingInt(entling ->\n                    entling.getWorldLocation().distanceTo(Rs2Player.getWorldLocation())));\n\n            boolean interacted = false;\n            for (Rs2NpcModel target : entlings) {\n                if (target == null) {\n                    continue;\n                }\n\n                String request = normalizeRequest(target.getOverheadText());\n                String[] actions = actionsForRequest(request);\n                if (actions.length == 0) {\n                    continue;\n                }\n\n                long now = System.currentTimeMillis();\n                if (now - lastClickMillis < CLICK_COOLDOWN_MS) {\n                    sleep(Math.min(100L, CLICK_COOLDOWN_MS - (now - lastClickMillis)));\n                    break;\n                }\n                if (Rs2Player.isMoving() || Rs2Player.isAnimating(800)) {\n                    sleep(80);\n                    break;\n                }\n\n                // Requests containing two regions must actually service both regions.\n                // Rotate between the valid actions for that exact entling until it morphs\n                // into its pruned NPC form. This prevents repeatedly pruning only Back/Top.\n                int phase = actionPhaseByNpc.getOrDefault(target.getIndex(), 0);\n                String action = actions[phase % actions.length];\n\n                // Re-read immediately before clicking so we never use an action chosen\n                // from stale overhead text after a server-side update.\n                String currentRequest = normalizeRequest(target.getOverheadText());\n                String[] currentActions = actionsForRequest(currentRequest);\n                if (currentActions.length == 0) {\n                    continue;\n                }\n                if (!Objects.equals(request, currentRequest)) {\n                    phase = 0;\n                    action = currentActions[0];\n                } else {\n                    action = currentActions[phase % currentActions.length];\n                }\n\n                int idBefore = target.getId();\n                if (!target.click(action)) {\n                    // If a dual-region request changed its active menu ordering during\n                    // the tick, try the other valid action before giving up this pass.\n                    if (currentActions.length > 1) {\n                        String alternate = currentActions[(phase + 1) % currentActions.length];\n                        if (!target.click(alternate)) {\n                            lastClickMillis = now;\n                            sleep(180);\n                            continue;\n                        }\n                        action = alternate;\n                        phase++;\n                    } else {\n                        lastClickMillis = now;\n                        sleep(180);\n                        continue;\n                    }\n                }\n\n                plugin.markForestryInteraction(target.getHash(), action);\n                actionPhaseByNpc.put(target.getIndex(), phase + 1);\n                lastClickMillis = System.currentTimeMillis();\n                interacted = true;\n\n                final Rs2NpcModel clickedTarget = target;\n                final int clickedId = idBefore;\n                sleepUntil(() -> clickedTarget.getId() != clickedId\n                        || Rs2Player.isAnimating(), 1_800);\n                if (Rs2Player.isAnimating()) {\n                    sleepUntil(() -> !Rs2Player.isAnimating(), 3_000);\n                }\n\n                // Refresh the NPC cache after every successful prune. Entlings roam and\n                // eventually morph to the pruned ID, so stale model/index locks are unsafe.\n                break;\n            }\n\n            if (!interacted) {\n                sleep(100);\n            }\n        }\n\n        if (getRegularEntlings().isEmpty()) {\n            plugin.completeForestryEvent(KspForestryEvent.FRIENDLY_ENTLINGS);\n        }\n        return true;\n    }\n\n'''
          text = text[:start] + new_execute + text[end:]
          old_actions = '''    private String actionForRequest(String request) {\n        if (request == null || request.isEmpty()) {\n            return null;\n        }\n\n        switch (request) {\n            case "Breezy at the back!":\n                return "Prune-back";\n            case "Short on top!":\n                return "Prune-top";\n            case "A leafy mullet!":\n                return "Prune-top";\n            case "Short back and sides!":\n                return "Prune-back";\n            default:\n                return null;\n        }\n    }\n'''
          new_actions = '''    private String[] actionsForRequest(String request) {\n        if (request == null || request.isEmpty()) {\n            return new String[0];\n        }\n\n        switch (request) {\n            case "Breezy at the back!":\n                return new String[]{"Prune-back"};\n            case "Short on top!":\n                return new String[]{"Prune-top"};\n            case "A leafy mullet!":\n                return new String[]{"Prune-top", "Prune-sides"};\n            case "Short back and sides!":\n                return new String[]{"Prune-back", "Prune-sides"};\n            default:\n                return new String[0];\n        }\n    }\n'''
          if old_actions not in text:
              raise SystemExit('Entlings action mapping anchor not found')
          text = text.replace(old_actions, new_actions, 1)
          ent.write_text(text, encoding='utf-8')

          script = Path('kspwillowchopper/KspWillowChopperScript.java')
          replace_once(script,
              '    public void notifyFireBurnedOut() {\n',
              '''    public void enterForestryEvent(KspForestryEvent event) {\n        if (!sessionStarted || event == null || event == KspForestryEvent.NONE) {\n            return;\n        }\n        clearActiveTreeTarget();\n        clearActiveCampfireTarget();\n        burningActive = false;\n        state = RuntimeState.FORESTRY;\n        status = "Forestry: " + event;\n    }\n\n    public void notifyFireBurnedOut() {\n''')

          plugin = Path('kspwillowchopper/KspWillowChopperPlugin.java')
          replace_once(plugin,
              '''    public void setCurrentForestryEvent(KspForestryEvent event) {\n        currentForestryEvent = event == null ? KspForestryEvent.NONE : event;\n    }\n''',
              '''    public void setCurrentForestryEvent(KspForestryEvent event) {\n        currentForestryEvent = event == null ? KspForestryEvent.NONE : event;\n        if (currentForestryEvent != KspForestryEvent.NONE && script != null) {\n            script.enterForestryEvent(currentForestryEvent);\n        }\n    }\n''')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspwillowchopper/KspWillowChopperPlugin.java kspwillowchopper/KspWillowChopperScript.java kspwillowchopper/forestry/KspEntlingsEvent.java
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: complete Friendly Entlings pruning logic [entlings-fixed]"
          git push origin HEAD:fix/chopper-friendly-entlings-2
