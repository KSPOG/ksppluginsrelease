name: One-shot patch Romeo dialogue

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-patch-romeo.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/romeo-dialogue-release
      - name: Patch Romeo script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java')
          s = p.read_text(encoding='utf-8')
          marker = '        if (!Rs2Dialogue.hasSelectAnOption()) return true;\n\n        // Apothecary quest branch must beat his normal potion menu.\n'
          replacement = '''        if (!Rs2Dialogue.hasSelectAnOption()) return true;

        // Romeo can leave this informational menu open after stage 0 advances.
        // It blocks movement, so close only this stale post-start menu.
        if (stage > STAGE_NOT_STARTED && isStaleRomeoInfoMenu())
        {
            if (clickOptionPartial("Ok, thanks"))
            {
                status = "Closing finished Romeo dialogue";
                return true;
            }
        }

        // Apothecary quest branch must beat his normal potion menu.
'''
          if marker not in s:
              raise SystemExit('dialogue marker not found')
          s = s.replace(marker, replacement, 1)
          marker2 = '''    private boolean clickOption(String option)
    {
        if (!Rs2Dialogue.hasDialogueOption(option, true)) return false;
        Rs2Dialogue.clickOption(option, true);
        lastActionAtMs = System.currentTimeMillis();
        return true;
    }
'''
          replacement2 = marker2 + '''
    private boolean clickOptionPartial(String option)
    {
        if (!Rs2Dialogue.hasDialogueOption(option, false)) return false;
        Rs2Dialogue.clickOption(option, false);
        lastActionAtMs = System.currentTimeMillis();
        return true;
    }

    private boolean isStaleRomeoInfoMenu()
    {
        return Rs2Dialogue.hasDialogueOption("Where can I find Juliet", false)
                || Rs2Dialogue.hasDialogueOption("anything else you can tell me about Juliet", false);
    }
'''
          if marker2 not in s:
              raise SystemExit('clickOption marker not found')
          p.write_text(s.replace(marker2, replacement2, 1), encoding='utf-8')
          PY
      - name: Commit patch to feature branch
        run: |
          git config user.name 'KSP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java
          git commit -m 'Fix Romeo post-start dialogue blocking walker'
          git push origin HEAD:fix/romeo-dialogue-release
