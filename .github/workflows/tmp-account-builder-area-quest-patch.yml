name: Temporary Account Builder area and quest patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-account-builder-area-quest-patch.yml'

permissions:
  contents: write

jobs:
  patch-mining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mining-high-tier-areas
          fetch-depth: 0
      - name: Patch MiningScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java')
          s = p.read_text()

          s = s.replace('private static final int MID_TIER_RANDOM_MAX_LEVEL = 60;',
                        'private static final int MID_TIER_RANDOM_MAX_LEVEL = 55;')

          old = '''    private Areas targetArea = Areas.TIN_COPPER_VARROCK_EAST;
    private Areas selectedTinCopperArea = Areas.TIN_COPPER_VARROCK_EAST;
    private Areas selectedIronArea = Areas.IRON_VARROCK_EAST;
'''
          new = '''    private Areas targetArea = Areas.TIN_COPPER_VARROCK_EAST;
    private Areas selectedTinCopperArea = Areas.TIN_COPPER_VARROCK_EAST;
    private Areas selectedIronArea = Areas.IRON_VARROCK_EAST;
    private Areas selectedCoalArea = Areas.COAL_BARBARIAN_VILLAGE;
    private Areas selectedGoldArea = Areas.GOLD_RIMMINGTON;
    private Areas selectedMithrilArea = Areas.MITHRIL_DWARVEN_MINE;
    private Areas selectedAdamantArea = Areas.ADAMANT_DWARVEN_MINE;
'''
          assert old in s, 'mining area fields not found'
          s = s.replace(old, new, 1)

          old = '''        this.selectedTinCopperArea = Areas.randomTinCopperArea();
        this.selectedIronArea = Areas.randomIronArea();
        this.targetArea = progressiveMining ? selectedTinCopperArea : area;
        debug("Selected mining areas | tinCopper={} iron={}", selectedTinCopperArea.getDisplayName(), selectedIronArea.getDisplayName());
'''
          new = '''        this.selectedTinCopperArea = Areas.randomTinCopperArea();
        this.selectedIronArea = Areas.randomIronArea();
        this.selectedCoalArea = Areas.randomCoalArea();
        this.selectedGoldArea = Areas.randomGoldArea();
        this.selectedMithrilArea = Areas.randomMithrilArea();
        this.selectedAdamantArea = Areas.randomAdamantArea();
        this.targetArea = progressiveMining ? selectedTinCopperArea : area;
        debug("Selected mining areas | tinCopper={} iron={} coal={} gold={} mithril={} adamant={}",
                selectedTinCopperArea.getDisplayName(),
                selectedIronArea.getDisplayName(),
                selectedCoalArea.getDisplayName(),
                selectedGoldArea.getDisplayName(),
                selectedMithrilArea.getDisplayName(),
                selectedAdamantArea.getDisplayName());
'''
          assert old in s, 'run area selection block not found'
          s = s.replace(old, new, 1)

          start = s.index('    private Areas resolveTargetArea(int miningLevel)')
          end = s.index('    private RockLevel resolveTargetRock(int miningLevel)', start)
          s = s[:start] + '''    private Areas resolveTargetArea(int miningLevel)
    {
        RockLevel targetRock = resolveTargetRock(miningLevel);

        if (targetRock == RockLevel.ADAMANT)
        {
            return selectedAdamantArea;
        }

        if (targetRock == RockLevel.MITHRIL)
        {
            return selectedMithrilArea;
        }

        if (targetRock == RockLevel.GOLD)
        {
            return selectedGoldArea;
        }

        if (targetRock == RockLevel.COAL)
        {
            return selectedCoalArea;
        }

        if (targetRock == RockLevel.SILVER)
        {
            return Areas.SILVER_VARROCK_WEST;
        }

        if (targetRock == RockLevel.IRON)
        {
            return selectedIronArea;
        }

        return selectedTinCopperArea;
    }

''' + s[end:]

          start = s.index('    private RockLevel resolveTargetRock(int miningLevel)')
          end = s.index('    private boolean shouldRandomizeMidTierRock(int miningLevel)', start)
          s = s[:start] + '''    private RockLevel resolveTargetRock(int miningLevel)
    {
        if (startingTargetRockInitialized && randomMidTierRock != null)
        {
            return randomMidTierRock;
        }

        if (miningLevel >= RockLevel.ADAMANT.getRequiredMiningLevel())
        {
            return RockLevel.ADAMANT;
        }

        if (miningLevel >= RockLevel.MITHRIL.getRequiredMiningLevel())
        {
            return RockLevel.MITHRIL;
        }

        if (miningLevel >= RockLevel.COAL.getRequiredMiningLevel())
        {
            return RockLevel.COAL;
        }

        if (miningLevel >= RockLevel.SILVER.getRequiredMiningLevel())
        {
            if (canMineSilverSafely())
            {
                return RockLevel.SILVER;
            }

            return canMineSelectedIronSafely() ? RockLevel.IRON : null;
        }

        if (miningLevel >= RockLevel.IRON.getRequiredMiningLevel())
        {
            return canMineSelectedIronSafely() ? RockLevel.IRON : null;
        }

        return null;
    }

''' + s[end:]

          p.write_text(s)
          PY
      - name: Commit Mining changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java
          if ! git diff --cached --quiet; then
            git commit -m "Use random high-tier mining areas"
            git push origin HEAD:feature/mining-high-tier-areas
          fi

  patch-romeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/romeo-cadava-bank-loop-v2
          fetch-depth: 0
      - name: Patch Romeo bank ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java')
          s = p.read_text()
          old = '''        // Task handoffs can start this quest while a previous bank interface is
        // still open. Close it before any quest movement so the walker is never
        // blocked by the bank widget.
        if (stage > STAGE_NOT_STARTED && Rs2Bank.isOpen())
        {
            state = RomeoState.PREPARING;
            status = "Closing bank before quest route";
            KspWalkerGuard.clear(WALK_JULIET);
            if (System.currentTimeMillis() - lastBankActionAtMs >= BANK_ACTION_COOLDOWN_MS)
            {
                Rs2Bank.closeBank();
                lastBankActionAtMs = System.currentTimeMillis();
            }
            return;
        }
'''
          new = '''        // A previous task may hand the quest an already-open bank. Before closing
        // it, use that live bank once to resolve Cadava berries. More importantly,
        // when ensureCadavaBerries() opens a bank itself, do not immediately close
        // it on the next tick; the Cadava preparation owns the bank until the
        // lookup/withdrawal has completed.
        if (stage > STAGE_NOT_STARTED && Rs2Bank.isOpen())
        {
            boolean mayStillNeedCadava = stage <= STAGE_JULIET_POTION
                    && !cadavaBankChecked
                    && !has(Inv.CADAVA_BERRIES)
                    && !has(Inv.CADAVA_POTION);

            if (mayStillNeedCadava)
            {
                ensureCadavaBerries();
                return;
            }

            state = RomeoState.PREPARING;
            status = "Closing bank before quest route";
            KspWalkerGuard.clear(WALK_JULIET);
            if (System.currentTimeMillis() - lastBankActionAtMs >= BANK_ACTION_COOLDOWN_MS)
            {
                Rs2Bank.closeBank();
                lastBankActionAtMs = System.currentTimeMillis();
            }
            return;
        }
'''
          assert old in s, 'Romeo bank handoff block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit Romeo changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix Romeo Cadava bank open-close loop"
            git push origin HEAD:fix/romeo-cadava-bank-loop-v2
          fi
