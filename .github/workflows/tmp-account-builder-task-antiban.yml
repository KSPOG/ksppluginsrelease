name: Temporary Account Builder task antiban

on:
  push:
    branches: [ feature/account-builder-task-antiban ]
    paths:
      - '.github/workflows/tmp-account-builder-task-antiban.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/account-builder-task-antiban
          fetch-depth: 0
      - name: Apply task-specific antiban profiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('kspaccountbuilder/KspAccountBuilderScript.java')
          s = p.read_text()

          old = '''    private boolean startTask(BuilderTask task)\n    {\n        if (task == null) return false;\n        stopAllTaskScriptsExcept(task);\n'''
          new = '''    private boolean startTask(BuilderTask task)\n    {\n        if (task == null) return false;\n        applyAntibanForTask(task);\n        stopAllTaskScriptsExcept(task);\n'''
          assert old in s, 'startTask hook not found'
          s = s.replace(old, new, 1)

          marker = '''    private void applyAntibanSettings()\n    {\n        Rs2Antiban.resetAntibanSettings(true);\n        if (!config.useAntiban()) { debug("Antiban disabled by configuration"); return; }\n        Rs2Antiban.antibanSetupTemplates.applyUniversalAntibanSetup();\n        for (PlayStyle playStyle : PlayStyle.values()) playStyle.resetPlayStyle();\n'''
          assert marker in s, 'applyAntibanSettings marker not found'

          # Insert task-specific selector immediately before the existing global setup.
          helper = '''    private void applyAntibanForTask(BuilderTask task)\n    {\n        if (task == null || config == null || !config.useAntiban()) return;\n\n        // Microbot exposes dedicated antiban templates per training activity.\n        // Apply the template when a task starts so activity-specific behavior follows\n        // the skill being trained instead of keeping one universal profile forever.\n        switch (task)\n        {\n            case RUNE_ESSENCE:\n            case MINING:\n                Rs2Antiban.antibanSetupTemplates.applyMiningSetup();\n                break;\n            case WOODCUTTING:\n                Rs2Antiban.antibanSetupTemplates.applyWoodcuttingSetup();\n                break;\n            case FIREMAKING:\n                Rs2Antiban.antibanSetupTemplates.applyFiremakingSetup();\n                break;\n            case FISHING:\n                Rs2Antiban.antibanSetupTemplates.applyFishingSetup();\n                break;\n            case COOKING:\n                Rs2Antiban.antibanSetupTemplates.applyCookingSetup();\n                break;\n            case CRAFTING:\n                Rs2Antiban.antibanSetupTemplates.applyCraftingSetup();\n                break;\n            case MELEE:\n            case STRONGHOLD_OF_SECURITY:\n                Rs2Antiban.antibanSetupTemplates.applyCombatSetup();\n                break;\n            case SMITHING:\n            case SMELTING:\n                Rs2Antiban.antibanSetupTemplates.applySmithingSetup();\n                break;\n            default:\n                // Tutorial Island, quests and GE tasks are mixed/general activities.\n                Rs2Antiban.antibanSetupTemplates.applyUniversalAntibanSetup();\n                break;\n        }\n\n        debug("Applied task-specific antiban profile | task={}", task);\n    }\n\n'''
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/KspAccountBuilderScript.java
          git commit -m "Apply skill-specific antiban profiles per Account Builder task"
          git push origin HEAD:feature/account-builder-task-antiban
