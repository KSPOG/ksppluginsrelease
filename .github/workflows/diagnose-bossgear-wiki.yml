name: Apply Boss Gear resolver fix

on:
  push:
    branches:
      - fix/bossgear-phosani-parser
    paths:
      - .github/bossgear-resolver-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bossgear-phosani-parser
      - name: Apply resolver patch
        run: python .github/scripts/fix_bossgear_resolver.py
      - name: Commit source fix
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspbossgear/BossGearService.java kspbossgear/KspBossGearPlugin.java
          git commit -m "fix: resolve Wiki loadout item IDs reliably" || exit 0
          git push origin HEAD:fix/bossgear-phosani-parser
