name: Build KSP High Alch Trader

on:
  pull_request:
    paths:
      - 'kspf2phighalchtrader/**'
      - '.github/tests/high-alch-trader/**'
      - 'kspsupport/**'
      - 'kspbank/**'
      - '.github/workflows/high-alch-trader-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'kspf2phighalchtrader/**'
      - '.github/tests/high-alch-trader/**'
      - 'kspsupport/**'
      - 'kspbank/**'
      - '.github/workflows/high-alch-trader-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile KspF2PHighAlchTraderPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release
      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify GE-only behavior across trader, reserve guard and mule
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspf2phighalchtrader')
          trader = (root / 'KspF2PHighAlchTraderScript.java').read_text()
          reserve = (root / 'KspHighAlchBankReserveGuard.java').read_text()
          mule = (root / 'KspHighAlchMuleService.java').read_text()
          access = (root / 'KspHighAlchGeAccess.java').read_text()
          plugin = (root / 'KspF2PHighAlchTraderPlugin.java').read_text()
          assert 'VERSION = "0.3.9"' in plugin
          for label, code in [('trader', trader), ('reserve', reserve), ('mule', mule)]:
              assert 'KspVerifiedBank' not in code, label + ' still accesses generic bank booth'
              assert 'Rs2Bank.openBank()' not in code, label + ' still uses generic bank scan'
              assert 'KspHighAlchGeAccess.openLocalBank()' in code, label + ' does not use GE banker'
          assert 'Rs2GrandExchange.openExchange()' not in trader, 'Generic GE opener may trigger walker'
          assert 'KspHighAlchGeAccess.openLocalExchange()' in trader, 'Trader must use GE clerk'
          assert 'BankLocation.GRAND_EXCHANGE.getWorldPoint()' in trader
          assert 'Rs2GrandExchange.walkToGrandExchange()' in trader
          assert 'ensureInsideGrandExchange()' in trader
          assert 'ksp_high_alch_ge_only' in trader
          assert 'KspHighAlchGeAccess.isInGrandExchange(muleTile)' in mule
          assert 'KspHighAlchGeAccess.isInGrandExchange(Rs2Player.getWorldLocation())' in mule
          assert 'new NewMenuEntry()' in access and 'Microbot.doInvoke(entry' in access
          assert 'MIN_X = 3153' in access and 'MAX_Y = 3502' in access
          print('PASS: High Alch GE-only bankers, clerks, routes, reserve guard and mule')

      - name: Verify GE clerk readiness, invalid item filtering and bounded quantity failures
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspf2phighalchtrader')
          access = (root / 'KspHighAlchGeAccess.java').read_text()
          script = (root / 'KspF2PHighAlchTraderScript.java').read_text()
          catalog = (root / 'F2PAlchCatalog.java').read_text()
          assert 'Rs2Inventory.isItemSelected()' in access
          assert 'Microbot.getMouse().click();' in access
          assert 'lastDiagnostic = inspection[0]' in access
          assert 'npc.getTransformedComposition()' in access
          assert 'NPC_ACTIONS[selectedOption].getId()' in access
          assert '.setWorldViewId(view.getId()).actor(selected)' in access
          assert 'Rs2Camera.turnTo(npc)' in access
          assert 'return isInGrandExchange(player) && isInGrandExchange(actor)' in access
          assert 'lastDiagnostic()' in script
          assert 'GE Clerk interaction not confirmed' in script
          assert 'Rs2Bank.isBankPinWidgetVisible()' in script
          assert 'GE quantity/offer setup failed 3 times' in script
          assert 'offerSetupFailures >= 3' in script
          assert 'nextOfferSetupAttemptAt' in script
          assert 'pendingQuantity + " x "' in script
          assert 'UNOBTAINABLE_IDS = Set.of(31454)' in catalog
          assert 'result.removeAll(UNOBTAINABLE_IDS)' in catalog
          assert 'availableF2p.removeAll(UNOBTAINABLE_IDS)' in catalog
          assert 'availableMembers.removeAll(UNOBTAINABLE_IDS)' in catalog
          print('PASS: live GE clerk action, item deselection, bounded offer setup and item 31454 exclusion')

      - name: Install plugin and shared KSP sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          for component in kspf2phighalchtrader kspsupport kspbank; do
            rm -rf "$ROOT/$component"
            cp -R "release/$component" "$ROOT/$component"
          done
      - name: Include shared source directories
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = needle + """
                    if (plugin.name == "KspF2PHighAlchTraderPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                        include "${project.ext.getPluginsIncludePath()}/kspbank/**"
                    }"""
          if needle not in text:
              raise SystemExit('Could not locate source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Install High Alch GE regression tests
        shell: bash
        run: |
          set -euo pipefail
          DEST='hub/src/test/java/net/runelite/client/plugins/microbot/kspf2phighalchtrader'
          mkdir -p "$DEST"
          cp release/.github/tests/high-alch-trader/KspHighAlchGeAccessRegressionTest.java.txt "$DEST/KspHighAlchGeAccessRegressionTest.java"
          cat > "$DEST/KspHighAlchGeJUnitTest.java" <<'EOF'
          package net.runelite.client.plugins.microbot.kspf2phighalchtrader;

          import org.junit.jupiter.api.Test;

          class KspHighAlchGeJUnitTest {
              @Test void geNpcAndBoundaryRegression() {
                  KspHighAlchGeAccessRegressionTest.main(new String[0]);
              }
          }
          EOF

      - name: Compile High Alch Trader
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspF2PHighAlchTraderPlugin --stacktrace --no-daemon

      - name: Verify compiled JAR
        shell: bash
        run: |
          ls -lh hub/build/libs
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspF2PHighAlchTraderPlugin-*.jar' -print -quit)"

      - name: Upload compiled High Alch Trader JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspF2PHighAlchTraderPlugin-${{ github.sha }}
          path: hub/build/libs/KspF2PHighAlchTraderPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
