name: Temporary performance pass validation

on:
  push:
    branches:
      - perf/reduce-memory-improve-action-timing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/reduce-memory-improve-action-timing
      - name: Parse all Java sources
        shell: bash
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-java
          python3 <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_java

          parser = Parser(Language(tree_sitter_java.language()))
          failures = []
          files = sorted(Path(".").rglob("*.java"))
          for path in files:
              tree = parser.parse(path.read_bytes())
              if tree.root_node.has_error:
                  failures.append(str(path))
          print(f"Parsed Java files: {len(files)}")
          if failures:
              print("Syntax failures:")
              print("\n".join(failures))
              raise SystemExit(1)
          PY
      - name: Validate no whitespace errors
        run: git diff --check HEAD^ -- .
