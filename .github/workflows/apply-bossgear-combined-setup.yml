name: Apply Boss Gear combined setup

on:
  push:
    branches:
      - fix/bossgear-combined-setup
    paths:
      - .github/bossgear-combined-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bossgear-combined-setup
      - name: Pair equipment with compatible inventory setups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('kspbossgear/BossGearService.java')
          text = service.read_text(encoding='utf-8')

          text = text.replace(
              '    private volatile String selectedMethod;\n    private volatile GearTier selectedTier = GearTier.MID;\n',
              '    private volatile String selectedMethod;\n    private volatile String selectedInventoryMethod;\n    private volatile GearTier selectedTier = GearTier.MID;\n',
              1)

          old_load = '''                        page = loaded;\n                        selectedMethod = loaded.getMethods().isEmpty() ? null : loaded.getMethods().get(0).getName();\n                        rebuildSelection();\n'''
          new_load = '''                        page = loaded;\n                        List<String> equipmentMethods = getMethodNames();\n                        selectedMethod = equipmentMethods.isEmpty() ? null : equipmentMethods.get(0);\n                        selectedInventoryMethod = null;\n                        ensureSelectedInventoryMethod();\n                        rebuildSelection();\n'''
          if old_load not in text:
              raise SystemExit('load selection anchor missing')
          text = text.replace(old_load, new_load, 1)

          old_set = '''    synchronized void setSelectedMethod(String method)\n    {\n        selectedMethod = method;\n        rebuildSelection();\n    }\n\n    synchronized void setSelectedTier(GearTier tier)\n'''
          new_set = '''    synchronized void setSelectedMethod(String method)\n    {\n        selectedMethod = method;\n        ensureSelectedInventoryMethod();\n        rebuildSelection();\n    }\n\n    synchronized void setSelectedInventoryMethod(String method)\n    {\n        selectedInventoryMethod = method;\n        ensureSelectedInventoryMethod();\n        rebuildSelection();\n    }\n\n    synchronized void setSelectedTier(GearTier tier)\n'''
          if old_set not in text:
              raise SystemExit('set method anchor missing')
          text = text.replace(old_set, new_set, 1)

          old_get = '''    String getSelectedMethod()\n    {\n        return selectedMethod;\n    }\n\n    GearTier getSelectedTier()\n'''
          new_get = '''    String getSelectedMethod()\n    {\n        return selectedMethod;\n    }\n\n    String getSelectedInventoryMethod()\n    {\n        return selectedInventoryMethod;\n    }\n\n    GearTier getSelectedTier()\n'''
          if old_get not in text:
              raise SystemExit('get selected anchor missing')
          text = text.replace(old_get, new_get, 1)

          old_names = '''    List<String> getMethodNames()\n    {\n        WikiGearPage p = page;\n        if (p == null) return Collections.emptyList();\n        List<String> result = new ArrayList<>();\n        for (WikiGearPage.GearMethod method : p.getMethods()) result.add(method.getName());\n        return result;\n    }\n\n    HighlightKind classify(int itemId)\n'''
          new_names = '''    List<String> getMethodNames()\n    {\n        WikiGearPage p = page;\n        if (p == null) return Collections.emptyList();\n\n        List<String> equipment = new ArrayList<>();\n        for (WikiGearPage.GearMethod method : p.getMethods())\n        {\n            if (hasEquipmentRows(method)) equipment.add(method.getName());\n        }\n        if (!equipment.isEmpty()) return equipment;\n\n        // Inventory-only pages (some raid/setup pages) still need a primary selector.\n        List<String> fallback = new ArrayList<>();\n        for (WikiGearPage.GearMethod method : p.getMethods()) fallback.add(method.getName());\n        return fallback;\n    }\n\n    List<String> getInventoryMethodNames()\n    {\n        WikiGearPage p = page;\n        if (p == null) return Collections.emptyList();\n\n        WikiGearPage.GearMethod primary = findMethodExact(p, selectedMethod);\n        if (primary == null || !hasEquipmentRows(primary)) return Collections.emptyList();\n\n        String primaryStyle = styleSignature(primary.getName());\n        List<String> specific = new ArrayList<>();\n        List<String> generic = new ArrayList<>();\n        for (WikiGearPage.GearMethod method : p.getMethods())\n        {\n            if (!isInventoryOnly(method)) continue;\n            String inventoryStyle = styleSignature(method.getName());\n            if (!inventoryStyle.isEmpty() && !inventoryStyle.equals(primaryStyle)) continue;\n            if (inventoryStyle.isEmpty()) generic.add(method.getName());\n            else specific.add(method.getName());\n        }\n        specific.addAll(generic);\n        return specific;\n    }\n\n    private void ensureSelectedInventoryMethod()\n    {\n        List<String> choices = getInventoryMethodNames();\n        if (choices.isEmpty())\n        {\n            selectedInventoryMethod = null;\n            return;\n        }\n        if (selectedInventoryMethod != null)\n        {\n            for (String choice : choices)\n                if (choice.equalsIgnoreCase(selectedInventoryMethod)) return;\n        }\n        selectedInventoryMethod = choices.get(0);\n    }\n\n    private static boolean hasEquipmentRows(WikiGearPage.GearMethod method)\n    {\n        if (method == null) return false;\n        for (WikiGearPage.GearRow row : method.getRows())\n            if (row.getSlot() != GearSlot.UNKNOWN) return true;\n        return false;\n    }\n\n    private static boolean isInventoryOnly(WikiGearPage.GearMethod method)\n    {\n        if (method == null || method.getRows().isEmpty()) return false;\n        for (WikiGearPage.GearRow row : method.getRows())\n            if (row.getSlot() != GearSlot.UNKNOWN) return false;\n        return true;\n    }\n\n    private static WikiGearPage.GearMethod findMethodExact(WikiGearPage p, String name)\n    {\n        if (p == null || name == null) return null;\n        for (WikiGearPage.GearMethod method : p.getMethods())\n            if (method.getName().equalsIgnoreCase(name)) return method;\n        return null;\n    }\n\n    private static String styleSignature(String name)\n    {\n        String lower = name == null ? "" : name.toLowerCase(Locale.ROOT);\n        if (lower.contains("tribrid")) return "melee+ranged+magic";\n\n        List<String> styles = new ArrayList<>();\n        if (lower.contains("melee")) styles.add("melee");\n        if (lower.contains("ranged") || lower.contains("range ") || lower.endsWith("range")) styles.add("ranged");\n        if (lower.contains("magic") || lower.contains("mage")) styles.add("magic");\n        if (!styles.isEmpty()) return String.join("+", styles);\n        if (lower.contains("hybrid")) return "hybrid";\n        return "";\n    }\n\n    HighlightKind classify(int itemId)\n'''
          if old_names not in text:
              raise SystemExit('method names anchor missing')
          text = text.replace(old_names, new_names, 1)

          old_rebuild_head = '''        WikiGearPage.GearMethod method = p.findMethod(selectedMethod);\n        if (method == null)\n        {\n            selection = Selection.empty();\n            return;\n        }\n        selectedMethod = method.getName();\n\n        List<ResolvedGearRow> rows = new ArrayList<>();\n        Set<Integer> primary = new LinkedHashSet<>();\n        Set<Integer> alternatives = new LinkedHashSet<>();\n\n        for (WikiGearPage.GearRow sourceRow : method.getRows())\n        {\n            List<String> names = chooseTierColumn(sourceRow.getColumns(), selectedTier);\n            List<ItemRef> items = resolveCandidates(names);\n            if (items.isEmpty()) continue;\n\n            ItemRef first = items.get(0);\n            List<ItemRef> alts = items.size() > 1\n                ? new ArrayList<>(items.subList(1, items.size()))\n                : Collections.emptyList();\n            ResolvedGearRow resolved = new ResolvedGearRow(sourceRow.getSlot(), first, alts);\n            rows.add(resolved);\n            primary.add(first.id);\n            for (ItemRef alt : alts) alternatives.add(alt.id);\n        }\n\n        alternatives.removeAll(primary);\n        selection = new Selection(\n            p.getBossName(),\n            method.getName(),\n            selectedTier,\n            rows,\n            primary,\n            alternatives,\n            p.getSourceUrl());\n'''
          new_rebuild_head = '''        WikiGearPage.GearMethod method = findMethodExact(p, selectedMethod);\n        if (method == null)\n        {\n            selection = Selection.empty();\n            return;\n        }\n        selectedMethod = method.getName();\n        ensureSelectedInventoryMethod();\n\n        List<WikiGearPage.GearMethod> activeMethods = new ArrayList<>();\n        activeMethods.add(method);\n        if (hasEquipmentRows(method) && selectedInventoryMethod != null)\n        {\n            WikiGearPage.GearMethod inventory = findMethodExact(p, selectedInventoryMethod);\n            if (inventory != null && isInventoryOnly(inventory)) activeMethods.add(inventory);\n        }\n\n        List<ResolvedGearRow> rows = new ArrayList<>();\n        Set<Integer> primary = new LinkedHashSet<>();\n        Set<Integer> alternatives = new LinkedHashSet<>();\n\n        for (WikiGearPage.GearMethod activeMethod : activeMethods)\n        {\n            for (WikiGearPage.GearRow sourceRow : activeMethod.getRows())\n            {\n                List<String> names = chooseTierColumn(sourceRow.getColumns(), selectedTier);\n                List<ItemRef> items = resolveCandidates(names);\n                if (items.isEmpty()) continue;\n\n                ItemRef first = items.get(0);\n                List<ItemRef> alts = items.size() > 1\n                    ? new ArrayList<>(items.subList(1, items.size()))\n                    : Collections.emptyList();\n                ResolvedGearRow resolved = new ResolvedGearRow(sourceRow.getSlot(), first, alts);\n                rows.add(resolved);\n                primary.add(first.id);\n                for (ItemRef alt : alts) alternatives.add(alt.id);\n            }\n        }\n\n        alternatives.removeAll(primary);\n        selection = new Selection(\n            p.getBossName(),\n            method.getName(),\n            selectedTier,\n            rows,\n            primary,\n            alternatives,\n            p.getSourceUrl());\n'''
          if old_rebuild_head not in text:
              raise SystemExit('rebuild selection anchor missing')
          text = text.replace(old_rebuild_head, new_rebuild_head, 1)
          service.write_text(text, encoding='utf-8')

          panel = Path('kspbossgear/KspBossGearPanel.java')
          ptext = panel.read_text(encoding='utf-8')
          ptext = ptext.replace(
              '    private final JComboBox<String> methodCombo = new JComboBox<>();\n    private final JComboBox<GearTier> tierCombo = new JComboBox<>(GearTier.values());\n',
              '    private final JComboBox<String> methodCombo = new JComboBox<>();\n    private final JComboBox<String> inventoryCombo = new JComboBox<>();\n    private final JComboBox<GearTier> tierCombo = new JComboBox<>(GearTier.values());\n',
              1)

          old_setup = '''        configureCombo(methodCombo);\n        configureCombo(tierCombo);\n        setup.add(labeledControl("Method", methodCombo));\n        setup.add(Box.createVerticalStrut(2));\n        setup.add(labeledControl("Tier", tierCombo));\n'''
          new_setup = '''        configureCombo(methodCombo);\n        configureCombo(inventoryCombo);\n        configureCombo(tierCombo);\n        setup.add(labeledControl("Method", methodCombo));\n        setup.add(Box.createVerticalStrut(2));\n        setup.add(labeledControl("Inventory", inventoryCombo));\n        setup.add(Box.createVerticalStrut(2));\n        setup.add(labeledControl("Tier", tierCombo));\n'''
          if old_setup not in ptext:
              raise SystemExit('panel setup anchor missing')
          ptext = ptext.replace(old_setup, new_setup, 1)

          old_method_listener = '''        methodCombo.addActionListener(e -> {\n            if (updatingControls) return;\n            Object selected = methodCombo.getSelectedItem();\n            if (selected != null)\n            {\n                service.setSelectedMethod(selected.toString());\n                rebuildGearRows();\n            }\n        });\n        tierCombo.addActionListener(e -> {\n'''
          new_method_listener = '''        methodCombo.addActionListener(e -> {\n            if (updatingControls) return;\n            Object selected = methodCombo.getSelectedItem();\n            if (selected != null)\n            {\n                service.setSelectedMethod(selected.toString());\n                syncInventoryCombo();\n                rebuildGearRows();\n            }\n        });\n        inventoryCombo.addActionListener(e -> {\n            if (updatingControls) return;\n            Object selected = inventoryCombo.getSelectedItem();\n            service.setSelectedInventoryMethod(selected == null ? null : selected.toString());\n            rebuildGearRows();\n        });\n        tierCombo.addActionListener(e -> {\n'''
          if old_method_listener not in ptext:
              raise SystemExit('panel method listener anchor missing')
          ptext = ptext.replace(old_method_listener, new_method_listener, 1)

          old_apply = '''            List<String> methods = service.getMethodNames();\n            methodCombo.setModel(new DefaultComboBoxModel<>(methods.toArray(new String[0])));\n            methodCombo.setSelectedItem(service.getSelectedMethod());\n            tierCombo.setSelectedItem(service.getSelectedTier());\n            methodCombo.setEnabled(!methods.isEmpty());\n            tierCombo.setEnabled(!methods.isEmpty());\n'''
          new_apply = '''            List<String> methods = service.getMethodNames();\n            methodCombo.setModel(new DefaultComboBoxModel<>(methods.toArray(new String[0])));\n            methodCombo.setSelectedItem(service.getSelectedMethod());\n            List<String> inventories = service.getInventoryMethodNames();\n            inventoryCombo.setModel(new DefaultComboBoxModel<>(inventories.toArray(new String[0])));\n            inventoryCombo.setSelectedItem(service.getSelectedInventoryMethod());\n            tierCombo.setSelectedItem(service.getSelectedTier());\n            methodCombo.setEnabled(!methods.isEmpty());\n            inventoryCombo.setEnabled(!inventories.isEmpty());\n            tierCombo.setEnabled(!methods.isEmpty());\n'''
          if old_apply not in ptext:
              raise SystemExit('panel apply anchor missing')
          ptext = ptext.replace(old_apply, new_apply, 1)

          rebuild_anchor = '''    private void rebuildGearRows()\n    {\n        loadoutView.setSelection(service.getSelection());\n        refreshOwnership();\n    }\n\n    private void refreshStatus()\n'''
          rebuild_replacement = '''    private void rebuildGearRows()\n    {\n        loadoutView.setSelection(service.getSelection());\n        refreshOwnership();\n    }\n\n    private void syncInventoryCombo()\n    {\n        boolean previous = updatingControls;\n        updatingControls = true;\n        try\n        {\n            List<String> inventories = service.getInventoryMethodNames();\n            inventoryCombo.setModel(new DefaultComboBoxModel<>(inventories.toArray(new String[0])));\n            inventoryCombo.setSelectedItem(service.getSelectedInventoryMethod());\n            inventoryCombo.setEnabled(!inventories.isEmpty());\n        }\n        finally\n        {\n            updatingControls = previous;\n        }\n    }\n\n    private void refreshStatus()\n'''
          if rebuild_anchor not in ptext:
              raise SystemExit('panel rebuild anchor missing')
          ptext = ptext.replace(rebuild_anchor, rebuild_replacement, 1)

          ptext = ptext.replace(
              '        methodCombo.setEnabled(!loading && service.getPage() != null);\n        tierCombo.setEnabled(!loading && service.getPage() != null);\n',
              '        methodCombo.setEnabled(!loading && service.getPage() != null && !service.getMethodNames().isEmpty());\n        inventoryCombo.setEnabled(!loading && service.getPage() != null && !service.getInventoryMethodNames().isEmpty());\n        tierCombo.setEnabled(!loading && service.getPage() != null);\n',
              1)
          ptext = ptext.replace('        label.setPreferredSize(new Dimension(43, 24));\n', '        label.setPreferredSize(new Dimension(58, 24));\n', 1)
          panel.write_text(ptext, encoding='utf-8')

          plugin = Path('kspbossgear/KspBossGearPlugin.java')
          vtext = plugin.read_text(encoding='utf-8')
          if 'public static final String VERSION = "1.1.4";' not in vtext:
              raise SystemExit('version anchor missing')
          vtext = vtext.replace('public static final String VERSION = "1.1.4";', 'public static final String VERSION = "1.1.5";', 1)
          plugin.write_text(vtext, encoding='utf-8')
          PY
      - name: Verify combined setup wiring
        shell: bash
        run: |
          grep -q 'selectedInventoryMethod' kspbossgear/BossGearService.java
          grep -q 'getInventoryMethodNames' kspbossgear/BossGearService.java
          grep -q 'activeMethods.add(inventory)' kspbossgear/BossGearService.java
          grep -q 'JComboBox<String> inventoryCombo' kspbossgear/KspBossGearPanel.java
          grep -q 'labeledControl("Inventory", inventoryCombo)' kspbossgear/KspBossGearPanel.java
          grep -q 'VERSION = "1.1.5"' kspbossgear/KspBossGearPlugin.java
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspbossgear/BossGearService.java kspbossgear/KspBossGearPanel.java kspbossgear/KspBossGearPlugin.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: pair Boss Gear equipment with Wiki inventory setups"
          git push origin HEAD:fix/bossgear-combined-setup
