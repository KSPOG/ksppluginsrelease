name: Temporary Firemaking area patch

on:
  push:
    branches:
      - 'feature/firemaking-random-areas'
    paths:
      - '.github/workflows/_tmp_patch_cadava.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/firemaking-random-areas
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Firemaking area selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java')
          s = p.read_text()
          old = '        this.targetArea = area;\n'
          new = '''        this.targetArea = FireArea.randomArea();
        debug("Selected random Firemaking area | area={}", this.targetArea.getDisplayName());
'''
          if old not in s:
              raise SystemExit('target assignment not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java
          git commit -m "Randomize Firemaking area per task run"
          git push origin HEAD:feature/firemaking-random-areas
