name: Validate High Alch Trader v0.2.9

on:
  push:
    branches:
      - fix/high-alch-client-thread-fallback-v029

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-alch-client-thread-fallback-v029

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Compile High Alch Trader against Microbot
        shell: bash
        run: |
          rm -rf microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspf2phighalchtrader
          cp -R kspf2phighalchtrader microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspf2phighalchtrader
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/temp-high-alch-v029.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-high-alch-v029.yml
          git diff --cached --quiet || git commit -m "Remove temporary High Alch Trader v0.2.9 validation"
          git push origin HEAD:fix/high-alch-client-thread-fallback-v029
