name: Validate GE Looter v0.1.5
on:
  push:
    branches:
      - 'fix/ge-looter-hard-priority-area-v015'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ksp
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Inject GE Looter and compile
        shell: bash
        run: |
          set -euo pipefail
          pkg=microbot/client/src/main/java/net/runelite/client/plugins/microbot/KSPGELooter
          mkdir -p "$pkg"
          cp ksp/KSPGELooter/*.java "$pkg/"
          constants=microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java
          if [ ! -f "$constants" ]; then
            printf '%s\n' 'package net.runelite.client.plugins.microbot;' 'public final class PluginConstants {' '  public static final String KSP = "KSP ";' '  public static final boolean DEFAULT_ENABLED = false;' '  public static final boolean IS_EXTERNAL = true;' '}' > "$constants"
          fi
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon
