name: Patch AIO Fighter interrupt handling

on:
  push:
    branches:
      - fix-aio-fighter-client-thread-interrupt

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-aio-fighter-client-thread-interrupt
      - name: Patch AIO Fighter
        shell: python
        run: |
          from pathlib import Path

          script = Path('kspaiofighter/KspAioFighterScript.java')
          text = script.read_text()

          old = '''\t\tcatch (Exception ex)\n\t\t{\n\t\t\tlastError = ex.getClass().getSimpleName() + ": " + (ex.getMessage() == null ? "<no message>" : ex.getMessage());\n\t\t\tlastErrorMs = System.currentTimeMillis();\n\t\t\tlastAction = "Error";\n\t\t\tMicrobot.logStackTrace(getClass().getSimpleName(), ex);\n\t\t}\n\t\tfinally\n'''
          new = '''\t\tcatch (Exception ex)\n\t\t{\n\t\t\tif (isExpectedShutdownInterruption(generation, ex))\n\t\t\t{\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\tlastError = ex.getClass().getSimpleName() + ": " + (ex.getMessage() == null ? "<no message>" : ex.getMessage());\n\t\t\tlastErrorMs = System.currentTimeMillis();\n\t\t\tlastAction = "Error";\n\t\t\tMicrobot.logStackTrace(getClass().getSimpleName(), ex);\n\t\t}\n\t\tfinally\n'''
          if old not in text:
              raise SystemExit('loop catch block not found')
          text = text.replace(old, new, 1)

          marker = '''\tprivate boolean configureStartCameraIfNeeded()\n'''
          helper = '''\tprivate boolean isExpectedShutdownInterruption(long generation, Throwable throwable)\n\t{\n\t\tif (generation != runGeneration || Thread.currentThread().isInterrupted())\n\t\t{\n\t\t\treturn true;\n\t\t}\n\n\t\tfor (Throwable cause = throwable; cause != null; cause = cause.getCause())\n\t\t{\n\t\t\tif (cause instanceof InterruptedException)\n\t\t\t{\n\t\t\t\treturn true;\n\t\t\t}\n\n\t\t\tString message = cause.getMessage();\n\t\t\tif (message != null && message.toLowerCase(Locale.ROOT).contains("interrupted waiting for client thread"))\n\t\t\t{\n\t\t\t\treturn true;\n\t\t\t}\n\t\t}\n\n\t\treturn false;\n\t}\n\n'''
          if marker not in text:
              raise SystemExit('camera method marker not found')
          text = text.replace(marker, helper + marker, 1)
          script.write_text(text)

          plugin = Path('kspaiofighter/KspAioFighterPlugin.java')
          ptext = plugin.read_text()
          old_version = 'static final String version = "1.9.17";'
          new_version = 'static final String version = "1.9.18";'
          if old_version not in ptext:
              raise SystemExit('version marker not found')
          plugin.write_text(ptext.replace(old_version, new_version, 1))

          Path('.github/workflows/patch-aio-fighter-interrupt.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: treat AIO Fighter shutdown interrupt as cancellation"
          git push origin HEAD:fix-aio-fighter-client-thread-interrupt
