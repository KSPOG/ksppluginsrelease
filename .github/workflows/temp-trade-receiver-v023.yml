name: Validate Trade Receiver v0.2.3

on:
  push:
    branches:
      - fix/trade-receiver-counterparty-first-v023

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-receiver-counterparty-first-v023

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Patch Trade Receiver one-shot accept handshake
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('KSPTradeReceiver/KSPTradeReceiverScript.java')
          text = script_path.read_text()

          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit('Expected source block not found:\n' + old[:300])
              text = text.replace(old, new, 1)

          rep('''    private static final long FIRST_ACCEPT_COOLDOWN_MS = 900L;\n    private static final long CONFIRM_ACCEPT_COOLDOWN_MS = 900L;\n    private static final long REQUEST_RESPONSE_COOLDOWN_MS = 1_000L;''',
              '''    private static final long REQUEST_RESPONSE_COOLDOWN_MS = 1_000L;''')

          rep('''    private WorldPoint tradeTile;\n    private WorldPoint returnTile;\n    private long lastFirstAcceptAt;\n    private long lastConfirmAcceptAt;\n    private long lastRequestResponseAt;''',
              '''    private WorldPoint tradeTile;\n    private WorldPoint returnTile;\n    private boolean firstAcceptSent;\n    private boolean confirmationAcceptSent;\n    private boolean tradeWasOpen;\n    private long lastRequestResponseAt;''')

          rep('''                if (isTradeOpen())\n                {\n                    handleTradeScreens(currentConfig);\n                    return;\n                }''',
              '''                boolean tradeOpen = isTradeOpen();\n                if (tradeOpen)\n                {\n                    tradeWasOpen = true;\n                    handleTradeScreens(currentConfig);\n                    return;\n                }\n\n                if (tradeWasOpen)\n                {\n                    firstAcceptSent = false;\n                    confirmationAcceptSent = false;\n                    tradeWasOpen = false;\n                }''')

          rep('''        if (!otherPlayerHasAccepted(InterfaceID.Trademain.WHOLESCREEN))\n        {\n            status = "Waiting for " + displayConfiguredName(currentConfig.traderName()) + " to accept first screen";\n            return;\n        }\n\n        long now = System.currentTimeMillis();\n        if (now - lastFirstAcceptAt < FIRST_ACCEPT_COOLDOWN_MS)\n        {\n            status = "Counterparty accepted - waiting on first screen";\n            return;\n        }\n\n        if (Rs2Widget.clickWidget(InterfaceID.Trademain.ACCEPT))\n        {\n            lastFirstAcceptAt = now;\n            acceptedFirstScreens++;\n            status = "Counterparty accepted - accepted first screen";\n        }\n        else\n        {\n            status = "First-screen Accept unavailable";\n        }''',
              '''        boolean otherAccepted = otherPlayerHasAccepted(InterfaceID.Trademain.WHOLESCREEN);\n        if (!otherAccepted)\n        {\n            // Re-arm only after the counterparty's accepted state genuinely clears, for\n            // example because they changed their offer. Never lead the acceptance.\n            firstAcceptSent = false;\n            status = "Waiting for " + displayConfiguredName(currentConfig.traderName()) + " to accept first screen";\n            return;\n        }\n\n        if (firstAcceptSent)\n        {\n            status = "Counterparty accepted - first screen already accepted";\n            return;\n        }\n\n        if (Rs2Widget.clickWidget(InterfaceID.Trademain.ACCEPT))\n        {\n            firstAcceptSent = true;\n            acceptedFirstScreens++;\n            status = "Counterparty accepted - accepted first screen once";\n        }\n        else\n        {\n            status = "First-screen Accept unavailable";\n        }''')

          rep('''        if (!otherPlayerHasAccepted(InterfaceID.Tradeconfirm.UNIVERSE))\n        {\n            status = "Waiting for " + displayConfiguredName(currentConfig.traderName()) + " to accept confirmation";\n            return;\n        }\n\n        long now = System.currentTimeMillis();\n        if (now - lastConfirmAcceptAt < CONFIRM_ACCEPT_COOLDOWN_MS)\n        {\n            status = "Counterparty accepted - waiting on confirmation";\n            return;\n        }\n\n        if (Rs2Widget.clickWidget(InterfaceID.Tradeconfirm.TRADE2ACCEPT))\n        {\n            lastConfirmAcceptAt = now;\n            acceptedConfirmations++;\n            status = "Counterparty accepted - accepted confirmation";\n            clearPendingRequest();\n        }\n        else\n        {\n            status = "Confirmation Accept unavailable";\n        }''',
              '''        boolean otherAccepted = otherPlayerHasAccepted(InterfaceID.Tradeconfirm.UNIVERSE);\n        if (!otherAccepted)\n        {\n            confirmationAcceptSent = false;\n            status = "Waiting for " + displayConfiguredName(currentConfig.traderName()) + " to accept confirmation";\n            return;\n        }\n\n        if (confirmationAcceptSent)\n        {\n            status = "Counterparty accepted - confirmation already accepted";\n            return;\n        }\n\n        if (Rs2Widget.clickWidget(InterfaceID.Tradeconfirm.TRADE2ACCEPT))\n        {\n            confirmationAcceptSent = true;\n            acceptedConfirmations++;\n            status = "Counterparty accepted - accepted confirmation once";\n            clearPendingRequest();\n        }\n        else\n        {\n            status = "Confirmation Accept unavailable";\n        }''')

          rep('''        pendingTraderRaw = null;\n        pendingRequestAt = lastFirstAcceptAt = lastConfirmAcceptAt = lastRequestResponseAt = 0L;\n        tradeTile = returnTile = null;\n        stopping = false;''',
              '''        pendingTraderRaw = null;\n        pendingRequestAt = lastRequestResponseAt = 0L;\n        firstAcceptSent = confirmationAcceptSent = tradeWasOpen = false;\n        tradeTile = returnTile = null;\n        stopping = false;''')

          script_path.write_text(text)

          plugin_path = Path('KSPTradeReceiver/KSPTradeReceiverPlugin.java')
          plugin = plugin_path.read_text()
          old = 'public static final String VERSION = "0.2.2";'
          if old not in plugin:
              raise SystemExit('Trade Receiver version marker not found')
          plugin_path.write_text(plugin.replace(old, 'public static final String VERSION = "0.2.3";', 1))
          PY

      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Compile Trade Receiver against Microbot
        shell: bash
        run: |
          rm -rf microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/KSPTradeReceiver
          cp -R KSPTradeReceiver microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/KSPTradeReceiver
          cat > microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              private PluginConstants() {}
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
          }
          EOF
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Commit validated runtime changes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KSPTradeReceiver/KSPTradeReceiverScript.java KSPTradeReceiver/KSPTradeReceiverPlugin.java
          git diff --cached --quiet || git commit -m "Make Trade Receiver follow counterparty acceptance"
          git push origin HEAD:fix/trade-receiver-counterparty-first-v023

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temp-trade-receiver-v023.yml
          git add .github/workflows/temp-trade-receiver-v023.yml
          git diff --cached --quiet || git commit -m "Remove temporary Trade Receiver v0.2.3 validation"
          git push origin HEAD:fix/trade-receiver-counterparty-first-v023
