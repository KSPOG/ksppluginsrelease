name: Temporary quest direct interaction and task balance patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-quest-direct-balance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/romeo-navigation-stale-dialogue
          fetch-depth: 0
      - name: Patch Romeo, shared quests and task weights
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Balance quests against regular training.
          p = Path('kspaccountbuilder/KspAccountBuilderScript.java')
          s = p.read_text()
          old = '''        TUTORIAL_ISLAND(0), COOKS_ASSISTANT(30), GOBLIN_DIPLOMACY(30), ROMEO_AND_JULIET(30),\n        RUNE_MYSTERIES(30), SHEEP_SHEARER(30), X_MARKS_THE_SPOT(30), THE_RESTLESS_GHOST(30),\n        IMP_CATCHER(30), STRONGHOLD_OF_SECURITY(30), RUNE_ESSENCE(7), MINING(7), WOODCUTTING(7),'''
          new = '''        TUTORIAL_ISLAND(0), COOKS_ASSISTANT(7), GOBLIN_DIPLOMACY(7), ROMEO_AND_JULIET(7),\n        RUNE_MYSTERIES(7), SHEEP_SHEARER(7), X_MARKS_THE_SPOT(7), THE_RESTLESS_GHOST(7),\n        IMP_CATCHER(7), STRONGHOLD_OF_SECURITY(7), RUNE_ESSENCE(7), MINING(7), WOODCUTTING(7),'''
          assert old in s, 'BuilderTask quest weights block not found'
          p.write_text(s.replace(old, new, 1))

          # 2) Shared small-quest NPC interaction: click reachable NPCs directly.
          p = Path('kspaccountbuilder/tasks/questing/shared/SimpleQuestScript.java')
          s = p.read_text()
          old = '''    protected void talkTo(String name, WorldPoint destination)\n    {\n        if (!walkTo(name, destination, 4)) return;\n        var npc = Microbot.getRs2NpcCache().query().fromWorldView().withName(name).nearestOnClientThread();\n        if (npc == null || npc.getWorldLocation() == null) { setStatus(\"Searching for \" + name); return; }\n        if (!walkTo(name, npc.getWorldLocation(), 4) || Rs2Player.isMoving()) return;\n        state = QuestTaskState.INTERACTING;\n        setStatus(\"Talking to \" + name);\n        if (npc.click(\"Talk-to\")) actionSent();\n    }'''
          new = '''    protected void talkTo(String name, WorldPoint destination)\n    {\n        String key = questName + \":\" + name;\n        var npc = Microbot.getRs2NpcCache().query().fromWorldView().withName(name).nearestOnClientThread();\n        WorldPoint player = Rs2Player.getWorldLocation();\n\n        // If the NPC is already in the nearby reachable scene, do not keep\n        // rendering/replacing a web-walk route to a moving target. Release the\n        // walker and interact with the NPC directly.\n        if (npc != null && npc.getWorldLocation() != null && player != null\n                && player.getPlane() == npc.getWorldLocation().getPlane()\n                && player.distanceTo(npc.getWorldLocation()) <= 8\n                && npc.isReachable())\n        {\n            KspWalkerGuard.clear(key);\n            KspWalkerGuard.clearActiveWalker(questName + \":reachable-npc:\" + name);\n            if (!Rs2Player.isMoving())\n            {\n                state = QuestTaskState.INTERACTING;\n                setStatus(\"Talking to \" + name);\n                if (npc.click(\"Talk-to\"))\n                {\n                    actionSent();\n                    return;\n                }\n            }\n        }\n\n        WorldPoint target = npc != null && npc.getWorldLocation() != null\n                ? npc.getWorldLocation()\n                : destination;\n        if (!walkTo(name, target, 4)) return;\n\n        npc = Microbot.getRs2NpcCache().query().fromWorldView().withName(name).nearestOnClientThread();\n        if (npc == null || npc.getWorldLocation() == null)\n        {\n            setStatus(\"Searching for \" + name);\n            return;\n        }\n        if (Rs2Player.isMoving() || !npc.isReachable()) return;\n        KspWalkerGuard.clear(key);\n        state = QuestTaskState.INTERACTING;\n        setStatus(\"Talking to \" + name);\n        if (npc.click(\"Talk-to\")) actionSent();\n    }'''
          assert old in s, 'SimpleQuestScript talkTo block not found'
          p.write_text(s.replace(old, new, 1))

          # 3) Romeo: direct reachable-NPC handling + stale dialogue release.
          p = Path('kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java')
          s = p.read_text()

          old = '''        // Quest Helper uses this to leave stale Romeo/Father Lawrence menus.\n        // This specifically prevents the repeating \"How are you?\" loop.\n        if (clickOption(\"Ok, thanks.\")) return true;'''
          new = '''        // Once the quest has progressed, informational Romeo/Lawrence menus can\n        // remain open even though movement should continue. Use a partial match\n        // so punctuation/cache text differences cannot trap the route.\n        if (stage > STAGE_NOT_STARTED && clickOptionPartial(\"Ok, thanks\")) return true;'''
          assert old in s, 'Romeo Ok thanks block not found'
          s = s.replace(old, new, 1)

          old = '''    private void talkToNpc(String name, WorldPoint destination, String walkKey,\n                           RomeoState walkingState, RomeoState talkingState)\n    {\n        Rs2NpcModel npc = findNpc(name);\n        WorldPoint player = Rs2Player.getWorldLocation();\n        if (player == null) return;\n\n        WorldPoint target = npc != null && npc.getWorldLocation() != null\n                ? npc.getWorldLocation()\n                : destination;\n\n        if (player.distanceTo(target) > NPC_REACH_DISTANCE)\n        {\n            state = walkingState;\n            status = \"WebWalking to \" + name;\n            KspWalkerGuard.walkToPoint(walkKey, target, NPC_REACH_DISTANCE, WALK_REFIRE_COOLDOWN_MS);\n            return;\n        }\n\n        KspWalkerGuard.clear(walkKey);\n        if (npc == null || !interactionReady()) return;\n\n        state = talkingState;\n        status = \"Talking to \" + name;\n        if (npc.click(\"Talk-to\")) markInteraction(\"npc-\" + name);\n    }'''
          new = '''    private void talkToNpc(String name, WorldPoint destination, String walkKey,\n                           RomeoState walkingState, RomeoState talkingState)\n    {\n        Rs2NpcModel npc = findNpc(name);\n        WorldPoint player = Rs2Player.getWorldLocation();\n        if (player == null) return;\n\n        // A visible/reachable quest NPC takes priority over the walker. This is\n        // especially important for Father Lawrence and Romeo because their live\n        // NPC tile can move while the web walker is still targeting the previous\n        // location. Do not rebuild that route when a direct click is possible.\n        if (npc != null && npc.getWorldLocation() != null\n                && player.getPlane() == npc.getWorldLocation().getPlane()\n                && player.distanceTo(npc.getWorldLocation()) <= 8\n                && npc.isReachable())\n        {\n            KspWalkerGuard.clear(walkKey);\n            KspWalkerGuard.clearActiveWalker(\"ksp_romeo_reachable_npc_\" + name);\n            if (!Rs2Player.isMoving() && interactionReady())\n            {\n                state = talkingState;\n                status = \"Talking to \" + name;\n                if (npc.click(\"Talk-to\"))\n                {\n                    markInteraction(\"npc-\" + name);\n                    return;\n                }\n            }\n        }\n\n        WorldPoint target = npc != null && npc.getWorldLocation() != null\n                ? npc.getWorldLocation()\n                : destination;\n\n        if (npc == null || !npc.isReachable() || player.distanceTo(target) > NPC_REACH_DISTANCE)\n        {\n            state = walkingState;\n            status = \"WebWalking to \" + name;\n            KspWalkerGuard.walkToPoint(walkKey, target, NPC_REACH_DISTANCE, WALK_REFIRE_COOLDOWN_MS);\n            return;\n        }\n\n        KspWalkerGuard.clear(walkKey);\n        if (!interactionReady()) return;\n\n        state = talkingState;\n        status = \"Talking to \" + name;\n        if (npc.click(\"Talk-to\")) markInteraction(\"npc-\" + name);\n    }'''
          assert old in s, 'Romeo talkToNpc block not found'
          s = s.replace(old, new, 1)

          # Juliet gets the same direct-interaction preference once she is reachable.
          old = '''        if (passJulietRoomDoor()) return;\n\n        Rs2NpcModel juliet = findNpc(\"Juliet\");\n        WorldPoint target = juliet != null && juliet.getWorldLocation() != null\n                ? juliet.getWorldLocation()\n                : JULIET_POSITION;'''
          new = '''        Rs2NpcModel juliet = findNpc(\"Juliet\");\n        if (juliet != null && juliet.getWorldLocation() != null\n                && player.getPlane() == juliet.getWorldLocation().getPlane()\n                && player.distanceTo(juliet.getWorldLocation()) <= 8\n                && juliet.isReachable())\n        {\n            KspWalkerGuard.clear(WALK_JULIET);\n            KspWalkerGuard.clearActiveWalker(\"ksp_romeo_reachable_juliet\");\n            if (!Rs2Player.isMoving() && interactionReady())\n            {\n                state = RomeoState.TALKING_TO_JULIET;\n                status = potion ? \"Giving potion to Juliet\" : \"Talking to Juliet\";\n                if (juliet.click(\"Talk-to\"))\n                {\n                    markInteraction(\"npc-juliet\");\n                    return;\n                }\n            }\n        }\n\n        if (passJulietRoomDoor()) return;\n\n        WorldPoint target = juliet != null && juliet.getWorldLocation() != null\n                ? juliet.getWorldLocation()\n                : JULIET_POSITION;'''
          assert old in s, 'Romeo Juliet route block not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/KspAccountBuilderScript.java \
                  kspaccountbuilder/tasks/questing/shared/SimpleQuestScript.java \
                  kspaccountbuilder/tasks/questing/romeoandjuliet/romeoscript/RomeoScript.java
          git commit -m "Improve quest NPC routing and balance task selection"
          git push origin HEAD:fix/romeo-navigation-stale-dialogue
