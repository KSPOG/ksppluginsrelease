name: Temporary Firemaking level-up recovery patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-firemaking-levelup-resume.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firemaking-levelup-resume-v2
          fetch-depth: 0
      - name: Patch FireMakingScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java')
          s = p.read_text()

          old = '''    private long pendingBankActionAtMs;
    private int pendingBankEmptySlots = -1;
    private WorldPoint activeFireInteractionLocation;
'''
          new = '''    private long pendingBankActionAtMs;
    private int pendingBankEmptySlots = -1;
    private int pendingFireLogCount = -1;
    private WorldPoint activeFireInteractionLocation;
'''
          assert old in s, 'field marker not found'
          s = s.replace(old, new, 1)

          old = '''            if (handleBurnPrompt(targetLogName, targetLogId)) return;
            if (!ensureSupplies(targetLogName, fireLocation != null)) return;
'''
          new = '''            if (recoverFromBlockingLevelUp(targetLogId)) return;
            if (handleBurnPrompt(targetLogName, targetLogId)) return;
            if (!ensureSupplies(targetLogName, fireLocation != null)) return;
'''
          assert old in s, 'main loop marker not found'
          s = s.replace(old, new, 1)

          old = '''        awaitingFireStartAtMs = 0L;
        if (!isIdleNearCampfire(fireLocation)) return;

        long now = System.currentTimeMillis();
'''
          new = '''        if (isWaitingForFireStart()) return;
        if (!isIdleNearCampfire(fireLocation)) return;

        long now = System.currentTimeMillis();
'''
          assert old in s, 'campfire pending marker not found'
          s = s.replace(old, new, 1)

          old = '''        if (!interacted) return;

        lastFireInteractAtMs = now;
        awaitingFireStartAtMs = now;
        activeFireInteractionLocation = fire.getWorldLocation();
'''
          new = '''        if (!interacted)
        {
            dismissContinueWithoutAdvancingDialogue();
            return;
        }

        lastFireInteractAtMs = now;
        awaitingFireStartAtMs = now;
        pendingFireLogCount = Rs2Inventory.count(targetLogId);
        activeFireInteractionLocation = fire.getWorldLocation();
'''
          assert old in s, 'campfire interaction marker not found'
          s = s.replace(old, new, 1)

          old = '''        if (!canBurnLog(getTargetLogId(targetLogName))) return;
        if (!Rs2Inventory.combine(590, getTargetLogId(targetLogName))) return;

        lastFireInteractAtMs = now;
        awaitingFireStartAtMs = now;
        expectingFiremakingXpDrop = true;
'''
          new = '''        int targetLogId = getTargetLogId(targetLogName);
        if (!canBurnLog(targetLogId)) return;
        if (!Rs2Inventory.combine(590, targetLogId))
        {
            dismissContinueWithoutAdvancingDialogue();
            return;
        }

        lastFireInteractAtMs = now;
        awaitingFireStartAtMs = now;
        pendingFireLogCount = Rs2Inventory.count(targetLogId);
        expectingFiremakingXpDrop = true;
'''
          assert old in s, 'build fire marker not found'
          s = s.replace(old, new, 1)

          marker = '''    private boolean handleBurnPrompt(String targetLogName, int targetLogId)
    {
'''
          helper = '''    private boolean recoverFromBlockingLevelUp(int targetLogId)
    {
        if (awaitingFireStartAtMs == 0L || pendingFireLogCount < 0)
        {
            return false;
        }

        if (Rs2Player.isAnimating() || Rs2Player.isMoving() || Rs2Player.isInteracting())
        {
            pendingFireLogCount = -1;
            awaitingFireStartAtMs = 0L;
            return false;
        }

        int currentLogCount = Rs2Inventory.count(targetLogId);
        if (currentLogCount < pendingFireLogCount)
        {
            pendingFireLogCount = -1;
            awaitingFireStartAtMs = 0L;
            return false;
        }

        // The action was attempted first. If a generic Continue interface is still
        // blocking it, dismiss the modal with Escape rather than treating the level-up
        // as a separate dialogue workflow. The Firemaking action is retried next tick.
        if (Rs2Dialogue.hasContinue() && !Rs2Dialogue.hasSelectAnOption())
        {
            Rs2Keyboard.keyPress(KeyEvent.VK_ESCAPE);
            pendingFireLogCount = -1;
            awaitingFireStartAtMs = 0L;
            expectingFiremakingXpDrop = false;
            Microbot.status = "Resuming Firemaking after level-up";
            return true;
        }

        if (System.currentTimeMillis() - awaitingFireStartAtMs >= FIRE_START_GRACE_MS)
        {
            pendingFireLogCount = -1;
            awaitingFireStartAtMs = 0L;
            expectingFiremakingXpDrop = false;
            return false;
        }

        return true;
    }

    private boolean dismissContinueWithoutAdvancingDialogue()
    {
        if (!Rs2Dialogue.hasContinue() || Rs2Dialogue.hasSelectAnOption())
        {
            return false;
        }

        Rs2Keyboard.keyPress(KeyEvent.VK_ESCAPE);
        awaitingFireStartAtMs = 0L;
        pendingFireLogCount = -1;
        expectingFiremakingXpDrop = false;
        Microbot.status = "Resuming Firemaking after level-up";
        return true;
    }

'''
          assert marker in s, 'handleBurnPrompt marker not found'
          s = s.replace(marker, helper + marker, 1)

          old = '''        awaitingFireStartAtMs = 0L;
        expectingFiremakingXpDrop = false;
        tendingForestersCampfire = false;
'''
          new = '''        awaitingFireStartAtMs = 0L;
        pendingFireLogCount = -1;
        expectingFiremakingXpDrop = false;
        tendingForestersCampfire = false;
'''
          assert old in s, 'reset state marker not found'
          s = s.replace(old, new, 1)

          old = '''        awaitingFireStartAtMs = 0L;
        lastBurnPromptActionAtMs = 0L;
        expectingFiremakingXpDrop = false;
'''
          new = '''        awaitingFireStartAtMs = 0L;
        pendingFireLogCount = -1;
        lastBurnPromptActionAtMs = 0L;
        expectingFiremakingXpDrop = false;
'''
          assert old in s, 'shutdown marker not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java
          git commit -m "Resume Firemaking immediately after level-up dialogues"
          git push origin HEAD:fix/firemaking-levelup-resume-v2
