name: Temporary Firemaking level-up recovery patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-firemaking-levelup-resume.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firemaking-levelup-resume-v2
          fetch-depth: 0
      - name: Apply patch
        run: python .tmp/patch_firemaking_levelup_and_reuse.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java
          git commit -m "Fix Firemaking level-up recovery and reuse nearby fires"
          git push origin HEAD:fix/firemaking-levelup-resume-v2
