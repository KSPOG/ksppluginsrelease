name: Patch Jewelry GE Values

on:
  push:
    branches:
      - fix/jewelry-ge-value-entry-v0121

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-ge-value-entry-v0121

      - name: Apply and verify patch
        run: python tools/patch_jewelry_ge_values.py

      - name: Commit Java patch
        run: |
          git config user.name "KSPOG"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspjewelrycrafter/KspJewelryCrafterScript.java
          git commit -m "Fix Jewelry Crafter GE price and quantity entry"
          git push origin HEAD:fix/jewelry-ge-value-entry-v0121
