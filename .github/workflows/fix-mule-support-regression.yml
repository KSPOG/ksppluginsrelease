name: Fix mule support config regression

on:
  push:
    branches:
      - fix-mule-support-config-regression

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mule-support-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply regression fix
        run: python .github/scripts/fix_mule_support_regression.py

      - name: Commit regression fix
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: decouple support button from mule config inheritance [mule-support-fixed]"
          git push
