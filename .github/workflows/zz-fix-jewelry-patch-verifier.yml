name: Fix Jewelry Patch Verification
on:
  push:
    branches:
      - fix/jewelry-ge-value-entry-v0121
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-ge-value-entry-v0121
      - name: Narrow verification and remove fixer
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/patch-jewelry-ge-values.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("          assert 'sleep(120, 220);' not in text\n", '')
          text = text.replace("          assert 'sleep(150, 250);' not in text\n", '')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/zz-fix-jewelry-patch-verifier.yml').unlink()
      - name: Commit verifier fix
        run: |
          git config user.name "KSPOG"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-jewelry-ge-values.yml .github/workflows/zz-fix-jewelry-patch-verifier.yml
          git commit -m "Narrow Jewelry GE patch verification"
          git push origin HEAD:fix/jewelry-ge-value-entry-v0121
