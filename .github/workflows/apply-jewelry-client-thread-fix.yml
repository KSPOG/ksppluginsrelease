name: Finalize Jewelry Client Thread Fix

on:
  push:
    branches:
      - fix/jewelry-client-thread-ge
    paths:
      - .github/workflows/apply-jewelry-client-thread-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-client-thread-ge

      - name: Normalize patched Java formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          text = path.read_text(encoding='utf-8')

          fixes = {
              '        status = "Opening GE buy offer: " + itemName;\n    if (!clickGeSlotChildSafely(slot, 0))\n        return recoverGrandExchange("GE buy slot is not ready");':
              '        status = "Opening GE buy offer: " + itemName;\n        if (!clickGeSlotChildSafely(slot, 0))\n            return recoverGrandExchange("GE buy slot is not ready");',
              '        if (!clickGeComponentSafely(InterfaceID.GeOffers.SETUP_CONFIRM))\n        return recoverGrandExchange("Unable to confirm GE " + kind + " offer");':
              '        if (!clickGeComponentSafely(InterfaceID.GeOffers.SETUP_CONFIRM))\n            return recoverGrandExchange("Unable to confirm GE " + kind + " offer");',
          }

          for old, new in fixes.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'format target expected once, found {count}: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)

          unsafe = [
              'buyButton.isHidden()',
              'private Widget geSetupChild(',
              'Rs2Widget.clickWidget(buyButton)',
              'Rs2Widget.clickWidget(modify)',
              'Rs2Widget.clickWidgetFast(slotWidget, 2, 3)',
          ]
          for pattern in unsafe:
              if pattern in text:
                  raise SystemExit(f'unsafe GE widget pattern remains: {pattern}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify guarded GE paths
        shell: bash
        run: |
          grep -n "clickGeSlotChildSafely(slot, 0)" kspjewelrycrafter/KspJewelryCrafterScript.java
          grep -n "clickGeSearchResultSafely(itemName)" kspjewelrycrafter/KspJewelryCrafterScript.java
          grep -n "clickGeSetupChildSafely(GE_PRICE_X_CHILD)" kspjewelrycrafter/KspJewelryCrafterScript.java
          grep -n "clickGeComponentSafely(InterfaceID.GeOffers.SETUP_CONFIRM)" kspjewelrycrafter/KspJewelryCrafterScript.java
          grep -n "clickGeSlotFastSafely(slot, 2, 3)" kspjewelrycrafter/KspJewelryCrafterScript.java

      - name: Commit formatting cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspjewelrycrafter/KspJewelryCrafterScript.java
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Jewelry Crafter client-thread fix"
          git push origin HEAD:fix/jewelry-client-thread-ge
