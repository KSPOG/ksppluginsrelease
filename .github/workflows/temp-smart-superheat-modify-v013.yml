name: SmartSuperheatModifyV013
on:
  push:
    branches: ['fix/smart-superheat-modify-price-v013']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ksp
          ref: fix/smart-superheat-modify-price-v013
          fetch-depth: 0
      - name: Patch Jewellery-style modify flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ksp/kspsmartsuperheat/KspSmartSuperheatScript.java')
          s=p.read_text()
          start=s.index('    private boolean modifyGeOffer(GrandExchangeSlots slot, int newPrice)')
          end=s.index('    private boolean gePriceInputOpen()', start)
          new='''    private boolean modifyGeOffer(GrandExchangeSlots slot, int newPrice)\n    {\n        if (slot == null || newPrice <= 0) return false;\n        OfferSnapshot current = offer(slot);\n        if (current != null && current.price == newPrice) return true;\n        if (!ensureGeOverview()) return false;\n\n        Widget slotWidget = Rs2Widget.getWidget(InterfaceID.GeOffers.INDEX_0 + slot.ordinal());\n        if (slotWidget == null)\n        {\n            status = \"Waiting for GE slot widget\";\n            return false;\n        }\n\n        status = \"Opening GE Modify offer\";\n        Rs2Widget.clickWidgetFast(slotWidget, 2, 3);\n        if (!sleepUntil(() -> geSetupOpen() || Rs2GrandExchange.isOfferScreenOpen() || !Rs2GrandExchange.isOpen(), 3500))\n        {\n            status = \"Waiting for GE Modify offer\";\n            return false;\n        }\n        if (!Rs2GrandExchange.isOpen())\n        {\n            status = \"GE closed while opening Modify offer - recovering\";\n            return false;\n        }\n\n        if (!geSetupOpen())\n        {\n            Widget modify = Rs2Widget.getWidget(InterfaceID.GeOffers.DETAILS_MODIFY);\n            if (modify == null || !Rs2Widget.clickWidget(modify))\n            {\n                status = \"Waiting for GE Modify button\";\n                return false;\n            }\n            if (!sleepUntil(() -> geSetupOpen() || !Rs2GrandExchange.isOpen(), 3000))\n            {\n                status = \"Waiting for GE offer setup\";\n                return false;\n            }\n        }\n        if (!Rs2GrandExchange.isOpen())\n        {\n            status = \"GE closed before price edit - recovering\";\n            return false;\n        }\n\n        Widget setup = Rs2Widget.getWidget(InterfaceID.GeOffers.SETUP);\n        Widget priceX = setup == null ? null : setup.getChild(GE_PRICE_X_CHILD);\n        if (priceX == null || !Rs2Widget.clickWidget(priceX))\n        {\n            status = \"Unable to open GE price input\";\n            return false;\n        }\n        if (!sleepUntil(() -> gePriceInputOpen() || !Rs2GrandExchange.isOpen(), 2500))\n        {\n            status = \"Waiting for GE price input\";\n            return false;\n        }\n        if (!Rs2GrandExchange.isOpen())\n        {\n            status = \"GE closed during price input - recovering\";\n            return false;\n        }\n\n        // Same chatbox-value flow as Jewellery Crafter, with the settle delays\n        // Microbot's own GE setPrice() uses so the new value is not submitted too early.\n        sleep(600, 1000);\n        Rs2GrandExchange.setChatboxValue(newPrice);\n        sleep(500, 750);\n        Rs2Keyboard.enter();\n        sleep(800, 1100);\n        if (!sleepUntil(() -> !gePriceInputOpen() || !Rs2GrandExchange.isOpen(), 2500))\n        {\n            status = \"Waiting for GE price entry\";\n            return false;\n        }\n        if (!Rs2GrandExchange.isOpen())\n        {\n            status = \"GE closed after price entry - recovering\";\n            return false;\n        }\n\n        status = \"Confirming modified GE price\";\n        if (!Rs2Widget.clickWidget(InterfaceID.GeOffers.SETUP_CONFIRM))\n        {\n            status = \"Unable to confirm modified GE price\";\n            return false;\n        }\n        sleepUntil(() -> !geSetupOpen() || Rs2Widget.hasWidget(\"Your offer is much\") || !Rs2GrandExchange.isOpen(), 3000);\n        if (Rs2Widget.hasWidget(\"Your offer is much\"))\n        {\n            Rs2Widget.clickWidget(\"Yes\");\n            sleepUntil(() -> !geSetupOpen() || !Rs2GrandExchange.isOpen(), 3000);\n        }\n\n        if (sleepUntil(() ->\n        {\n            OfferSnapshot snapshot = offer(slot);\n            return snapshot != null && snapshot.price == newPrice;\n        }, 3000)) return true;\n\n        status = Rs2GrandExchange.isOpen() ? \"Waiting for modified GE price\" : \"GE closed after price modify - recovering\";\n        return false;\n    }\n\n'''
          s=s[:start]+new+s[end:]
          marker='    private boolean gePriceInputOpen()'
          if 'private boolean geSetupOpen()' not in s:
              s=s.replace(marker, '    private boolean geSetupOpen() { return Rs2Widget.isWidgetVisible(InterfaceID.GeOffers.SETUP); }\n\n'+marker,1)
          p.write_text(s)

          q=Path('ksp/kspsmartsuperheat/KspSmartSuperheatPlugin.java')
          t=q.read_text()
          if 'VERSION = "0.1.2"' not in t: raise SystemExit('expected v0.1.2')
          q.write_text(t.replace('VERSION = "0.1.2"','VERSION = "0.1.3"',1))
          PY
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          pkg=microbot/client/src/main/java/net/runelite/client/plugins/microbot/kspsmartsuperheat
          mkdir -p "$pkg"
          cp ksp/kspsmartsuperheat/*.java "$pkg/"
          constants=microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java
          if [ ! -f "$constants" ]; then
            printf '%s\n' 'package net.runelite.client.plugins.microbot;' 'public final class PluginConstants {' '  public static final String KSP = "KSP ";' '  public static final boolean DEFAULT_ENABLED = false;' '  public static final boolean IS_EXTERNAL = true;' '}' > "$constants"
          fi
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          cd ksp
          rm -f .github/workflows/temp-smart-superheat-modify-v013.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kspsmartsuperheat/KspSmartSuperheatScript.java kspsmartsuperheat/KspSmartSuperheatPlugin.java .github/workflows/temp-smart-superheat-modify-v013.yml
          git commit -m 'fix: mirror Jewellery GE price modification flow'
          git push origin HEAD:fix/smart-superheat-modify-price-v013
