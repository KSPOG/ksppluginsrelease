name: Fix BossGear Gson compatibility

on:
  push:
    branches:
      - fix/bossgear-gson-parser-compat

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bossgear-gson-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bossgear-gson-parser-compat
      - name: Patch JsonParser compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kspbossgear/WikiGearService.java')
          text = path.read_text(encoding='utf-8')
          old = 'root = JsonParser.parseString(response.body()).getAsJsonObject();'
          new = 'root = new JsonParser().parse(response.body()).getAsJsonObject();'
          if old not in text:
              raise SystemExit('Expected JsonParser.parseString call not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspbossgear/WikiGearService.java
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: support bundled Gson in Boss Gear [bossgear-gson-fixed]"
          git push origin HEAD:fix/bossgear-gson-parser-compat
