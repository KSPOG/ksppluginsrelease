name: Temporary Firemaking patch

on:
  push:
    branches:
      - 'feature/firemaking-random-areas'
    paths:
      - '.github/workflows/_tmp_patch_firemaking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/firemaking-random-areas
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Firemaking selection
        run: |
          python3 -c "from pathlib import Path; p=Path('kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java'); s=p.read_text(); old='        this.targetArea = area;\\n'; new='        this.targetArea = FireArea.randomArea();\\n        debug(\"Selected random Firemaking area | area={}\", this.targetArea.getDisplayName());\\n'; assert old in s, 'target assignment not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java
          git commit -m "Randomize Firemaking area per task run"
          git push origin HEAD:feature/firemaking-random-areas
