name: SmartSuperheatV012
on: [push]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ksp
          ref: fix/smart-superheat-withdraw-all-output-v012
          fetch-depth: 0
      - name: Apply patch
        run: python3 ksp/.github/patch-smart-superheat-v012.py
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile
        run: |
          mkdir -p microbot/client/src/main/java/net/runelite/client/plugins/microbot/kspsmartsuperheat
          cp ksp/kspsmartsuperheat/*.java microbot/client/src/main/java/net/runelite/client/plugins/microbot/kspsmartsuperheat/
          if [ ! -f microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java ]; then
            printf '%s\n' 'package net.runelite.client.plugins.microbot;' 'public final class PluginConstants {' 'public static final String KSP = "KSP ";' 'public static final boolean DEFAULT_ENABLED = false;' 'public static final boolean IS_EXTERNAL = true;' '}' > microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java
          fi
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon
      - name: Commit
        run: |
          cd ksp
          rm -f .github/workflows/patch-smart-superheat-withdraw-all-v012.yml .github/patch-smart-superheat-v012.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use Withdraw-All and modify Smart Superheat GE offers'
          git push origin HEAD:fix/smart-superheat-withdraw-all-output-v012
