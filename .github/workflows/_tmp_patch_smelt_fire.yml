name: Temporary Smelting and Firemaking patch

on:
  push:
    branches:
      - 'feature/smelting-random-areas-and-fire-reset'
    paths:
      - '.github/workflows/_tmp_patch_smelt_fire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smelting-random-areas-and-fire-reset
      - name: Patch sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          smelt = Path('kspaccountbuilder/tasks/skilling/smelting/smeltscript/SmeltScript.java')
          s = smelt.read_text()
          s = s.replace('        this.targetArea = area;\n', '        this.targetArea = SmeltArea.randomArea();\n        this.debug("Selected random Smelting area | area={}", this.targetArea.getDisplayName());\n', 1)
          start = s.index('    private boolean openWorkBank() {')
          end = s.index('    private boolean withdrawAndWait(', start)
          s = s[:start] + '''    private boolean openWorkBank() {
        if (Rs2Bank.isOpen()) {
            bankInteractionSentAt = 0L;
            return true;
        }
        Microbot.status = "Walking to nearest bank";
        if (!Rs2Player.isMoving()) {
            if (Rs2Bank.openBank() && sleepUntil(Rs2Bank::isOpen, 3_000)) {
                bankInteractionSentAt = 0L;
                return true;
            }
            Rs2Bank.walkToBankAndUseBank();
        }
        return false;
    }

''' + s[end:]
          smelt.write_text(s)

          fire = Path('kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java')
          f = fire.read_text()
          old = '''            int targetLogId = getTargetLogId(targetLogName);
            if (activeFireInteractionLocation != null
                    && !isBurnInterfaceOpen(targetLogName, targetLogId))
            {
                Rs2TileObjectModel activeFire = findFireObjectAtLocation(activeFireInteractionLocation);
                if (activeFire == null || activeFire.getId() != activeFireInteractionId)
                {
                    resetFireInteractionState("interacted fire disappeared");
                }
            }
'''
          new = '''            int targetLogId = getTargetLogId(targetLogName);
            if (activeFireInteractionLocation != null)
            {
                Rs2TileObjectModel activeFire = findFireObjectAtLocation(activeFireInteractionLocation);
                if (activeFire == null || activeFire.getId() != activeFireInteractionId)
                {
                    boolean burnInterfaceOpen = isBurnInterfaceOpen(targetLogName, targetLogId);
                    resetFireInteractionState("interacted fire disappeared");
                    if (burnInterfaceOpen)
                    {
                        Rs2Keyboard.keyPress(KeyEvent.VK_ESCAPE);
                    }
                }
            }
'''
          if old not in f:
              raise SystemExit('Fire disappearance block not found')
          fire.write_text(f.replace(old, new, 1))
          PY
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder/tasks/skilling/smelting/smeltscript/SmeltScript.java kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java
          git commit -m "Randomize smelting areas and reset vanished fires"
          git push origin HEAD:feature/smelting-random-areas-and-fire-reset
