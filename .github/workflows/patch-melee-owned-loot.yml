name: Patch melee owned loot
on:
  push:
    branches:
      - feat/melee-owned-loot-outside-area
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/melee-owned-loot-outside-area
      - name: Allow owned drops outside combat area
        shell: python
        run: |
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/combat/melee/meleescript/MeleeScript.java')
          s = p.read_text(encoding='utf-8')
          old = '''                .where(Rs2TileItemModel::isOwned)\n                .where(item -> this.isLocationInTargetArea(item.getWorldLocation(), stage))\n                .where(this::canStoreLoot)'''
          new = '''                .where(Rs2TileItemModel::isOwned)\n                // Owned drops may land just outside the configured combat area.\n                // Keep combat targets area-bound, but allow nearby owned loot within LOOT_RADIUS.\n                .where(this::canStoreLoot)'''
          if old not in s:
              raise SystemExit('Expected loot-area filter not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-melee-owned-loot.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/combat/melee/meleescript/MeleeScript.java .github/workflows/patch-melee-owned-loot.yml
          git commit -m "Allow Account Builder melee to loot owned drops outside area"
          git push origin HEAD:feat/melee-owned-loot-outside-area
