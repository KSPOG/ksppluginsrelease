name: Fix Chopper inventory ID compatibility

on:
  push:
    branches:
      - fix-chopper-inventory-id-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-chopper-inventory-id-compat
          fetch-depth: 0

      - name: Apply compatibility fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('kspwillowchopper/KspWillowChopperScript.java')
          text = path.read_text(encoding='utf-8')

          old_import = 'import net.runelite.api.gameval.InventoryID;'
          new_import = 'import net.runelite.api.InventoryID;'
          if old_import not in text and new_import not in text:
              raise SystemExit('InventoryID import not found')
          text = text.replace(old_import, new_import)

          old_check = 'if (container == null || container != Microbot.getClient().getItemContainer(InventoryID.INVENTORY)) {'
          new_check = 'if (container == null || event.getContainerId() != InventoryID.INVENTORY.getId()) {'
          if old_check not in text and new_check not in text:
              raise SystemExit('Inventory container check not found')
          text = text.replace(old_check, new_check)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-chopper-inventory-id-compat.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: use legacy RuneLite inventory ID for Chopper"
          git push origin HEAD:fix-chopper-inventory-id-compat
