name: Patch Chopper bank blacklist

on:
  push:
    branches:
      - chopper-ignore-cooks-guild-bank
    paths:
      - '.github/workflows/patch-chopper-ignore-cooks-guild-bank.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chopper-ignore-cooks-guild-bank
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/scripts/patch_chopper_bank.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-chopper-ignore-cooks-guild-bank.yml
          rm .github/scripts/patch_chopper_bank.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ignore Cook's Guild bank targets in Chopper"
          git push origin HEAD:chopper-ignore-cooks-guild-bank
