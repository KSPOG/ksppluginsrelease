name: Temporary Smart Smelter Null Fix

on:
  push:
    branches:
      - fix/smart-smelter-null-route-v004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Smart Smelter route snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('kspsmartsmelter/KspSmartSmelterScript.java')
          text = path.read_text()

          replacements = [
              ('', ''),
              ('', ''),
              ('ICAgIHByaXZhdGUgdm9pZCBwcmVwYXJlTmV4dFRyaXAoKSB7CiAgICAgICAgU21lbHRSb3V0ZSByb3V0ZSA9IHNlbGVjdGVkUXVvdGUuZ2V0Um91dGUoKTsK', ''),
              ('ICAgIHByaXZhdGUgdm9pZCBzbWVsdFRyaXAoKSB7CiAgICAgICAgU21lbHRSb3V0ZSByb3V0ZSA9IHNlbGVjdGVkUXVvdGUuZ2V0Um91dGUoKTsK', ''),
              ('', 'ICAgICAgICBvdXRwdXRQcm9kdWNlZCArPSBwcm9kdWNlZDsKICAgICAgICBleHBlY3RlZFNlc3Npb25Qcm9maXQgKz0gcHJvY2Vzc2VkQ3ljbGVzICogcXVvdGVTbmFwc2hvdC5nZXRQcm9maXRQZXJDeWNsZSgpOwogICAgICAgIGNvbXBsZXRlZFRyaXBzKys7')
          ]

          for index, (old_b64, new_b64) in enumerate(replacements, 1):
              old = base64.b64decode(old_b64).decode()
              new = base64.b64decode(new_b64).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement {index}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          plugin = Path('kspsmartsmelter/KspSmartSmelterPlugin.java')
          ptext = plugin.read_text()
          old_version = 'public static final String VERSION = "0.0.3";'
          new_version = 'public static final String VERSION = "0.0.4";'
          if ptext.count(old_version) != 1:
              raise SystemExit('Expected Smart Smelter v0.0.3 version marker exactly once')
          plugin.write_text(ptext.replace(old_version, new_version, 1))

          Path('.github/workflows/temp-smart-smelter-null-fix.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Smart Smelter route snapshot race"
          git push origin HEAD:fix/smart-smelter-null-route-v004
