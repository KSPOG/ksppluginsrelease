name: Build KSP Bones to Bananas

on:
  pull_request:
    paths:
      - 'kspbonestobananas/**'
      - 'kspsupport/**'
      - '.github/workflows/bones-to-bananas-build.yml'
  push:
    branches:
      - main
    paths:
      - 'kspbonestobananas/**'
      - 'kspsupport/**'
      - '.github/workflows/bones-to-bananas-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bones-to-bananas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspBonesToBananasPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install KSP Bones to Bananas sources into Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspbonestobananas" "$ROOT/kspsupport"
          cp -R release/kspbonestobananas "$ROOT/kspbonestobananas"
          cp -R release/kspsupport "$ROOT/kspsupport"

      - name: Include shared KSP support in Bones to Bananas source set
        shell: python
        run: |
          from pathlib import Path

          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = '''include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    if (plugin.name == "KspBonesToBananasPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                    }'''
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Make Gradle wrapper executable
        run: chmod +x hub/gradlew

      - name: Build KSP Bones to Bananas
        working-directory: hub
        run: ./gradlew clean build -PpluginList=KspBonesToBananasPlugin --stacktrace --no-daemon

      - name: Show produced JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ls -lh hub/build/libs/
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspBonesToBananasPlugin-*.jar' -print -quit)"

      - name: Upload Bones to Bananas JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KspBonesToBananasPlugin-${{ github.sha }}
          path: hub/build/libs/KspBonesToBananasPlugin-*.jar
          if-no-files-found: error
          retention-days: 7