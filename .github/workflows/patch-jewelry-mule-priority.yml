name: Patch Jewelry mule trade priority
on:
  push:
    branches:
      - fix-jewelry-mule-trade-priority
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-jewelry-mule-trade-priority
      - name: Apply patch
        run: python .github/patch_mule_priority.py
      - name: Remove patch helpers
        run: rm .github/patch_mule_priority.py .github/workflows/patch-jewelry-mule-priority.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prioritize mule trade over bank and GE"
          git push origin HEAD:fix-jewelry-mule-trade-priority
