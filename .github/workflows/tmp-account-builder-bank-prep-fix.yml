name: Temporary Account Builder bank prep fix

on:
  push:
    branches: [ fix/account-builder-bank-prep-loop ]
    paths:
      - '.github/workflows/tmp-account-builder-bank-prep-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-builder-bank-prep-loop
          fetch-depth: 0
      - name: Patch bank preparation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Firemaking: preserve both the tinderbox and the active log type during
          # bank cleanup. The old code deposited the logs it had just withdrawn.
          p = Path('kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java')
          s = p.read_text()
          old = '''        boolean hasItemsToDeposit = Rs2Inventory.all().stream()\n                .anyMatch(item -> item != null && item.getName() != null\n                        && !TINDERBOX_NAME.equalsIgnoreCase(item.getName()));\n        if (hasItemsToDeposit)\n        {\n            int beforeDeposit = Rs2Inventory.emptySlotCount();\n            if (Rs2Bank.depositAllExcept(TINDERBOX_NAME)) markBankAction(beforeDeposit);\n            return false;\n        }\n'''
          new = '''        boolean hasItemsToDeposit = Rs2Inventory.all().stream()\n                .anyMatch(item -> item != null && item.getName() != null\n                        && !TINDERBOX_NAME.equalsIgnoreCase(item.getName())\n                        && !targetLogName.equalsIgnoreCase(item.getName()));\n        if (hasItemsToDeposit)\n        {\n            int beforeDeposit = Rs2Inventory.emptySlotCount();\n            if (Rs2Bank.depositAllExcept(TINDERBOX_NAME, targetLogName)) markBankAction(beforeDeposit);\n            return false;\n        }\n'''
          assert old in s, 'Firemaking bank cleanup block not found'
          p.write_text(s.replace(old, new, 1))

          # Cooking: only deposit items that are not the raw fish for the current
          # task. This prevents withdraw(raw fish) -> depositAll -> withdraw(raw fish).
          p = Path('kspaccountbuilder/tasks/skilling/cooking/cookingscript/CookingScript.java')
          s = p.read_text()
          old = '''        if (!Rs2Inventory.isEmpty())\n        {\n            int before = Rs2Inventory.emptySlotCount();\n            if (Rs2Bank.depositAll()) markBankInventoryAction(before);\n            return;\n        }\n\n        if (!Rs2Inventory.hasItem(fish.getRawItemName()))\n'''
          new = '''        boolean hasNonTaskItems = Rs2Inventory.all().stream()\n                .anyMatch(item -> item != null && item.getName() != null\n                        && !fish.getRawItemName().equalsIgnoreCase(item.getName()));\n        if (hasNonTaskItems)\n        {\n            int before = Rs2Inventory.emptySlotCount();\n            if (Rs2Bank.depositAllExcept(fish.getRawItemName())) markBankInventoryAction(before);\n            return;\n        }\n\n        if (!Rs2Inventory.hasItem(fish.getRawItemName()))\n'''
          assert old in s, 'Cooking bank cleanup block not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/firemaking/firemakingscript/FireMakingScript.java \
                  kspaccountbuilder/tasks/skilling/cooking/cookingscript/CookingScript.java
          git commit -m "Prevent task resources from being redeposited during bank setup"
          git push origin HEAD:fix/account-builder-bank-prep-loop
