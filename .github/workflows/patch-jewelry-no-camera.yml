name: Jewellery Crafter no-camera interactions

on:
  push:
    branches:
      - jewelry-no-camera-bank-furnace

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[jewelry-no-camera-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_jewelry_no_camera.py
      - name: Commit patch
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: stop Jewellery Crafter rotating camera for bank and furnace [jewelry-no-camera-done]"
          git push
