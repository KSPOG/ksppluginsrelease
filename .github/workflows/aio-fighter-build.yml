name: Build KSP AIO Fighter

on:
  pull_request:
    paths:
      - 'kspaiofighter/**'
      - '.github/tests/aiofighter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/workflows/aio-fighter-build.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'kspaiofighter/**'
      - '.github/tests/aiofighter/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/workflows/aio-fighter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aio-fighter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspAioFighterPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install KSP AIO Fighter sources into Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspaiofighter" "$ROOT/kspsupport" "$ROOT/kspmule" "$ROOT/kspbank"
          cp -R release/kspaiofighter "$ROOT/kspaiofighter"
          cp -R release/kspsupport "$ROOT/kspsupport"
          cp -R release/kspmule "$ROOT/kspmule"
          cp -R release/kspbank "$ROOT/kspbank"

      - name: Include shared KSP packages in Fighter compile source set
        shell: python
        run: |
          from pathlib import Path

          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = '''include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    if (plugin.name == "KspAioFighterPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                        include "${project.ext.getPluginsIncludePath()}/kspmule/**"
                        include "${project.ext.getPluginsIncludePath()}/kspbank/**"
                    }'''
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Make Gradle wrapper executable
        run: chmod +x hub/gradlew

      - name: Run AIO Fighter hot-loop and High Alch regressions
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT=/tmp/ksp-aio-highalch
          mkdir -p "$TEST_ROOT/src" "$TEST_ROOT/bin"
          cp release/kspaiofighter/KspAioFighterHighAlchGate.java "$TEST_ROOT/src/"
          cp release/kspaiofighter/KspAioFighterActionThrottle.java "$TEST_ROOT/src/"
          cp release/.github/tests/aiofighter/KspAioFighterHighAlchGateTest.java.txt "$TEST_ROOT/src/KspAioFighterHighAlchGateTest.java"
          cp release/.github/tests/aiofighter/KspAioFighterActionThrottleTest.java.txt "$TEST_ROOT/src/KspAioFighterActionThrottleTest.java"
          javac --release 11 -d "$TEST_ROOT/bin" "$TEST_ROOT/src/"*.java
          java -cp "$TEST_ROOT/bin" net.runelite.client.plugins.microbot.kspaiofighter.KspAioFighterHighAlchGateTest
          java -cp "$TEST_ROOT/bin" net.runelite.client.plugins.microbot.kspaiofighter.KspAioFighterActionThrottleTest

      - name: Run AIO Fighter potion selection regressions
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT=/tmp/ksp-aio-potitions
          mkdir -p "$TEST_ROOT/src" "$TEST_ROOT/bin"
          cp release/kspaiofighter/KspAioFighterPotionPolicy.java "$TEST_ROOT/src/"
          cp release/.github/tests/aiofighter/KspAioFighterPotionPolicyTest.java.txt "$TEST_ROOT/src/KspAioFighterPotionPolicyTest.java"
          javac --release 11 -d "$TEST_ROOT/bin" "$TEST_ROOT/src/"*.java
          java -cp "$TEST_ROOT/bin" net.runelite.client.plugins.microbot.kspaiofighter.KspAioFighterPotionPolicyTest

      - name: Build KSP AIO Fighter
        working-directory: hub
        run: ./gradlew clean build -PpluginList=KspAioFighterPlugin --stacktrace --no-daemon

      - name: Show produced JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ls -lh hub/build/libs/
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspAioFighterPlugin-*.jar' -print -quit)"

      - name: Upload Fighter JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KspAioFighterPlugin-${{ github.sha }}
          path: hub/build/libs/KspAioFighterPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
