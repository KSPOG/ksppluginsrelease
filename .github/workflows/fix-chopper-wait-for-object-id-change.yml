name: Fix Chopper object-id interaction lock

on:
  push:
    branches:
      - fix-chopper-wait-for-object-id-change

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chopper-object-lock-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Chopper object lock patch
        run: python .github/scripts/fix_chopper_wait_for_object_id_change.py
      - name: Commit Chopper fix
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: wait for active tree object ID change before retarget [chopper-object-lock-fixed]"
          git push
