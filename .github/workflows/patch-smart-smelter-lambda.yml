name: Patch Smart Smelter lambda

on:
  push:
    branches:
      - fix/smart-smelter-final-lambda

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-smelter-final-lambda
      - name: Fix lambda capture and bump version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('kspsmartsmelter/KspSmartSmelterScript.java')
          text = script.read_text(encoding='utf-8')
          old = '''        Microbot.status = "Withdrawing noted " + outputName;
          if (!Rs2Bank.withdrawAll(outputName, true)) {
              Microbot.status = "Failed withdrawing noted " + outputName;
              return;
          }
          if (!sleepUntil(() -> Rs2Inventory.itemQuantity(outputName, true) >= quantity, 5000)) {
              Microbot.status = "Waiting for noted output stack";
              return;
          }

          quantity = Rs2Inventory.itemQuantity(outputName, true);'''
          new = '''        Microbot.status = "Withdrawing noted " + outputName;
          if (!Rs2Bank.withdrawAll(outputName, true)) {
              Microbot.status = "Failed withdrawing noted " + outputName;
              return;
          }
          final int expectedQuantity = quantity;
          if (!sleepUntil(() -> Rs2Inventory.itemQuantity(outputName, true) >= expectedQuantity, 5000)) {
              Microbot.status = "Waiting for noted output stack";
              return;
          }

          quantity = Rs2Inventory.itemQuantity(outputName, true);'''
          if old in text:
              script.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'final int expectedQuantity = quantity;' not in text:
              raise SystemExit('Expected Smart Smelter withdrawal block was not found')

          plugin = Path('kspsmartsmelter/KspSmartSmelterPlugin.java')
          ptext = plugin.read_text(encoding='utf-8')
          if 'VERSION = "0.0.6"' in ptext:
              plugin.write_text(ptext.replace('VERSION = "0.0.6"', 'VERSION = "0.0.7"', 1), encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspsmartsmelter/KspSmartSmelterScript.java kspsmartsmelter/KspSmartSmelterPlugin.java
          git commit -m "Fix Smart Smelter lambda capture"
          git push origin HEAD:fix/smart-smelter-final-lambda
