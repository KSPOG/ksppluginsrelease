name: Patch Smart Smelter lambda

on:
  push:
    branches:
      - fix/smart-smelter-final-lambda

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-smelter-final-lambda
      - name: Fix lambda capture and bump version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('kspsmartsmelter/KspSmartSmelterScript.java')
          text = script.read_text(encoding='utf-8')
          old_line = '        if (!sleepUntil(() -> Rs2Inventory.itemQuantity(outputName, true) >= quantity, 5000)) {'
          new_text = '        final int expectedQuantity = quantity;\n        if (!sleepUntil(() -> Rs2Inventory.itemQuantity(outputName, true) >= expectedQuantity, 5000)) {'
          if old_line in text:
              script.write_text(text.replace(old_line, new_text, 1), encoding='utf-8')
          elif 'final int expectedQuantity = quantity;' not in text:
              raise SystemExit('Expected Smart Smelter lambda line was not found')

          plugin = Path('kspsmartsmelter/KspSmartSmelterPlugin.java')
          ptext = plugin.read_text(encoding='utf-8')
          if 'VERSION = "0.0.6"' in ptext:
              plugin.write_text(ptext.replace('VERSION = "0.0.6"', 'VERSION = "0.0.7"', 1), encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspsmartsmelter/KspSmartSmelterScript.java kspsmartsmelter/KspSmartSmelterPlugin.java
          git commit -m "Fix Smart Smelter lambda capture"
          git push origin HEAD:fix/smart-smelter-final-lambda
