name: Clean verified bank comment

on:
  push:
    branches:
      - harden-verified-bank-targets

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bank-comment-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean comment
        run: python .github/scripts/clean_verified_bank_comment.py
      - name: Commit cleanup
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: clarify Ferox verified bank comment [bank-comment-clean]"
          git push
