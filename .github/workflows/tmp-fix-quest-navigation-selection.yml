name: Temporary quest navigation patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-quest-navigation-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quest-navigation-stable-targets-v2
          fetch-depth: 0
      - name: Apply patch
        run: python maintenance_patch_quest_navigation.py
      - name: Commit patch
        run: |
          rm maintenance_patch_quest_navigation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stabilize quest navigation and rebalance selection"
          git push origin HEAD:fix/quest-navigation-stable-targets-v2
