name: Patch Smart Smelter Edgeville local interaction

on:
  push:
    branches:
      - fix/smart-smelter-edgeville-local-interaction

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[edgeville-local-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-smelter-edgeville-local-interaction

      - name: Apply Edgeville local interaction guard
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('kspsmartsmelter/KspSmartSmelterScript.java')
          text = path.read_text(encoding='utf-8')

          old_bank = '''        FurnaceLocation location = config.furnaceLocation();
        state = SmartSmelterState.WALKING_TO_BANK;

        // Edgeville uses a fixed bank point and booth ID so it cannot wander to an
        // unrelated bank target. If the booth is not in the local scene yet, walk
        // toward Edgeville first and retry the direct interaction on the next tick.
        if (location == FurnaceLocation.EDGEVILLE) {
            Microbot.status = "Opening Edgeville Bank Booth";
            if (Rs2GameObject.interact(EDGEVILLE_BANK_BOOTH_ID, "Bank")
                    && sleepUntil(Rs2Bank::isOpen, 2500)) {
                return true;
            }

            if (location.getBankPoint() != null) {
                Microbot.status = "Walking to Edgeville bank";
                Rs2Walker.walkTo(location.getBankPoint(), 4);
            } else {
                Microbot.status = "Cannot find Edgeville bank location";
            }
            return false;
        }

        Microbot.status = "Opening " + location.getDisplayName() + " bank";
'''

          new_bank = '''        FurnaceLocation location = config.furnaceLocation();

        // Once the account is already in Edgeville, keep the bank/furnace loop local.
        // The walker is only a travel fallback for reaching Edgeville from elsewhere.
        if (location == FurnaceLocation.EDGEVILLE) {
            Microbot.status = "Opening Edgeville Bank Booth";
            if (Rs2GameObject.interact(EDGEVILLE_BANK_BOOTH_ID, "Bank")
                    && sleepUntil(Rs2Bank::isOpen, 2500)) {
                return true;
            }

            if (isInEdgevilleWorkArea()) {
                Microbot.status = "Waiting for Edgeville Bank Booth";
                return false;
            }

            if (location.getBankPoint() != null) {
                state = SmartSmelterState.WALKING_TO_BANK;
                Microbot.status = "Walking to Edgeville bank";
                Rs2Walker.walkTo(location.getBankPoint(), 4);
            } else {
                Microbot.status = "Cannot find Edgeville bank location";
            }
            return false;
        }

        state = SmartSmelterState.WALKING_TO_BANK;
        Microbot.status = "Opening " + location.getDisplayName() + " bank";
'''

          if old_bank not in text:
              raise SystemExit('Expected Edgeville bank block not found')
          text = text.replace(old_bank, new_bank, 1)

          old_furnace = '''        state = SmartSmelterState.WALKING_TO_FURNACE;
        FurnaceLocation location = config.furnaceLocation();

        int beforeOutput = Rs2Inventory.itemQuantity(route.getOutputId());
'''
          new_furnace = '''        FurnaceLocation location = config.furnaceLocation();

        int beforeOutput = Rs2Inventory.itemQuantity(route.getOutputId());
'''
          if old_furnace not in text:
              raise SystemExit('Expected furnace state block not found')
          text = text.replace(old_furnace, new_furnace, 1)

          old_missing_furnace = '''            if (furnace == null) {
                if (location != FurnaceLocation.CURRENT_AREA && location.getFurnacePoint() != null) {
                    Microbot.status = "Walking to " + location.getDisplayName() + " furnace";
                    Rs2Walker.walkTo(location.getFurnacePoint(), 4);
                } else {
                    Microbot.status = "Cannot find Furnace";
                }
                return;
            }
'''
          new_missing_furnace = '''            if (furnace == null) {
                if (location == FurnaceLocation.EDGEVILLE && isInEdgevilleWorkArea()) {
                    Microbot.status = "Waiting for Edgeville Furnace";
                    return;
                }

                if (location != FurnaceLocation.CURRENT_AREA && location.getFurnacePoint() != null) {
                    state = SmartSmelterState.WALKING_TO_FURNACE;
                    Microbot.status = "Walking to " + location.getDisplayName() + " furnace";
                    Rs2Walker.walkTo(location.getFurnacePoint(), 4);
                } else {
                    Microbot.status = "Cannot find Furnace";
                }
                return;
            }
'''
          if old_missing_furnace not in text:
              raise SystemExit('Expected missing furnace block not found')
          text = text.replace(old_missing_furnace, new_missing_furnace, 1)

          marker = '''    private boolean openWorkBank() {
'''
          helper = '''    private boolean isInEdgevilleWorkArea() {
        net.runelite.api.coords.WorldPoint player = Microbot.getClientThread()
                .runOnClientThreadOptional(() -> Microbot.getClient().getLocalPlayer() == null
                        ? null
                        : Microbot.getClient().getLocalPlayer().getWorldLocation())
                .orElse(null);

        net.runelite.api.coords.WorldPoint bank = FurnaceLocation.EDGEVILLE.getBankPoint();
        net.runelite.api.coords.WorldPoint furnace = FurnaceLocation.EDGEVILLE.getFurnacePoint();
        if (player == null || bank == null || furnace == null || player.getPlane() != bank.getPlane()) {
            return false;
        }

        return player.distanceTo(bank) <= 20 || player.distanceTo(furnace) <= 20;
    }

'''
          if marker not in text:
              raise SystemExit('openWorkBank marker not found')
          text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/patch-smart-smelter-edgeville-local.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspsmartsmelter/KspSmartSmelterScript.java .github/workflows/patch-smart-smelter-edgeville-local.yml
          git commit -m "fix: keep Smart Smelter local in Edgeville [edgeville-local-done]"
          git push origin HEAD:fix/smart-smelter-edgeville-local-interaction
