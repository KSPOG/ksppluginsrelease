name: Temporary AIO Fighter combat optimization patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-aio-fast-combat-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aio-fighter-fast-combat-loop
          fetch-depth: 0
      - name: Port Account Builder melee responsiveness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('kspaiofighter/KspAioFighterScript.java')
          s = p.read_text()

          s = s.replace('''\tprivate static final long POST_KILL_LOOT_WINDOW_MS = 350L;\n\tprivate static final long LOOT_CLICK_COOLDOWN_MS = 650L;''',
                        '''\tprivate static final long LOOT_PICKUP_RECOVERY_MS = 900L;\n\tprivate static final long BONE_BURY_RECOVERY_MS = 1_200L;''')

          s = s.replace('''\tprivate boolean wasInCombatOrInteracting = false;\n\tprivate long postKillLootUntilMs = 0L;\n\tprivate int pendingLootId = -1;''',
                        '''\tprivate int pendingLootId = -1;''')
          s = s.replace('''\tprivate long pendingLootUntilMs = 0L;\n\tprivate long lastPaintRefreshMs = 0L;''',
                        '''\tprivate long pendingLootUntilMs = 0L;\n\tprivate int pendingBuryBoneId = -1;\n\tprivate int pendingBuryBoneCount = -1;\n\tprivate long pendingBuryAtMs = 0L;\n\tprivate long lastPaintRefreshMs = 0L;''')

          s = s.replace('scheduleWithFixedDelay(() -> loop(generation), 0, 250, TimeUnit.MILLISECONDS)',
                        'scheduleWithFixedDelay(() -> loop(generation), 0, 100, TimeUnit.MILLISECONDS)')
          s = s.replace('\n\t\t\tupdatePostKillLootState();\n\t\t\trefreshPaintState();', '\n\t\t\trefreshPaintState();')

          old = '''\t\t\tif (buryBonesFromInventory())\n\t\t\t{\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\tif (shouldBankForSupplies())'''
          new = '''\t\t\tif (shouldBankForSupplies())'''
          assert old in s, 'pre-bank bury block not found'
          s = s.replace(old, new, 1)

          old = '''\t\t\tboolean looted = loot();\n\n\t\t\tif (looted || shouldBlockAttackForLoot() || shouldPrioritizePostKillLoot())\n\t\t\t{\n\t\t\t\tsetStatus(looted ? "looting drop" : "checking drops");\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\thighAlch();'''
          new = '''\t\t\tboolean looted = loot();\n\n\t\t\tif (looted || shouldBlockAttackForLoot())\n\t\t\t{\n\t\t\t\tsetStatus(looted ? "looting drop" : "checking drops");\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\t// Fresh owned ground loot is time-sensitive. Bury inventory bones only after\n\t\t\t// the ground is clear, matching Account Builder MeleeScript.\n\t\t\tif (buryBonesFromInventory())\n\t\t\t{\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\thighAlch();'''
          assert old in s, 'loot priority block not found'
          s = s.replace(old, new, 1)

          s = s.replace('''\t\tclearPendingLoot();\n\t\tpostKillLootUntilMs = 0L;''', '''\t\tclearPendingLoot();\n\t\tclearPendingBury();''')

          # Remove post-kill artificial grace-state methods entirely.
          s, n = re.subn(r'''\n\tprivate void updatePostKillLootState\(\)\n\t\{.*?\n\t\}\n\n\tprivate boolean shouldBlockAttackForLoot\(\)''',
                         '\n\tprivate boolean shouldBlockAttackForLoot()', s, count=1, flags=re.S)
          assert n == 1, 'updatePostKillLootState block not found'
          s, n = re.subn(r'''\n\tprivate boolean shouldPrioritizePostKillLoot\(\)\n\t\{.*?\n\t\}\n\n\tprivate boolean isLootingEnabled''',
                         '\n\tprivate boolean isLootingEnabled', s, count=1, flags=re.S)
          assert n == 1, 'post-kill priority method not found'

          start = s.index('\tprivate boolean buryBonesFromInventory()')
          end = s.index('\tprivate Rs2ItemModel getBuryableInventoryBone()', start)
          s = s[:start] + '''\tprivate boolean buryBonesFromInventory()\n\t{\n\t\tif (!config.buryBones() || Rs2Bank.isOpen() || isActivelyFightingForLoot())\n\t\t{\n\t\t\tclearPendingBury();\n\t\t\treturn false;\n\t\t}\n\n\t\tif (isBoneBuryPending()) return true;\n\t\tif (Rs2Player.isMoving()) return false;\n\n\t\tRs2ItemModel bone = getBuryableInventoryBone();\n\t\tif (bone == null) return false;\n\n\t\tint before = Rs2Inventory.count(bone.getId());\n\t\tString boneName = bone.getName() == null || bone.getName().isBlank() ? "bones" : bone.getName();\n\t\tsetStatus("burying " + boneName);\n\n\t\tif (!Rs2Inventory.interact(boneName, "Bury", true))\n\t\t{\n\t\t\tlastError = "failed to bury " + boneName;\n\t\t\tlastErrorMs = System.currentTimeMillis();\n\t\t\treturn false;\n\t\t}\n\n\t\tpendingBuryBoneId = bone.getId();\n\t\tpendingBuryBoneCount = before;\n\t\tpendingBuryAtMs = System.currentTimeMillis();\n\t\treturn true;\n\t}\n\n\tprivate boolean isBoneBuryPending()\n\t{\n\t\tif (pendingBuryBoneId < 0 || pendingBuryAtMs <= 0L) return false;\n\n\t\tint currentCount = Rs2Inventory.count(pendingBuryBoneId);\n\t\tif (currentCount < pendingBuryBoneCount)\n\t\t{\n\t\t\tclearPendingBury();\n\t\t\treturn Rs2Player.isAnimating();\n\t\t}\n\n\t\tif (Rs2Player.isAnimating()) return true;\n\t\tif (System.currentTimeMillis() - pendingBuryAtMs < BONE_BURY_RECOVERY_MS) return true;\n\n\t\tclearPendingBury();\n\t\treturn false;\n\t}\n\n\tprivate void clearPendingBury()\n\t{\n\t\tpendingBuryBoneId = -1;\n\t\tpendingBuryBoneCount = -1;\n\t\tpendingBuryAtMs = 0L;\n\t}\n\n''' + s[end:]

          s = s.replace('''\t\tif (!isLootingEnabled() || Rs2Inventory.isFull() || Rs2Player.isMoving() || isActivelyFightingForLoot())''',
                        '''\t\tif (!isLootingEnabled() || Rs2Inventory.isFull() || isActivelyFightingForLoot())''')

          old = '''\t\tif (clicked)\n\t\t{\n\t\t\tlootCollectedSinceBank = true;\n\t\t\tmarkLootPickupPending(loot);\n\t\t\tpostKillLootUntilMs = Math.max(postKillLootUntilMs, System.currentTimeMillis() + 350L);\n\t\t\tsleepUntil(() -> Rs2Player.isMoving() || Rs2Player.isInteracting() || findNextLoot() == null, 450);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tpendingLootUntilMs = System.currentTimeMillis() + 250L;\n\t\t\tsetStatus("loot click unavailable");\n\t\t}\n\t\treturn clicked;'''
          new = '''\t\tif (clicked)\n\t\t{\n\t\t\tlootCollectedSinceBank = true;\n\t\t\tmarkLootPickupPending(loot);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tsetStatus("loot click unavailable");\n\t\t}\n\t\treturn clicked;'''
          assert old in s, 'loot click wait block not found'
          s = s.replace(old, new, 1)

          start = s.index('\tprivate boolean isLootPickupPending()')
          end = s.index('\tprivate void markLootPickupPending', start)
          s = s[:start] + '''\tprivate boolean isLootPickupPending()\n\t{\n\t\tif (pendingLootUntilMs <= 0L) return false;\n\n\t\tboolean stillOnGround = Microbot.getRs2TileItemCache().query()\n\t\t\t\t.fromWorldView()\n\t\t\t\t.where(item -> item != null)\n\t\t\t\t.where(item -> item.getId() == pendingLootId)\n\t\t\t\t.where(item -> {\n\t\t\t\t\tLocalPoint localPoint = item.getLocalLocation();\n\t\t\t\t\treturn localPoint != null\n\t\t\t\t\t\t\t&& localPoint.getSceneX() == pendingLootSceneX\n\t\t\t\t\t\t\t&& localPoint.getSceneY() == pendingLootSceneY\n\t\t\t\t\t\t\t&& localPoint.getWorldView() == pendingLootWorldViewId;\n\t\t\t\t})\n\t\t\t\t.nearestOnClientThread() != null;\n\n\t\tif (!stillOnGround)\n\t\t{\n\t\t\tclearPendingLoot();\n\t\t\treturn false;\n\t\t}\n\n\t\tif (System.currentTimeMillis() >= pendingLootUntilMs)\n\t\t{\n\t\t\t// Click did not start or movement stalled. Release the pending state so the\n\t\t\t// next 100 ms loop can retry the still-owned ground item immediately.\n\t\t\tclearPendingLoot();\n\t\t\treturn false;\n\t\t}\n\n\t\tsetStatus(Rs2Player.isMoving() ? "moving to loot pickup" : "waiting for loot pickup");\n\t\treturn true;\n\t}\n\n''' + s[end:]
          s = s.replace('pendingLootUntilMs = System.currentTimeMillis() + LOOT_CLICK_COOLDOWN_MS;',
                        'pendingLootUntilMs = System.currentTimeMillis() + LOOT_PICKUP_RECOVERY_MS;')

          # Initialize transient event states on every run.
          marker = '''\t\tattackAreaReturnTarget = null;\n\t\tlastGearBankSkill = null;'''
          repl = '''\t\tattackAreaReturnTarget = null;\n\t\tclearPendingLoot();\n\t\tclearPendingBury();\n\t\tlastGearBankSkill = null;'''
          assert marker in s, 'run init marker not found'
          s = s.replace(marker, repl, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaiofighter/KspAioFighterScript.java
          git commit -m "Speed up AIO Fighter combat and looting"
          git push origin HEAD:fix/aio-fighter-fast-combat-loop
