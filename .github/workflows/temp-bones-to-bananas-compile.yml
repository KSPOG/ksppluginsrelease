name: Temporary Bones to Bananas Compile Check

concurrency:
  group: bones-to-bananas-compile
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/ksp-bones-to-bananas

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KSP sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Bones to Bananas plugin source
        run: |
          mkdir -p microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspbonestobananas
          cp release/kspbonestobananas/*.java microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspbonestobananas/

      - name: Compile RuneLite client
        working-directory: microbot
        run: ./gradlew :client:compileJava --no-daemon
