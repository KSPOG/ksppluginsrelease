name: Apply AIO Fighter Setup Context Fix

on:
  push:
    branches:
      - feature/aio-fighter-setup-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aio-fighter-setup-context
          fetch-depth: 0

      - name: Patch setup selection and dungeon map mode
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              for label, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path_name} / {label}: expected 1 occurrence, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          patch('kspaiofighter/KspAioFighterInventoryLoader.java', [
              ('active style visibility',
               '    private KspAioFighterGearStyle activeStyle()\n',
               '    KspAioFighterGearStyle activeStyle()\n')
          ])

          patch('kspaiofighter/KspAioFighterPlugin.java', [
              ('start style declaration',
               '''\t\tfinal long generation;\n\t\tsynchronized (this)''',
               '''\t\tfinal long generation;\n\t\tfinal KspAioFighterGearStyle startStyle;\n\t\tsynchronized (this)'''),
              ('capture style before target mutation',
               '''\t\t\t// The side-panel slot selections are authoritative. Refresh the legacy CSV\n\t\t\t// compatibility mirror immediately before every run so stale hidden settings\n\t\t\t// can never make the fighter request old equipment.\n\t\t\tequipmentSettings.syncPanelGearToRuntime();\n\t\t\tlevelTargetSettings.prepareForRun();''',
               '''\t\t\t// Resolve the next combat setup before prepareForRun() mutates target values.\n\t\t\t// Otherwise disabling level targets temporarily sets every target to 99 and\n\t\t\t// can make the inventory loader incorrectly fall back to the Attack setup.\n\t\t\tstartStyle = inventoryLoader.activeStyle();\n\n\t\t\t// The side-panel slot selections are authoritative. Refresh the legacy CSV\n\t\t\t// compatibility mirror immediately before every run so stale hidden settings\n\t\t\t// can never make the fighter request old equipment.\n\t\t\tequipmentSettings.syncPanelGearToRuntime();\n\t\t\tlevelTargetSettings.prepareForRun();'''),
              ('load captured style',
               '''\t\t\t\tloaded = inventoryLoader.loadActiveSetup();\n\t\t\t\tif (!loaded) error = inventoryLoader.getLastError();''',
               '''\t\t\t\tloaded = startStyle == null || inventoryLoader.load(startStyle);\n\t\t\t\tif (!loaded) error = inventoryLoader.getLastError();''')
          ])

          patch('kspaiofighter/KspAioFighterAreaMapDialog.java', [
              ('plane combo',
               '''        JComboBox<Integer> plane = new JComboBox<>(new Integer[]{0, 1, 2, 3});\n        plane.setSelectedItem(mapCanvas.getPlane());\n        plane.addActionListener(e -> {\n            Integer selected = (Integer) plane.getSelectedItem();\n            if (selected != null)\n            {\n                mapCanvas.setPlane(selected);\n            }\n        });\n        mapControls.add(plane);''',
               '''        JComboBox<String> plane = new JComboBox<>(new String[]{"0", "1", "2", "3", "Dungeon"});\n        plane.setToolTipText("Dungeon opens the high-Y dungeon map space while preserving the real RuneLite plane (0-3)");\n        plane.setSelectedItem(mapCanvas.getCentreWorldPoint().getY() >= 6400\n            ? "Dungeon"\n            : Integer.toString(mapCanvas.getPlane()));\n        plane.addActionListener(e -> {\n            String selected = (String) plane.getSelectedItem();\n            if (selected == null) return;\n\n            if ("Dungeon".equals(selected))\n            {\n                WorldPoint centre = mapCanvas.getCentreWorldPoint();\n                if (centre.getY() < 6400)\n                {\n                    mapCanvas.centerOn(new WorldPoint(centre.getX(), 9600, mapCanvas.getPlane()));\n                }\n                return;\n            }\n\n            try\n            {\n                mapCanvas.setPlane(Integer.parseInt(selected));\n            }\n            catch (NumberFormatException ignored)\n            {\n            }\n        });\n        mapControls.add(plane);'''),
              ('player button plane selection',
               '''            mapCanvas.centerOn(playerOrFallbackCentre);\n            plane.setSelectedItem(mapCanvas.getPlane());''',
               '''            mapCanvas.centerOn(playerOrFallbackCentre);\n            plane.setSelectedItem(playerOrFallbackCentre.getY() >= 6400\n                ? "Dungeon"\n                : Integer.toString(mapCanvas.getPlane()));'''),
              ('go worldpoint plane selection',
               '''                Integer selectedPlane = (Integer) plane.getSelectedItem();\n                int z = selectedPlane == null ? mapCanvas.getPlane() : selectedPlane;\n                WorldPoint target = new WorldPoint(x, y, z);''',
               '''                String selectedPlane = (String) plane.getSelectedItem();\n                int z = mapCanvas.getPlane();\n                if (selectedPlane != null && !"Dungeon".equals(selectedPlane))\n                {\n                    try\n                    {\n                        z = Integer.parseInt(selectedPlane);\n                    }\n                    catch (NumberFormatException ignored)\n                    {\n                    }\n                }\n                WorldPoint target = new WorldPoint(x, y, z);'''),
              ('dungeon hint',
               '''        JLabel coordinateHint = new JLabel("Dungeon maps commonly use high world Y values (for example 9000+)");''',
               '''        JLabel coordinateHint = new JLabel("Dungeon = high-Y map space; actual saved plane remains 0-3");''')
          ])

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-aio-fighter-setup-context.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kspaiofighter/KspAioFighterInventoryLoader.java \
                  kspaiofighter/KspAioFighterPlugin.java \
                  kspaiofighter/KspAioFighterAreaMapDialog.java \
                  .github/workflows/apply-aio-fighter-setup-context.yml
          git commit -m 'Fix AIO Fighter setup context and dungeon map mode'
          git push origin HEAD:feature/aio-fighter-setup-context
