name: GE Flipper Server
on:
  push:
    paths:
      - 'KspGEFlipperServer/**'
      - '.github/workflows/ge-flipper-server.yml'
  pull_request:
    paths:
      - 'KspGEFlipperServer/**'
      - '.github/workflows/ge-flipper-server.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KspGEFlipperServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --update-snapshots package
      - run: java -cp target/classes com.ksp.geflipper.selftest.SelfTest
