name: Validate mule stability patch

on:
  push:
    branches:
      - fix/mule-stability-throttling

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mule-stability-throttling

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply stability patch
        shell: bash
        run: |
          echo '   ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check

      - name: Compile receiver and shared mule against Microbot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/chsami/Microbot.git /tmp/microbot
          ROOT="/tmp/microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot"
          rm -rf "$ROOT/KSPTradeReceiver" "$ROOT/kspmule"
          mkdir -p "$ROOT/KSPTradeReceiver" "$ROOT/kspmule"
          cp KSPTradeReceiver/*.java "$ROOT/KSPTradeReceiver/"
          cp kspmule/*.java "$ROOT/kspmule/"
          cat > "$ROOT/PluginConstants.java" <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
              private PluginConstants() {}
          }
          EOF
          cd /tmp/microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Commit validated stability patch
        shell: bash
        run: |
          rm -f .github/workflows/temp-mule-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspmule/KspMuleWorkerService.java \
                  KSPTradeReceiver/KspLocalMuleServer.java \
                  KSPTradeReceiver/KspLocalMuleCoordinatorService.java \
                  KSPTradeReceiver/KSPTradeReceiverScript.java \
                  KSPTradeReceiver/KSPTradeReceiverPlugin.java \
                  .github/workflows/temp-mule-stability.yml
          git diff --cached --check
          git commit -m "Reduce mule polling and long-session resource growth"
          git push origin HEAD:fix/mule-stability-throttling
