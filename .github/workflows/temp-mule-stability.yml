name: Validate mule stability patch

on:
  push:
    branches:
      - fix/mule-stability-throttling

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mule-stability-throttling

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply stability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kspmule/KspMuleWorkerService.java')
          s = p.read_text(encoding='utf-8')
          assert 'POLL_MS = 250L' in s
          assert 'NETWORK_POLL_MS = 700L' in s
          s = s.replace('POLL_MS = 250L', 'POLL_MS = 1_000L', 1)
          s = s.replace('NETWORK_POLL_MS = 700L', 'NETWORK_POLL_MS = 1_000L', 1)
          s = s.replace('        refreshCoinSummary();\n\n        if (!c.muleEnabled())', '        if (!c.muleEnabled())', 1)
          login_block = '''        if (!Microbot.isLoggedIn())
          {
              status = "Waiting for worker login";
              return;
          }
          '''
          assert login_block in s
          s = s.replace(login_block, login_block + '        refreshCoinSummary();\n', 1)
          idle_ping = '            receiverOnline = client.ping(c.muleReceiverPort());\n'
          assert idle_ping in s
          s = s.replace(idle_ping, '', 1)
          walk = '            Rs2Walker.walkTo(muleTile, 2);\n'
          assert walk in s
          s = s.replace(walk, '            if (!Rs2Player.isMoving()) Rs2Walker.walkTo(muleTile, 2);\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('KSPTradeReceiver/KspLocalMuleServer.java')
          s = p.read_text(encoding='utf-8')
          assert 'Executors.newCachedThreadPool(r -> {' in s
          s = s.replace('Executors.newCachedThreadPool(r -> {', 'Executors.newFixedThreadPool(2, r -> {', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('KSPTradeReceiver/KspLocalMuleCoordinatorService.java')
          s = p.read_text(encoding='utf-8')
          assert 'executor.scheduleWithFixedDelay(this::tickSafely, 0L, 250L, TimeUnit.MILLISECONDS);' in s
          s = s.replace('executor.scheduleWithFixedDelay(this::tickSafely, 0L, 250L, TimeUnit.MILLISECONDS);',
                        'executor.scheduleWithFixedDelay(this::tickSafely, 0L, 500L, TimeUnit.MILLISECONDS);', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('KSPTradeReceiver/KSPTradeReceiverScript.java')
          s = p.read_text(encoding='utf-8')
          assert '}, 0, 150, TimeUnit.MILLISECONDS);' in s
          s = s.replace('}, 0, 150, TimeUnit.MILLISECONDS);', '}, 0, 300, TimeUnit.MILLISECONDS);', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('KSPTradeReceiver/KSPTradeReceiverPlugin.java')
          s = p.read_text(encoding='utf-8')
          assert 'public static final String VERSION = "0.2.1";' in s
          s = s.replace('public static final String VERSION = "0.2.1";', 'public static final String VERSION = "0.2.2";', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Compile receiver and shared mule against Microbot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/chsami/Microbot.git /tmp/microbot
          ROOT="/tmp/microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot"
          rm -rf "$ROOT/KSPTradeReceiver" "$ROOT/kspmule"
          mkdir -p "$ROOT/KSPTradeReceiver" "$ROOT/kspmule"
          cp KSPTradeReceiver/*.java "$ROOT/KSPTradeReceiver/"
          cp kspmule/*.java "$ROOT/kspmule/"
          cat > "$ROOT/PluginConstants.java" <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
              private PluginConstants() {}
          }
          EOF
          cd /tmp/microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Commit validated stability patch
        shell: bash
        run: |
          rm -f .github/workflows/temp-mule-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspmule/KspMuleWorkerService.java \
                  KSPTradeReceiver/KspLocalMuleServer.java \
                  KSPTradeReceiver/KspLocalMuleCoordinatorService.java \
                  KSPTradeReceiver/KSPTradeReceiverScript.java \
                  KSPTradeReceiver/KSPTradeReceiverPlugin.java \
                  .github/workflows/temp-mule-stability.yml
          git diff --cached --check
          git commit -m "Reduce mule background resource usage"
          git push origin HEAD:fix/mule-stability-throttling
