name: ChatGPT Collision Map Bundle

on:
  push:
    branches:
      - chatgpt-collision-bundle-20260916

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build actual updated file bundle
        shell: bash
        run: |
          set -euo pipefail
          REPO="$PWD"
          ROOT="$REPO/out/KSP_Microbot_CollisionMap_Full_Update"
          RES="$ROOT/runelite-client/src/main/resources/net/runelite/client/plugins/microbot/shortestpath"
          mkdir -p "$RES"

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Skretzo/shortest-path/7e76a5e2cda3da3c772ddd347d75d89eae0139eb/src/main/resources/collision-map.zip" \
            -o "$RES/collision-map.zip"

          for f in blocked_edges.tsv restrictions.tsv spirit_trees.tsv teleportation_items.tsv transports.tsv; do
            curl -fL --retry 3 \
              "https://raw.githubusercontent.com/chsami/Microbot/main/runelite-client/src/main/resources/net/runelite/client/plugins/microbot/shortestpath/$f" \
              -o "$RES/$f"
          done

          unzip -tq "$RES/collision-map.zip"

          TMP="$REPO/mapcheck"
          mkdir -p "$TMP"
          unzip -q "$RES/collision-map.zip" -d "$TMP"

          DRAYNOR="48_152"
          if [ ! -f "$TMP/$DRAYNOR" ]; then
            echo "ERROR: Draynor Manor basement collision region $DRAYNOR is missing." >&2
            exit 1
          fi

          MOTHERLODE=(57_87 57_88 57_89 58_87 58_88 58_89 59_87 59_88 59_89)
          FOUND=()
          for r in "${MOTHERLODE[@]}"; do
            if [ -f "$TMP/$r" ]; then
              FOUND+=("$r")
            fi
          done

          if [ ${#FOUND[@]} -eq 0 ]; then
            echo "ERROR: No Motherlode Mine collision payload is present in the map." >&2
            exit 1
          fi
          if [ ! -f "$TMP/58_88" ]; then
            echo "ERROR: Core Motherlode Mine region 58_88 is missing." >&2
            exit 1
          fi

          DRAYNOR_SHA=$(sha256sum "$TMP/$DRAYNOR" | awk '{print $1}')
          : > "$ROOT/MOTHERLODE_COLLISION_REGIONS.txt"
          for r in "${FOUND[@]}"; do
            R_SHA=$(sha256sum "$TMP/$r" | awk '{print $1}')
            if [ "$R_SHA" = "$DRAYNOR_SHA" ] || cmp -s "$TMP/$DRAYNOR" "$TMP/$r"; then
              echo "ERROR: Motherlode region $r is identical to Draynor $DRAYNOR." >&2
              exit 1
            fi
            printf '%s  sha256=%s\n' "$r" "$R_SHA" >> "$ROOT/MOTHERLODE_COLLISION_REGIONS.txt"
          done

          MAP_SHA256=$(sha256sum "$RES/collision-map.zip" | awk '{print $1}')
          FOUND_TEXT=$(printf '%s ' "${FOUND[@]}")

          cat > "$ROOT/README.txt" <<EOF
          KSP Microbot Collision Map Full Update
          ======================================

          This archive contains the actual replacement files. There is no installer,
          downloader or apply-patch script inside this package.

          Collision map source:
            Skretzo/shortest-path commit 7e76a5e2cda3da3c772ddd347d75d89eae0139eb
            OSRS-cache collision extraction committed 2026-09-10.

          collision-map.zip SHA-256:
            $MAP_SHA256

          Official Motherlode RuneLite regions checked:
            57_87 57_88 57_89 58_87 58_88 58_89 59_87 59_88 59_89

          Motherlode collision payloads physically stored in this sparse map archive:
            $FOUND_TEXT

          Core Motherlode region 58_88: PRESENT
          Draynor Manor basement 48_152: PRESENT

          Every physically stored Motherlode payload was compared byte-for-byte and by SHA-256
          against Draynor Manor basement 48_152. None are identical.

          See MOTHERLODE_COLLISION_REGIONS.txt for hashes of the stored Motherlode payloads.

          Included companion Microbot resources:
            blocked_edges.tsv
            restrictions.tsv
            spirit_trees.tsv
            teleportation_items.tsv
            transports.tsv

          Installation:
            Copy the included runelite-client folder over the same folder in your Microbot
            source tree, preserving the directory structure, then rebuild Microbot normally.
          EOF

          cd "$REPO/out"
          zip -qr "$REPO/KSP_Microbot_CollisionMap_Full_Update_2026-09-10.zip" KSP_Microbot_CollisionMap_Full_Update
          sha256sum "$REPO/KSP_Microbot_CollisionMap_Full_Update_2026-09-10.zip"

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KSP_Microbot_CollisionMap_Full_Update_2026-09-10
          path: KSP_Microbot_CollisionMap_Full_Update_2026-09-10.zip
          if-no-files-found: error
          retention-days: 7
