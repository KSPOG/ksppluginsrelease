name: Temporary Robes Emote Animation Compile Check

concurrency:
  group: robes-emote-animation-compile
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/robes-emote-animation-tracking

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KSP sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Robes of Ruin plugin source
        run: |
          mkdir -p microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/ksprobesofruin
          cp release/ksprobesofruin/*.java microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/ksprobesofruin/

      - name: Compile RuneLite client
        working-directory: microbot
        run: ./gradlew :client:compileJava --no-daemon
