name: Temporary Kebab Buyer Compile Check

concurrency:
  group: kebab-buyer-compile
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/kebab-buyer-all-coins-stop

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KSP sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Kebab Buyer source
        run: |
          mkdir -p microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspkebabbuyer
          cp release/kspkebabbuyer/*.java microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspkebabbuyer/

      - name: Install shared KSP bank helper
        run: |
          mkdir -p microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspbank
          cp release/kspbank/*.java microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspbank/

      - name: Compile RuneLite client
        working-directory: microbot
        run: ./gradlew :client:compileJava --no-daemon
