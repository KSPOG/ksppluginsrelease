name: Finish Boss Gear Wiki coverage

on:
  push:
    branches:
      - feat/bossgear-all-wiki-loadouts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bossgear-coverage-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bossgear-all-wiki-loadouts
      - name: Apply coverage patch
        run: python .github/scripts/finish_bossgear_coverage.py
      - name: Commit coverage patch
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspbossgear/WikiGearService.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: cover all Wiki bosses raids and supply notes [bossgear-coverage-applied]"
          git push origin HEAD:feat/bossgear-all-wiki-loadouts
