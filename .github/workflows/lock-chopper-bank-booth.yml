name: Lock Chopper banking to Bank Booth 10583

on:
  push:
    branches:
      - fix-chopper-id-retarget-no-webwalker

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bank-booth-locked]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Bank Booth restriction
        run: python .github/scripts/lock_chopper_bank_booth.py
      - name: Commit restriction
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restrict Chopper banking to Bank Booth 10583 [bank-booth-locked]"
          git push
