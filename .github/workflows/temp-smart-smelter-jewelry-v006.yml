name: SmartSmelterJewelryPatch

on: push

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-smart-smelter-v006.py
      - name: Commit patch
        run: |
          rm -f .github/patch-smart-smelter-v006.py
          rm -f .github/workflows/temp-smart-smelter-jewelry-v006.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspsmartsmelter .github
          git commit -m "Port Jewellery Crafter GE handling to Smart Smelter"
          git push
