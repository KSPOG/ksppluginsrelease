name: Validate Smart Superheat rewrite
on:
  push:
    branches: [rewrite/smart-superheat-clean]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ksp
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Inject Smart Superheat and compile
        shell: bash
        run: |
          set -euo pipefail
          pkg=microbot/client/src/main/java/net/runelite/client/plugins/microbot/kspsmartsuperheat
          mkdir -p "$pkg"
          cp ksp/kspsmartsuperheat/*.java "$pkg/"
          constants=microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java
          if [ ! -f "$constants" ]; then
            cat > "$constants" <<'JAVA'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
          }
          JAVA
          fi
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon
