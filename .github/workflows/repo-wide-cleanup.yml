name: Temporary repo-wide KSP cleanup

on:
  push:
    branches:
      - cleanup/repo-wide-reactive-source-pass

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/repo-wide-reactive-source-pass
          fetch-depth: 0

      - name: Clean and tighten Java sources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          java_files = sorted(Path(".").rglob("*.java"))
          before_lines = changed_lines = changed_files = loops_tightened = compacted_methods = 0

          single_statement = re.compile(
              r'(?m)^(?P<indent>[ \t]*)(?P<sig>(?:public|protected|private)\s+'
              r'(?:(?:static|final|synchronized|abstract)\s+)*'
              r'[A-Za-z_$][\w$<>\[\].?, @]*\s+[A-Za-z_$][\w$]*\([^{}\n]*\))'
              r'\s*\n(?P=indent)\{\s*\n'
              r'(?P=indent)[ \t]+(?P<stmt>[^{}\n;]+;)\s*\n'
              r'(?P=indent)\}'
          )

          empty_constructor = re.compile(
              r'(?m)^(?P<indent>[ \t]*)(?P<sig>(?:public|protected|private)\s+'
              r'[A-Z][A-Za-z0-9_$]*\([^{}\n]*\))\s*\n'
              r'(?P=indent)\{\s*\n(?P=indent)\}'
          )

          def compact_single(match):
              global compacted_methods
              line = f"{match.group('indent')}{match.group('sig')} {{ {match.group('stmt').strip()} }}"
              if len(line) <= 160:
                  compacted_methods += 1
                  return line
              return match.group(0)

          def compact_empty(match):
              global compacted_methods
              line = f"{match.group('indent')}{match.group('sig')} {{}}"
              if len(line) <= 160:
                  compacted_methods += 1
                  return line
              return match.group(0)

          for path in java_files:
              old = path.read_text(encoding="utf-8")
              before_lines += old.count("\n") + 1
              new = re.sub(r'[ \t]+$', '', old, flags=re.M)
              new = re.sub(r'\n{4,}', '\n\n\n', new)

              # Responsiveness comes from the polling cadence, not from line count.
              # Keep already-fast scripts unchanged; cap slower script loops at 250 ms.
              if path.name.endswith("Script.java"):
                  def tighten_loop(match):
                      global loops_tightened
                      raw = match.group("value")
                      value = int(raw.replace("_", ""))
                      if value <= 250:
                          return match.group(0)
                      loops_tightened += 1
                      return f'{match.group("prefix")}250{match.group("suffix")}'
                  new = re.sub(
                      r'(?P<prefix>\bLOOP_DELAY_MS\s*=\s*)'
                      r'(?P<value>\d[\d_]*)(?:L)?'
                      r'(?P<suffix>\s*;)',
                      tighten_loop,
                      new
                  )

              # Keep genuinely trivial methods concise without minifying real logic.
              new = single_statement.sub(compact_single, new)
              new = empty_constructor.sub(compact_empty, new)

              if new != old:
                  path.write_text(new, encoding="utf-8")
                  changed_files += 1
                  changed_lines += (old.count("\n") + 1) - (new.count("\n") + 1)

          after_lines = before_lines - changed_lines
          print(f"Java files scanned: {len(java_files)}")
          print(f"Java files changed: {changed_files}")
          print(f"Lines before: {before_lines}")
          print(f"Lines after: {after_lines}")
          print(f"Lines removed: {changed_lines}")
          print(f"Trivial methods compacted: {compacted_methods}")
          print(f"Slow script loops tightened: {loops_tightened}")
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          test -n "$(find . -name '*.java' -print -quit)"

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/repo-wide-cleanup.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean KSP sources and tighten script response loops"
          git push origin HEAD:cleanup/repo-wide-reactive-source-pass
