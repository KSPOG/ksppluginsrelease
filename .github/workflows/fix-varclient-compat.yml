name: One-shot VarClient compatibility fix

on:
  push:
    branches: [ fix/account-builder-varclient-compat ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-builder-varclient-compat
          fetch-depth: 0
      - name: Patch SellScript VarClient compatibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/selling/sellscript/SellScript.java')
          s = p.read_text(encoding='utf-8')
          old_import = 'import net.runelite.api.VarClientID;'
          new_import = 'import net.runelite.api.VarClientStr;'
          old_use = 'VarClientID.MESLAYERINPUT'
          new_use = 'VarClientStr.INPUT_TEXT'
          if old_import not in s:
              raise SystemExit('Expected VarClientID import not found')
          if old_use not in s:
              raise SystemExit('Expected VarClientID.MESLAYERINPUT usage not found')
          s = s.replace(old_import, new_import).replace(old_use, new_use)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-varclient-compat.yml').unlink(missing_ok=True)
      - name: Verify compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'VarClientID' kspaccountbuilder/tasks/skilling/selling/sellscript/SellScript.java
          grep -n 'VarClientStr.INPUT_TEXT' kspaccountbuilder/tasks/skilling/selling/sellscript/SellScript.java
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Account Builder VarClient compatibility'
          git push origin HEAD:fix/account-builder-varclient-compat
