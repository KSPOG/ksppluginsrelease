name: Apply AIO Fighter Map Space Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-aio-map-space-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch map-space controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('kspaiofighter/KspAioFighterAreaMapDialog.java')
          text = path.read_text(encoding='utf-8')
          start = text.index('        JPanel mapControls = new JPanel(new FlowLayout(FlowLayout.RIGHT, 5, 0));')
          end = text.index('        mapCanvas.setBorder(BorderFactory.createLineBorder(ColorScheme.DARKER_GRAY_COLOR));', start)

          replacement = '''        WorldPoint visibleCentre = mapCanvas.getCentreWorldPoint();
        JTextField worldX = new JTextField(Integer.toString(visibleCentre.getX()), 6);
        JTextField worldY = new JTextField(Integer.toString(visibleCentre.getY()), 6);

        final WorldPoint[] surfaceCentre = {
            visibleCentre.getY() < 6400
                ? visibleCentre
                : new WorldPoint(DEFAULT_X, DEFAULT_Y, mapCanvas.getPlane())
        };
        final WorldPoint[] dungeonCentre = {
            visibleCentre.getY() >= 6400
                ? visibleCentre
                : new WorldPoint(visibleCentre.getX(), 9600, mapCanvas.getPlane())
        };
        final String[] activeSpace = {visibleCentre.getY() >= 6400 ? "Dungeon" : "Surface"};
        final boolean[] changingSpace = {false};

        JPanel mapControls = new JPanel(new FlowLayout(FlowLayout.RIGHT, 5, 0));
        mapControls.add(new JLabel("Map:"));
        JComboBox<String> mapSpace = new JComboBox<>(new String[]{"Surface", "Dungeon"});
        mapSpace.setToolTipText("Surface and Dungeon are different coordinate spaces; Plane remains the real RuneLite Z value");
        mapSpace.setSelectedItem(activeSpace[0]);
        mapControls.add(mapSpace);

        mapControls.add(new JLabel("Plane:"));
        JComboBox<Integer> plane = new JComboBox<>(new Integer[]{0, 1, 2, 3});
        plane.setSelectedItem(mapCanvas.getPlane());
        plane.addActionListener(e -> {
            Integer selected = (Integer) plane.getSelectedItem();
            if (selected != null) mapCanvas.setPlane(selected);
        });
        mapControls.add(plane);

        mapSpace.addActionListener(e -> {
            if (changingSpace[0]) return;
            String selected = (String) mapSpace.getSelectedItem();
            if (selected == null || selected.equals(activeSpace[0])) return;

            WorldPoint current = mapCanvas.getCentreWorldPoint();
            if ("Dungeon".equals(activeSpace[0])) dungeonCentre[0] = current;
            else surfaceCentre[0] = current;

            WorldPoint remembered = "Dungeon".equals(selected) ? dungeonCentre[0] : surfaceCentre[0];
            WorldPoint target = new WorldPoint(remembered.getX(), remembered.getY(), mapCanvas.getPlane());
            mapCanvas.centerOn(target);
            activeSpace[0] = selected;
            worldX.setText(Integer.toString(target.getX()));
            worldY.setText(Integer.toString(target.getY()));
        });

        JButton centreButton = new JButton("Player");
        centreButton.setToolTipText("Centre on your current/configured location and select its map space");
        centreButton.addActionListener(e -> {
            WorldPoint target = new WorldPoint(playerOrFallbackCentre.getX(), playerOrFallbackCentre.getY(), playerOrFallbackCentre.getPlane());
            mapCanvas.centerOn(target);
            plane.setSelectedItem(target.getPlane());
            String space = target.getY() >= 6400 ? "Dungeon" : "Surface";
            if ("Dungeon".equals(space)) dungeonCentre[0] = target;
            else surfaceCentre[0] = target;
            activeSpace[0] = space;
            changingSpace[0] = true;
            try { mapSpace.setSelectedItem(space); }
            finally { changingSpace[0] = false; }
            worldX.setText(Integer.toString(target.getX()));
            worldY.setText(Integer.toString(target.getY()));
        });
        mapControls.add(centreButton);

        JButton openExplv = new JButton("Open Explv");
        openExplv.setToolTipText("Open the same coordinates in Explv for comparison");
        openExplv.addActionListener(e -> openExplvInBrowser());
        mapControls.add(openExplv);

        JPanel coordinateControls = new JPanel(new FlowLayout(FlowLayout.LEFT, 5, 0));
        coordinateControls.add(new JLabel("World X:"));
        coordinateControls.add(worldX);
        coordinateControls.add(new JLabel("Y:"));
        coordinateControls.add(worldY);

        JButton goToWorldPoint = new JButton("Go to WorldPoint");
        goToWorldPoint.setToolTipText("Supports surface and dungeon/high-Y coordinates, e.g. 3118, 9837, 0");
        goToWorldPoint.addActionListener(e -> {
            try
            {
                int x = Integer.parseInt(worldX.getText().trim());
                int y = Integer.parseInt(worldY.getText().trim());
                Integer selectedPlane = (Integer) plane.getSelectedItem();
                int z = selectedPlane == null ? mapCanvas.getPlane() : selectedPlane;
                WorldPoint target = new WorldPoint(x, y, z);
                if (!valid(target)) return;

                String space = y >= 6400 ? "Dungeon" : "Surface";
                if ("Dungeon".equals(space)) dungeonCentre[0] = target;
                else surfaceCentre[0] = target;
                activeSpace[0] = space;
                changingSpace[0] = true;
                try { mapSpace.setSelectedItem(space); }
                finally { changingSpace[0] = false; }
                mapCanvas.centerOn(target);
            }
            catch (NumberFormatException ignored)
            {
            }
        });
        coordinateControls.add(goToWorldPoint);

        JLabel coordinateHint = new JLabel("Map selects Surface/Dungeon; Plane 0-3 is the actual saved RuneLite plane");
        coordinateHint.setForeground(Color.LIGHT_GRAY);
        coordinateControls.add(coordinateHint);

        north.add(mapControls, BorderLayout.EAST);
        north.add(coordinateControls, BorderLayout.SOUTH);
        add(north, BorderLayout.NORTH);

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          plugin = Path('kspaiofighter/KspAioFighterPlugin.java')
          ptext = plugin.read_text(encoding='utf-8')
          ptext = ptext.replace('static final String version = "1.9.26";', 'static final String version = "1.9.27";')
          plugin.write_text(ptext, encoding='utf-8')

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-aio-map-space-fix.yml
          git add kspaiofighter/KspAioFighterAreaMapDialog.java kspaiofighter/KspAioFighterPlugin.java
          git commit -m 'Separate surface and dungeon map spaces'
          git pull --rebase origin main
          git push origin HEAD:main
