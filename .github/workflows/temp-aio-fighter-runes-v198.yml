name: AioFighterRuneFixV198
on:
  push:
    branches: ['fix/aio-fighter-rune-staff-detection-v198']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ksp
          ref: fix/aio-fighter-rune-staff-detection-v198
          fetch-depth: 0
      - name: Patch rune quantities and equipment sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ksp/kspaiofighter/KspAioFighterScript.java')
          s = p.read_text()

          import_anchor = 'import net.runelite.client.plugins.microbot.util.magic.Runes;\n'
          imports = import_anchor + 'import net.runelite.client.plugins.microbot.util.magic.Rs2Staff;\nimport net.runelite.client.plugins.microbot.util.magic.Rs2Tome;\n'
          if 'import net.runelite.client.plugins.microbot.util.magic.Rs2Staff;' not in s:
              if import_anchor not in s: raise SystemExit('Runes import anchor not found')
              s = s.replace(import_anchor, imports, 1)

          replacements = {
              'Rs2Inventory.count(Runes.NATURE.getItemId())': 'runeQuantity(Runes.NATURE)',
              'Rs2Inventory.count(Runes.FIRE.getItemId())': 'runeQuantity(Runes.FIRE)',
              'Rs2Inventory.count(rune.getItemId())': 'runeQuantity(rune)',
              'Rs2Inventory.count(runeRequirement.getKey().getItemId())': 'runeQuantity(runeRequirement.getKey())',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          old_method = '''\tprivate boolean isRuneCoveredByEquipment(Runes rune)\n\t{\n\t\tString[] staffNames = ELEMENTAL_STAFF_NAMES.get(rune);\n\t\tif (staffNames == null)\n\t\t{\n\t\t\treturn false;\n\t\t}\n\n\t\treturn Rs2Equipment.items().stream()\n\t\t\t\t.map(item -> item.getName().toLowerCase(Locale.ENGLISH))\n\t\t\t\t.anyMatch(equippedName -> Arrays.stream(staffNames).anyMatch(equippedName::contains));\n\t}\n'''
          new_method = '''\tprivate int runeQuantity(Runes rune)\n\t{\n\t\treturn rune == null ? 0 : Rs2Inventory.itemQuantity(rune.getItemId());\n\t}\n\n\tprivate boolean isRuneCoveredByEquipment(Runes rune)\n\t{\n\t\tif (rune == null) return false;\n\n\t\t// Prefer Microbot's canonical item-ID mappings. This avoids staff-name/cache\n\t\t// mismatches and automatically covers combination staves such as Twinflame.\n\t\tfor (Rs2Staff staff : Rs2Staff.values())\n\t\t{\n\t\t\tif (staff != Rs2Staff.NONE && staff.getRunes().contains(rune)\n\t\t\t\t\t&& Rs2Equipment.isWearing(staff.getItemID())) return true;\n\t\t}\n\t\tfor (Rs2Tome tome : Rs2Tome.values())\n\t\t{\n\t\t\tif (tome != Rs2Tome.NONE && tome.getRunes().contains(rune)\n\t\t\t\t\t&& Rs2Equipment.isWearing(tome.getItemID())) return true;\n\t\t}\n\n\t\t// Keep the old name fallback for valid rune sources not yet present in the\n\t\t// Microbot enum (for example Kodai wand in the water list).\n\t\tString[] staffNames = ELEMENTAL_STAFF_NAMES.get(rune);\n\t\treturn staffNames != null && Rs2Equipment.isWearing(staffNames);\n\t}\n'''
          if old_method not in s: raise SystemExit('Old staff detection method not found')
          s = s.replace(old_method, new_method, 1)

          # Guard against the stack-count bug returning in any rune-critical code.
          bad = [
              'Rs2Inventory.count(Runes.NATURE.getItemId())',
              'Rs2Inventory.count(Runes.FIRE.getItemId())',
              'Rs2Inventory.count(rune.getItemId())',
              'Rs2Inventory.count(runeRequirement.getKey().getItemId())',
          ]
          if any(x in s for x in bad): raise SystemExit('A rune count() check remains')
          p.write_text(s)

          plugin = Path('ksp/kspaiofighter/KspAioFighterPlugin.java')
          t = plugin.read_text()
          if 'static final String version = "1.9.7";' not in t: raise SystemExit('Expected AIO Fighter 1.9.7')
          plugin.write_text(t.replace('static final String version = "1.9.7";', 'static final String version = "1.9.8";', 1))
          PY
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile AIO Fighter against Microbot
        shell: bash
        run: |
          set -euo pipefail
          pkg=microbot/client/src/main/java/net/runelite/client/plugins/microbot/kspaiofighter
          mkdir -p "$pkg"
          cp ksp/kspaiofighter/*.java "$pkg/"
          constants=microbot/client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java
          if [ ! -f "$constants" ]; then
            printf '%s\n' 'package net.runelite.client.plugins.microbot;' 'public final class PluginConstants {' '  public static final String KSP = "KSP ";' '  public static final boolean DEFAULT_ENABLED = false;' '  public static final boolean IS_EXTERNAL = true;' '}' > "$constants"
          fi
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd ksp
          rm -f .github/workflows/temp-aio-fighter-runes-v198.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kspaiofighter/KspAioFighterScript.java kspaiofighter/KspAioFighterPlugin.java .github/workflows/temp-aio-fighter-runes-v198.yml
          git commit -m 'fix: use rune stack quantities and canonical staff detection'
          git push origin HEAD:fix/aio-fighter-rune-staff-detection-v198
