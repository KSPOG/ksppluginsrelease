name: Patch Bank Organizer bank opening
on:
  push:
    branches:
      - fix-bank-organizer-bank-opening
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-bank-organizer-bank-opening
      - name: Patch Bank Organizer
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-bank-organizer-bank-opening.yml
          git add kspbankorganizer/BankActuator.java kspbankorganizer/BankOrganizerEngine.java kspbankorganizer/KspBankOrganizerPlugin.java
          git commit -m "Fix Bank Organizer bank opening and diagnostics"
          git push origin HEAD:fix-bank-organizer-bank-opening
