name: Build KSP Seasonal Events

on:
  pull_request:
    paths:
      - 'kspseasonalevents/**'
      - '.github/workflows/seasonal-events-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'kspseasonalevents/**'
      - '.github/workflows/seasonal-events-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seasonal-events-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspSeasonalEventsPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KSP sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Validate full wiki event stages and persistence
        shell: python
        run: |
          from pathlib import Path
          root=Path('release/kspseasonalevents')
          plugin=(root/'KspSeasonalEventsPlugin.java').read_text()
          script=(root/'KspHalloween2026Script.java').read_text()
          panel=(root/'KspSeasonalEventsPanel.java').read_text()
          overlay=(root/'KspSeasonalEventsOverlay.java').read_text()
          event=(root/'KspSeasonalEvent.java').read_text()
          assert 'VERSION = "0.2.10"' in plugin
          assert 'KSP + "Seasonal Events"' in plugin
          assert 'kspwillowchopper' not in plugin and 'kspwillowchopper' not in script
          assert 'HALLOWEEN_2026' in event
          stages = ('INTRODUCTION','SMASH_LANTERNS','REPORT_LANTERNS',
                    'GET_COSTUME','SPOOK_CHILDREN','REPORT_CHILDREN',
                    'CHEMIST_RIDDLE','COOK_SUGAR','COLLECT_ONIONS',
                    'COAT_ONIONS','GIVE_CANDY','FINAL_TALK','WAIT_FOR_REWARD',
                    'COMPLETED','NEEDS_REVIEW')
          for stage in stages:
              assert stage in script, 'Missing Halloween wiki stage: ' + stage
          assert 'getLanternCount()' in script
          assert 'smashedLanternTiles.size() >= 8' in script
          assert 'o.hasActionContaining("Smash")' in script
          assert 'pendingLanternConfirmed' in script
          assert 'spookedChildren' in script and 'npcHasAction(n, "Spook")' in script
          assert 'costumeCount() < 4' in script
          assert 'Rs2Npc.getNpc("Diango")' in script
          assert 'KspHalloweenChemistDialogue.findOptionIndex(options)' in script
          assert 'Rs2Widget.clickWidget(liveOptions.get(optionIndex))' in script
          assert 'Rs2Inventory.useItemOnObject' in script
          assert 'Rs2Inventory.count("Old onion") >= 5' in script
          assert 'Rs2Inventory.combine("Molten sugar", "Old onion")' in script
          assert 'Rs2Inventory.useItemOnNpc' in script
          assert 'adultsGiven >= 5' in script
          assert 'Vampyre costume top' in script
          assert 'configManager.setConfiguration(GROUP, STAGE_KEY' in script
          assert 'configManager.setConfiguration(GROUP, LANTERNS_KEY' in script
          assert 'configManager.setConfiguration(GROUP, ADULTS_KEY' in script
          assert 'public synchronized void resetProgress()' in script
          assert 'new JButton("Start")' in panel
          assert 'new JButton("Pause")' in panel
          assert 'new JButton("Stop")' in panel
          assert 'new JButton("Reset progress")' in panel
          assert 'script.getLanternCount()' in overlay
          assert 'script.isActive()' in overlay
          assert 'script.start(config)' in plugin and 'overlays.remove(overlay)' in plugin
          print('PASS: standalone full wiki stages, progress persistence and guarded completion')

      - name: Verify Halloween lantern reconciliation and chat safety
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspseasonalevents')
          code = (root/'KspHalloween2026Script.java').read_text()
          panel = (root/'KspSeasonalEventsPanel.java').read_text()
          plugin = (root/'KspSeasonalEventsPlugin.java').read_text()

          assert 'VERIFY_LANTERNS' in code
          assert 'pendingLanternConfirmed(WorldPoint player)' in code
          pending = code.split('private boolean pendingLanternConfirmed(WorldPoint player)', 1)[1].split('private void smashLanterns', 1)[0]
          assert 'if (player.distanceTo(pendingLantern) > 9)' in pending
          assert 'nearOrWalk(player, pendingLantern, 6' in pending
          assert 'confirmSmashedLantern(clickedTile' in pending
          assert 'clearPendingLantern()' in pending
          assert 'if (player.distanceTo(pendingLantern) > 12) return true;' not in pending

          search = code.split('private void smashLanterns(WorldPoint player)', 1)[1].split('private void scanRimmington', 1)[0]
          assert 'Stage.VERIFY_LANTERNS' in search
          assert 'sweepsWithoutTarget >= RIMMINGTON_SWEEP.length' in search
          assert 'pendingLanternConfirmed(player)' in search
          assert 'configManager.setConfiguration(GROUP, PENDING_LANTERN_KEY' in search

          assert 'inspectStarterDialogue()' in code
          assert 'KspHalloweenStarterState.classify(raw)' in code
          assert 'confirmAllLanterns(' in code
          assert 'LANTERNS_VERIFIED_KEY' in code
          assert 'parseLanternTile' in code
          assert 'requestStarterStateCheck()' in code
          assert 'canRequestStarterStateCheck()' in code
          assert 'getLanternCount() { return lanternsVerified ? 8' in code
          assert 'configManager.unsetConfiguration(GROUP, PENDING_LANTERN_KEY)' in code
          assert 'configManager.unsetConfiguration(GROUP, LANTERNS_VERIFIED_KEY)' in code
          assert 'ksp_seasonal_stage_changed' in code
          assert 'ksp_seasonal_paused' in code

          assert 'new JButton("Recheck state with Angel / Henja")' in panel
          assert 'script.requestStarterStateCheck()' in panel
          assert 'script.canRequestStarterStateCheck()' in panel
          assert 'JOptionPane' not in panel
          assert 'ChatMessageType.PUBLICCHAT' not in plugin
          assert 'type == ChatMessageType.GAMEMESSAGE' in plugin
          assert 'type == ChatMessageType.SPAM' in plugin
          print('PASS: persisted pending smashes, bounded sweep, verified/explicit recovery and chat filtering')

      - name: Verify hat dialogue, deferred starter transitions and costume handling
        shell: python
        run: |
          from pathlib import Path
          src = Path('release/kspseasonalevents/KspHalloween2026Script.java').read_text()
          tick = src.split('private void tick()', 1)[1].split('private void handleDialogueOption()', 1)[0]
          opts = src.split('private void handleDialogueOption()', 1)[1].split('private boolean nearOrWalk(', 1)[0]
          starter = src.split('private void talkToStarter(', 1)[1].split('private Rs2TileObjectModel lantern()', 1)[0]
          costume = src.split('private void collectCostume(', 1)[1].split('private boolean npcHasAction(', 1)[0]

          assert 'starterConversationActive' in tick
          assert 'inspectStarterDialogue();' in tick
          assert 'pendingStarterDialogueSeen = true;' in tick
          assert 'if (pendingStarterNext == null)' in tick
          assert 'change(next, "Angel / Henja dialogue resolved event state")' in tick
          assert 'Waiting for Angel / Henja dialogue' in tick
          assert 'pendingStarterLastDialogueAt' in tick
          assert 'pendingStarterLastDialogueAt < 1_500L' in tick

          assert "Sure, I'll take the hat." in opts
          assert 'Rs2Dialogue.keyPressForDialogueOption("Sure, I' in opts
          assert 'stage == Stage.REPORT_LANTERNS' in opts
          assert 'stage == Stage.GET_COSTUME' in opts
          assert 'Accepted Halloween hat from Angel / Henja' in opts
          assert 'No thanks, I don' not in opts
          assert 'pendingStarterNext = null;' in starter
          assert 'starterConversationActive = true;' in starter
          assert 'change(' not in starter

          assert costume.index('for (String piece : COSTUME_PIECES)') < costume.index('nearOrWalk(player, DIANGO')
          assert 'Rs2Npc.interact("Diango", "Holiday-items")' in costume
          assert 'Rs2Inventory.wear(piece)' in costume
          print('PASS: explicit accept, no premature transition, equip before travel, holiday retrieval action')

      - name: Verify Diango widget selection, inventory confirmation and safe modal handling
        shell: python
        run: |
          from pathlib import Path
          root=Path('release/kspseasonalevents')
          script=(root/'KspHalloween2026Script.java').read_text()
          widget=(root/'KspDiangoHolidayRetrieval.java').read_text()
          costume=script.split('private void collectCostume(WorldPoint player)',1)[1].split('private boolean npcHasAction(',1)[0]
          dialogue=script.split('private void handleDialogueOption()',1)[1].split('private boolean nearOrWalk(',1)[0]

          assert "Diango's Holiday Item Retrieval" in widget
          assert 'Rs2Widget.findWidget(TITLE, true)' in widget
          assert 'Microbot.getClientThread().runOnClientThreadOptional' in widget
          assert 'Microbot.getClient().getWidgetRoots()' in widget
          assert '(candidate.getId() >>> 16) == interfaceGroup' in widget
          assert 'widget.getItemId()' in widget
          assert 'Microbot.getClient().getItemDefinition(id)' in widget
          assert 'viewport.intersects(bounds)' in widget
          assert 'getScrollY()' in widget and 'getScrollHeight()' in widget
          assert 'Microbot.getMouse().scrollDown(snapshot.scrollPoint)' in widget
          assert 'Microbot.getMouse().click(snapshot.itemBounds)' in widget

          assert "I'd like to check holiday items please!" in dialogue
          assert 'KspDiangoHolidayRetrieval.inspect(missingCostumeRetrievalNames())' in costume
          assert 'pendingHolidayItemAt < 5_000L' in costume
          assert 'Rs2Inventory.hasItem(pendingHolidayItem, true)' in costume
          assert 'holidayRetrievalTimeouts >= 3' in costume
          assert 'KspDiangoHolidayRetrieval.select(window)' in costume
          assert 'KspDiangoHolidayRetrieval.scrollDown(window)' in costume
          assert 'KspDiangoHolidayRetrieval.close(window)' in costume
          assert 'Rs2Keyboard.keyPress(KeyEvent.VK_ESCAPE)' in costume
          assert 'holidayScrollAttempts < 24' in costume
          assert 'Rs2Inventory.getEmptySlots() <= 0' in costume
          assert costume.index('if (window.open) {') < costume.index('if (!nearOrWalk(player, DIANGO')
          assert 'Rs2Npc.interact("Diango", "Holiday-items")' in costume
          assert 'change(Stage.SPOOK_CHILDREN' in costume
          assert 'skeleton boots' in script and 'skeleton shirt' in script
          assert 'Diango has no additional suitable wearable costume pieces' in costume
          print('PASS: Diango live widgets, restricted item selection, receipt verification and bounded recovery')

      - name: Verify Diango stays open until four distinct costume slots are held
        shell: python
        run: |
          from pathlib import Path
          code = Path('release/kspseasonalevents/KspHalloween2026Script.java').read_text()
          batch = code.split('private void collectCostume(WorldPoint player)', 1)[1].split('private List<String> missingCostumeRetrievalNames()', 1)[0]
          missing = code.split('private List<String> missingCostumeRetrievalNames()', 1)[1].split('private void closeHolidayRetrieval(', 1)[0]
          slot = code.split('private CostumeSlot costumeSlot(', 1)[1].split('private Set<CostumeSlot> heldCostumeSlots(', 1)[0]
          held = code.split('private Set<CostumeSlot> heldCostumeSlots(', 1)[1].split('private int costumeCount()', 1)[0]
          assert 'enum CostumeSlot { HEAD, BODY, LEGS, HANDS, FEET }' in code
          for group in ('boots', 'gloves', 'leggings', 'trousers', 'bottoms', 'skirt', 'shirt', 'top', 'robe', 'jumper', 'mask', 'hood', 'wig', 'hat'):
              assert group in slot, 'Missing costume slot classification: ' + group
          assert 'EnumSet.noneOf(CostumeSlot.class)' in held
          assert 'includeInventory && Rs2Inventory.hasItem(piece, true)' in held
          assert 'Rs2Equipment.isWearing(piece, true)' in held

          pending = batch.index('if (pendingHolidayItem != null)')
          full_batch = batch.index('if (ownedSlots.size() >= 4)')
          close = batch.index('closeHolidayRetrieval(window)', full_batch)
          wear = batch.index('Rs2Inventory.wear(piece)', full_batch)
          partial_batch = batch.index('if (window.open)', wear)
          next_retrieval = batch.index('KspDiangoHolidayRetrieval.select(window)', partial_batch)
          reopen = batch.index('Rs2Npc.interact("Diango", "Holiday-items")', next_retrieval)
          assert pending < full_batch < close < wear < partial_batch < next_retrieval < reopen
          assert 'Set<CostumeSlot> ownedSlots = heldCostumeSlots(true)' in batch
          assert 'Set<CostumeSlot> wornSlots = heldCostumeSlots(false)' in batch
          assert 'wornSlots.contains(slot)' in batch
          assert 'pendingHolidayItem = window.itemName;' in batch
          assert 'Rs2Inventory.hasItem(pendingHolidayItem, true)' in batch
          assert 'holidayRetrievalTimeouts >= 3' in batch
          assert 'holidayScrollAttempts < 24' in batch
          assert 'KspDiangoHolidayRetrieval.scrollDown(window)' in batch
          assert 'ownedSlots.contains(slot)' in missing
          assert 'DIANGO_COSTUME_PRIORITY.stream()' in missing
          assert 'closeHolidayRetrieval(window)' not in batch[partial_batch:reopen]
          print('PASS: four distinct slots must be owned before any automatic window closing/equipping')

      - name: Test Angel/Henja event-state classification with actual 2026 dialogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-starter-test
          javac -d /tmp/ksp-halloween-starter-test \
            release/kspseasonalevents/KspHalloweenStarterState.java \
            release/.github/tests/seasonal/KspHalloweenStarterStateTest.java
          java -cp /tmp/ksp-halloween-starter-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenStarterStateTest

      - name: Verify Angel/Henja dialogue is authoritative for global event state
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspseasonalevents')
          code = (root/'KspHalloween2026Script.java').read_text()
          parser = (root/'KspHalloweenStarterState.java').read_text()
          panel = (root/'KspSeasonalEventsPanel.java').read_text()

          start = code.split('public synchronized boolean start(',1)[1].split('private void restoreNpcIds(',1)[0]
          tick = code.split('private void tick()',1)[1].split('private void handleDialogueOption()',1)[0]
          inspect = code.split('private void inspectStarterDialogue()',1)[1].split('private Stage stageForAdultCandyObjective()',1)[0]
          talk = code.split('private void talkToStarter(WorldPoint player)',1)[1].split('private Rs2TileObjectModel lantern()',1)[0]
          search = code.split('private void smashLanterns(WorldPoint player)',1)[1].split('private void scanRimmington',1)[0]
          chat = code.split('public void onChatMessage(String raw)',1)[1].split('public void setPaused(',1)[0]

          assert 'change(Stage.INTRODUCTION' in start
          assert 'saved stage {} deferred to starter dialogue' in start
          assert 'starterConversationActive' in tick
          assert 'inspectStarterDialogue();' in tick
          assert 'if (pendingStarterNext == null)' in tick
          assert 'Angel/Henja dialogue did not identify a known Halloween objective' in tick
          assert 'talkToStarter(player);' in tick
          assert 'talkToStarter(player,' not in code

          assert 'KspHalloweenStarterState.classify(raw)' in inspect
          for objective in ('SMASH_LANTERNS','SCARE_CHILDREN','ADULT_CANDY','CLAIM_REWARD','COMPLETE'):
              assert 'case ' + objective + ':' in inspect
              assert objective in parser
          assert 'resolved = costumeCount() >= 4 ? Stage.SPOOK_CHILDREN : Stage.GET_COSTUME' in inspect
          assert 'resolved = stageForAdultCandyObjective();' in inspect
          assert 'childrenReportConfirmed = true;' in inspect
          assert 'configManager.setConfiguration(GROUP, CHILD_CONFIRMED_KEY, true)' in inspect
          assert 'lanternsVerified = false;' in inspect
          assert 'configManager.unsetConfiguration(GROUP, LANTERNS_VERIFIED_KEY)' in inspect
          assert 'adultsGiven >= 5' in inspect
          assert 'givenAdultIds.clear();' in inspect
          assert 'resolved = Stage.WAIT_FOR_REWARD;' in inspect
          assert 'resolved = Stage.COMPLETED;' in inspect

          assert 'pendingStarterNext = null;' in talk
          assert 'starterConversationActive = true;' in talk
          assert 'Speaking to Angel / Henja to resolve current event state' in talk

          assert 'lanternsVerified || smashedLanternTiles.size() >= 8' not in search
          assert 'Eight local smash acknowledgements; verifying with Angel/Henja' in chat
          assert 'confirmAllLanterns("eight confirmed smashes")' not in chat

          assert 'confirmLanternsManually' not in code
          assert 'canConfirmLanternsManually' not in code
          assert 'requestStarterStateCheck()' in code
          assert 'Recheck state with Angel / Henja' in panel
          assert 'KspHalloweenChildReport' not in code
          print('PASS: Angel/Henja dialogue owns global state; local counters only drive subtask execution')

      - name: Verify child scare counters appear in overlay and side panel
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspseasonalevents')
          script = (root/'KspHalloween2026Script.java').read_text()
          overlay = (root/'KspSeasonalEventsOverlay.java').read_text()
          panel = (root/'KspSeasonalEventsPanel.java').read_text()
          assert 'getChildSpookAttempts()' in script
          assert 'getChildSpookCheckpoint()' in script
          assert 'isChildObjectiveConfirmed()' in script
          assert 'ConcurrentHashMap.newKeySet()' in script
          assert 'private volatile boolean childrenReportConfirmed;' in script
          assert 'CHILD_CONFIRMED_KEY' in script
          assert 'configManager.setConfiguration(GROUP, CHILD_CONFIRMED_KEY, true)' in script
          assert 'configManager.unsetConfiguration(GROUP, CHILD_CONFIRMED_KEY)' in script
          assert 'Boolean.parseBoolean(' in script
          for source in (overlay, panel):
              assert 'getChildSpookAttempts()' in source
              assert 'getChildSpookCheckpoint()' in source
              assert 'isChildObjectiveConfirmed()' in source
          assert 'Child Spook attempts' in overlay
          assert 'Child objective' in overlay
          assert 'Child Spook attempts' in panel
          assert 'Not verified' in overlay and 'Confirmed' in overlay
          assert 'Not verified' in panel and 'Confirmed' in panel
          print('PASS: child Spook attempts and separate confirmed quest objective in both UIs')

      - name: Verify scene-guided child search and one-batch client thread classification
        shell: python
        run: |
          from pathlib import Path
          code = Path('release/kspseasonalevents/KspHalloween2026Script.java').read_text()
          age = code.split('private void observeTreaterAges()', 1)[1].split('private TreaterAge classifyTreater(', 1)[0]
          scout = code.split('private boolean scoutVisibleTreaters(', 1)[1].split('private void spookChildren(', 1)[0]
          child = code.split('private void spookChildren(', 1)[1].split('private void solveChemist(', 1)[0]
          report = code.split('private void inspectStarterDialogue()', 1)[1].split('private Stage stageForAdultCandyObjective()', 1)[0]
          change = code.split('private void change(Stage next, String message)', 1)[1].split('private void stopForReview(', 1)[0]

          assert 'if (confirmedChildGroup != TreaterGroup.UNKNOWN) return;' in age
          assert age.index('if (confirmedChildGroup != TreaterGroup.UNKNOWN) return;') < age.index('Rs2Npc.getNpcs()')
          assert age.count('runOnClientThreadOptional(') == 1
          assert 'n::getLogicalHeight' not in age
          assert 'candidate.getLogicalHeight()' in age
          assert 'observedTreaterHeights.putAll(heights)' in age

          assert 'MAX_CHILD_NPC_SCOUT_STOPS = 4' in code
          assert 'CHILD_SCENE_SETTLE_MS = 2_000L' in code
          assert 'childScoutedNpcTiles' in scout
          assert 'classifyTreater(anchor)' in scout
          assert 'age == TreaterAge.ADULT' in scout
          assert 'age == TreaterAge.CHILD' in scout
          assert 'RIMMINGTON.contains(n.getWorldLocation())' in scout
          assert 'nearOrWalk(player, target, 6,' in scout
          assert 'RIMMINGTON_SWEEP' not in scout
          assert 'Rs2Npc.interact(' not in scout

          assert 'Rs2Npc.getNpcs()' in child
          assert 'classifyTreater(n) == TreaterAge.CHILD' in child
          assert '!spookedChildren.contains(n.getId())' in child
          assert 'npcHasAction(n, "Spook")' in child
          assert 'Rs2Npc.interact(child, "Spook")' in child
          assert 'CHILD_SCENE_SETTLE_MS' in child
          assert 'scoutVisibleTreaters(player, visibleTreaters)' in child
          assert 'scanRimmington(' not in child
          assert 'change(Stage.REPORT_CHILDREN' in child
          assert 'visibleTreaters=[' in child

          assert 'stage == Stage.REPORT_CHILDREN && resolved == Stage.SPOOK_CHILDREN' in report
          assert 'childSpookRetries > allowedRetries' in report
          assert 'spookedChildren.size() >= CHILD_REPORT_CHECKPOINT' in report
          assert 'if (next == Stage.SPOOK_CHILDREN)' in change
          assert 'childScoutedNpcTiles.clear();' in change
          print('PASS: no fixed children waypoints, no adult Spook, bounded NPC-guided scout, one-batch age reads')

      - name: Test wiki-confirmed Chemist dialogue routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-chemist-test
          javac -d /tmp/ksp-halloween-chemist-test \
            release/kspseasonalevents/KspHalloweenChemistDialogue.java \
            release/.github/tests/seasonal/KspHalloweenChemistDialogueTest.java
          java -cp /tmp/ksp-halloween-chemist-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenChemistDialogueTest

      - name: Test Chemist free-text riddle prompt and fast dialogue safeguards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-chemist-input-test
          javac -d /tmp/ksp-halloween-chemist-input-test \
            release/kspseasonalevents/KspHalloweenChemistInput.java \
            release/.github/tests/seasonal/KspHalloweenChemistInputTest.java
          java -cp /tmp/ksp-halloween-chemist-input-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenChemistInputTest
          python - <<'PY'
          from pathlib import Path
          code=Path('release/kspseasonalevents/KspHalloween2026Script.java').read_text()
          tick=code.split('private void tick()',1)[1].split('private void handleDialogueOption()',1)[0]
          input_handler=code.split('private boolean handleChemistAnswerPrompt()',1)[1].split('private static boolean isVisible(',1)[0]
          assert 'stage == Stage.CHEMIST_RIDDLE && handleChemistAnswerPrompt()' in tick
          assert tick.index('handleChemistAnswerPrompt()') < tick.index('Rs2Dialogue.hasContinue()')
          assert 'WidgetInfo.CHATBOX_FULL_INPUT' in code
          assert 'WidgetInfo.CHATBOX_INPUT' in code
          assert 'Rs2Keyboard.typeString("92")' in input_handler
          assert 'Rs2Keyboard.enter()' in input_handler
          assert 'chemistAnswerSubmissions >= 1' in input_handler
          assert 'Rs2Dialogue.hasContinue() || Rs2Dialogue.hasSelectAnOption()' in input_handler
          assert 'this::safeTick, 0L, 300L' in code
          assert 'DIALOGUE_GAP_MS = 320L' in code
          assert 'ACTION_GAP = 900L' in code
          print('PASS: Chemist free-text handling prioritized and dialogue paced safely')
          PY

      - name: Install Seasonal Events sources into Microbot Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspseasonalevents"
          cp -R release/kspseasonalevents "$ROOT/kspseasonalevents"

      - name: Compile and package Seasonal Events
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspSeasonalEventsPlugin --stacktrace --no-daemon

      - name: Verify compiled seasonal plugin
        shell: bash
        run: |
          ls -lh hub/build/libs
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspSeasonalEventsPlugin-*.jar' -print -quit)"

      - name: Upload Seasonal Events JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspSeasonalEventsPlugin-${{ github.sha }}
          path: hub/build/libs/KspSeasonalEventsPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
