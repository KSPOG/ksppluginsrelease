name: Build KSP Seasonal Events

on:
  pull_request:
    paths:
      - 'kspseasonalevents/**'
      - '.github/workflows/seasonal-events-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'kspseasonalevents/**'
      - '.github/workflows/seasonal-events-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seasonal-events-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspSeasonalEventsPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KSP sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Validate wiki event stages, identity and game-state progress
        shell: python
        run: |
          from pathlib import Path
          root=Path('release/kspseasonalevents')
          plugin=(root/'KspSeasonalEventsPlugin.java').read_text()
          script=(root/'KspHalloween2026Script.java').read_text()
          progress=(root/'KspHalloweenProgress.java').read_text()
          panel=(root/'KspSeasonalEventsPanel.java').read_text()
          overlay=(root/'KspSeasonalEventsOverlay.java').read_text()
          event=(root/'KspSeasonalEvent.java').read_text()
          assert 'VERSION = "0.2.18"' in plugin
          assert 'KSP + "Seasonal Events"' in plugin
          assert 'authors = {"KSP"}' in plugin
          assert 'kspwillowchopper' not in plugin and 'kspwillowchopper' not in script
          assert 'HALLOWEEN("Halloween")' in event
          assert 'HALLOWEEN_2026(' not in event
          assert '"HALLOWEEN_2026".equals(configManager.getConfiguration(' in plugin
          assert 'config.event() != KspSeasonalEvent.HALLOWEEN' in plugin
          stages = ('INTRODUCTION','SMASH_LANTERNS','REPORT_LANTERNS',
                    'GET_COSTUME','SPOOK_CHILDREN','REPORT_CHILDREN',
                    'CHEMIST_RIDDLE','COOK_SUGAR','COLLECT_ONIONS',
                    'COAT_ONIONS','GIVE_CANDY','FINAL_TALK','WAIT_FOR_REWARD',
                    'COMPLETED','NEEDS_REVIEW')
          for stage in stages:
              assert stage in script, 'Missing Halloween wiki stage: ' + stage
          # The event's own varbits are read every loop and decide what is done.
          assert 'static final int MAIN = 16579;' in progress
          assert 'LANTERN_BITS = {16583, 16584, 16585, 16610, 16611, 16612, 16613, 16614}' in progress
          assert 'CHILD_BITS = {16615, 16618, 16625, 16626, 16627}' in progress
          assert 'ADULT_BITS = {16628, 16636, 16637, 16638, 16645}' in progress
          tick=script.split('private void tick()',1)[1].split('private static boolean isCandyStage(',1)[0]
          assert 'progress = KspHalloweenProgress.read(Microbot::getVarbitValue);' in tick
          assert 'progress.advance(stage)' in tick
          # Local stand-ins for game state are deleted on start, never written.
          for key in ('halloweenSmashTiles','halloweenAdultsGiven','halloweenChildNpcIdsConfirmed',
                      'halloweenAdultNpcIdsDelivered','halloweenChildObjectiveConfirmed'):
              assert key in script, 'obsolete key must still be cleaned up: ' + key
          assert 'for (String key : OBSOLETE_KEYS) configManager.unsetConfiguration(GROUP, key);' in script
          assert 'spookedChildren' not in script and 'givenAdultIds' not in script
          assert 'Rs2Npc.' not in script and 'import net.runelite.client.plugins.microbot.util.npc.Rs2Npc;' not in script
          assert 'WidgetInfo' not in script
          assert 'EVENT_COMPLETE_WIDGET_ID' in script
          assert 'equalsIgnoreCase("Event complete!")' in script
          assert 'public synchronized void resetProgress()' in script
          assert 'new JButton("Start")' in panel and 'new JButton("Reset progress")' in panel
          assert 'script.getLanternCount()' in overlay and 'script.isActive()' in overlay
          assert 'script.start(config)' in plugin and 'overlays.remove(overlay)' in plugin
          assert 'script.setCompletionCallback(' in plugin
          print('PASS: wiki stages, KSP identity, varbit-driven progress and no local stand-ins')

      - name: Verify costume, Chemist input, pacing and bounded waits
        shell: python
        run: |
          from pathlib import Path
          root=Path('release/kspseasonalevents')
          script=(root/'KspHalloween2026Script.java').read_text()
          diango=(root/'KspDiangoHolidayRetrieval.java').read_text()
          costume=(root/'KspHalloweenCostume.java').read_text()
          chemist=(root/'KspHalloweenChemistInput.java').read_text()
          # Only Diango's own list (78:3) is read and scrolled, never the chat box.
          assert 'InterfaceID.RareitemsDiango.ITEMS' in diango
          assert 'getWidgetRoots()' not in diango
          assert 'new Outfit("Skeleton", 9925, 9924, 9923, 9922, 9921)' in costume
          assert 'KspHalloweenCostume.anyWorn(Rs2Equipment::isWearing)' in script
          assert 'COSTUME_CLICK_SETTLE_MS' in script and 'MAX_COSTUME_CLICK_TRIES' in script
          # The Chemist's answer box comes from the game's input mode, typed once.
          assert 'VarClientID.MESLAYERMODE' in script
          assert 'MODE_PRIVATE_MESSAGE = 6' in chemist and 'MODE_SEARCH = 11' in chemist
          assert 'Rs2Keyboard.typeString("92")' in script and 'chemistAnswerSubmissions >= 1' in script
          # Human pacing before clicks, and Pause/Stop during a pause skips the click.
          assert 'private boolean react()' in script and 'if (!react()) return' in script
          assert 'private boolean readPage(String text)' in script
          # Walking is not a failed click; the reward wait is bounded.
          assert 'Rs2Player.isMoving() || System.currentTimeMillis() - pendingOldOnionAt' in script
          assert 'REWARD_SCROLL_WAIT_MS' in script and 'MAX_REWARD_TALKS' in script
          assert 'this::safeTick, 0L, 150L' in script
          print('PASS: full outfit from Diango\'s list, Chemist input mode, pacing and bounded waits')

      - name: Test Angel/Henja event-state classification with actual 2026 dialogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-starter-test
          javac -d /tmp/ksp-halloween-starter-test \
            release/kspseasonalevents/KspHalloweenStarterState.java \
            release/.github/tests/seasonal/KspHalloweenStarterStateTest.java
          java -cp /tmp/ksp-halloween-starter-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenStarterStateTest

      - name: Test wiki-confirmed Chemist dialogue routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-chemist-test
          javac -d /tmp/ksp-halloween-chemist-test \
            release/kspseasonalevents/KspHalloweenChemistDialogue.java \
            release/.github/tests/seasonal/KspHalloweenChemistDialogueTest.java
          java -cp /tmp/ksp-halloween-chemist-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenChemistDialogueTest

      - name: Test Chemist free-text riddle prompt and fast dialogue safeguards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-halloween-chemist-input-test
          javac -d /tmp/ksp-halloween-chemist-input-test \
            release/kspseasonalevents/KspHalloweenChemistInput.java \
            release/.github/tests/seasonal/KspHalloweenChemistInputTest.java
          java -cp /tmp/ksp-halloween-chemist-input-test \
            net.runelite.client.plugins.microbot.kspseasonalevents.KspHalloweenChemistInputTest

      - name: Install Seasonal Events sources into Microbot Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspseasonalevents"
          cp -R release/kspseasonalevents "$ROOT/kspseasonalevents"

      - name: Run Seasonal Events unit tests in Microbot Hub
        shell: bash
        working-directory: hub
        run: |
          set -euo pipefail
          TESTS='src/test/java/net/runelite/client/plugins/microbot/kspseasonalevents'
          mkdir -p "$TESTS"
          for f in $(grep -l 'org.junit.jupiter' ../release/.github/tests/seasonal/*.java); do cp "$f" "$TESTS/"; done
          chmod +x gradlew
          ./gradlew test -PpluginList=KspSeasonalEventsPlugin --tests 'net.runelite.client.plugins.microbot.kspseasonalevents.*' --stacktrace --no-daemon

      - name: Compile and package Seasonal Events
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspSeasonalEventsPlugin --stacktrace --no-daemon

      - name: Verify compiled seasonal plugin
        shell: bash
        run: |
          ls -lh hub/build/libs
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspSeasonalEventsPlugin-*.jar' -print -quit)"

      - name: Upload Seasonal Events JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspSeasonalEventsPlugin-${{ github.sha }}
          path: hub/build/libs/KspSeasonalEventsPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
