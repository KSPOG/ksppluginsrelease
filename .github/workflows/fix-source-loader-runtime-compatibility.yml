name: Fix source-loader runtime compatibility

on:
  push:
    branches:
      - fix-source-loader-runtime-compatibility

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-compat-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply runtime compatibility patch
        run: python .github/scripts/fix_source_loader_runtime_compatibility.py

      - name: Commit runtime compatibility patch
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore source-loader runtime compatibility [runtime-compat-fixed]"
          git push
