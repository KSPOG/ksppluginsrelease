name: Build KSP Smart Superheat

on:
  pull_request:
    paths:
      - 'kspsmartsuperheat/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/workflows/smart-superheat-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'kspsmartsuperheat/**'
      - 'kspsupport/**'
      - 'kspmule/**'
      - 'kspbank/**'
      - '.github/workflows/smart-superheat-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-superheat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspSmartSuperheatPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KSP plugins
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Validate GE-only interaction and movement policy
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspsmartsuperheat')
          script = (root / 'KspSmartSuperheatScript.java').read_text()
          access = (root / 'KspSmartSuperheatGeAccess.java').read_text()
          assert 'KspVerifiedBank.openBank()' not in script
          assert 'Rs2GrandExchange.openExchange()' not in script
          assert 'Rs2Bank.walkToBank' not in script
          assert 'Rs2Walker.walkTo(' not in script
          assert 'isInGrandExchange(player)' in script
          assert 'Rs2GrandExchange.walkToGrandExchange()' in script, 'Out-of-GE approach must use canonical GE route'
          assert 'BankLocation.GRAND_EXCHANGE.getWorldPoint()' in script, 'Must use Microbot GE bank destination'
          assert 'geWalkOwned' in script and 'ksp_smart_superheat_ge_arrived' in script, 'Arrival route cancellation missing'
          assert 'isExpectedActor(npcName, clerkOnly)' in access, 'Strict banker/clerk name check missing'
          assert '"Banker".equalsIgnoreCase' in access, 'Banking must only target Banker NPC'
          assert '"Grand Exchange Clerk".equalsIgnoreCase' in access, 'Exchange must only target GE Clerk'
          assert 'KspSmartSuperheatPlugin.VERSION' in (Path('release/kspsmartsuperheat') / 'KspSmartSuperheatPlugin.java').read_text()
          assert 'Rs2Walker.clearWalkingRoute(' in script
          assert 'openLocalBank()' in script and 'openLocalExchange()' in script
          assert 'isAllowedActor(player.getWorldLocation(), npc.getWorldLocation())' in access
          assert 'Rs2GameObject.interact(' not in access
          assert 'Rs2Npc.interact(' not in access
          assert 'Rs2Walker.walkTo(' not in access
          assert 'MIN_X = 3153' in access and 'MAX_Y = 3502' in access
          mule = Path('release/kspmule/KspMuleWorkerService.java').read_text()
          plugin = (root / 'KspSmartSuperheatPlugin.java').read_text()
          assert 'KspSmartSuperheatGeAccess::openLocalBank' in plugin, 'Mule must use GE-local Banker'
          assert 'KspSmartSuperheatGeAccess::isInGrandExchange' in plugin, 'Mule requires GE-only movement fence'
          assert 'if (!openBankForMule())' in mule, 'Mule bank fallback is not owner-aware'
          assert 'allowedArea != null && muleTile != null && !allowedArea.test(muleTile)' in mule, 'Mule can leave GE'
          legacy_bank = Path('release/kspbank/KspVerifiedBank.java').read_text()
          assert 'Rs2GameObject' not in legacy_bank, 'Shared bank dependency uses retired API'
          print('PASS: canonical GE arrival, Banker-only banking and mule fence; no remote bank-booth paths')

      - name: Install Smart Superheat plus shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          for pkg in kspsmartsuperheat kspsupport kspmule kspbank; do
            rm -rf "$ROOT/$pkg"
            cp -R "release/$pkg" "$ROOT/$pkg"
          done

      - name: Include shared KSP Java sources in Superheat build
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = needle + '''
                    if (plugin.name == "KspSmartSuperheatPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                        include "${project.ext.getPluginsIncludePath()}/kspmule/**"
                        include "${project.ext.getPluginsIncludePath()}/kspbank/**"
                    }'''
          if needle not in text:
              raise SystemExit('Microbot-Hub source include rule changed')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Build KSP Smart Superheat
        working-directory: hub
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpluginList=KspSmartSuperheatPlugin --stacktrace --no-daemon

      - name: Check output JAR
        shell: bash
        run: |
          ls -lh hub/build/libs
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspSmartSuperheatPlugin-*.jar' -print -quit)"

      - name: Upload Smart Superheat JAR
        uses: actions/upload-artifact@v4
        with:
          name: KspSmartSuperheatPlugin-${{ github.sha }}
          path: hub/build/libs/KspSmartSuperheatPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
