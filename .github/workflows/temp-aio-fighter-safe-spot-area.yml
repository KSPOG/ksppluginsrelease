name: Temporary AIO Fighter Safe Spot Area Fix

on:
  push:
    branches:
      - fix/aio-fighter-loot-outside-area

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aio-fighter-loot-outside-area
          fetch-depth: 0

      - name: Keep safe spot inside configured attack area
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('kspaiofighter/KspAioFighterScript.java')
          text = script.read_text()

          old = '''\t\tWorldPoint safeSpot = getSafeSpot();\n\t\tif (!isConfiguredTileValid(safeSpot))\n\t\t{\n\t\t\tsetStatus("set safe spot tile");\n\t\t\treturn true;\n\t\t}\n\n\t\tWorldPoint playerLocation = Rs2Player.getWorldLocation();\n'''
          new = '''\t\tWorldPoint safeSpot = getSafeSpot();\n\t\tif (!isConfiguredTileValid(safeSpot))\n\t\t{\n\t\t\tsetStatus("set safe spot tile");\n\t\t\treturn true;\n\t\t}\n\n\t\t// The attack area is the hard movement boundary. Safe-spot mode may choose the\n\t\t// standing tile, but it must never pull the player back outside the configured\n\t\t// rectangle after an out-of-area loot pickup. Clamp an external safe spot to the\n\t\t// nearest tile inside the attack area instead.\n\t\tif (config.useAttackArea() && hasCompleteAttackArea() && !isInsideConfiguredArea(safeSpot))\n\t\t{\n\t\t\tsafeSpot = getNearestPointInsideConfiguredArea(safeSpot);\n\t\t}\n\n\t\tWorldPoint playerLocation = Rs2Player.getWorldLocation();\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected safe-spot anchor block once, found {text.count(old)}')
          script.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaiofighter/KspAioFighterScript.java
          git commit -m "Keep AIO Fighter safe spot inside attack area"
          git push origin HEAD:fix/aio-fighter-loot-outside-area

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-aio-fighter-safe-spot-area.yml
          git commit -m "Remove temporary AIO Fighter safe-spot workflow"
          git push origin HEAD:fix/aio-fighter-loot-outside-area
