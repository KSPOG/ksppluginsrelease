name: Validate High Alch Trader v0.2.8

on:
  push:
    branches:
      - fix/high-alch-bulk-price-cache

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-alch-bulk-price-cache

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot

      - name: Compile High Alch Trader against Microbot
        shell: bash
        run: |
          rm -rf microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspf2phighalchtrader
          cp -R kspf2phighalchtrader microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspf2phighalchtrader
          cat > microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "KSP ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
              private PluginConstants() {}
          }
          EOF
          cd microbot
          chmod +x gradlew
          ./gradlew :client:compileJava --no-daemon

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/temp-high-alch-v028.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-high-alch-v028.yml
          git commit -m "Remove temporary High Alch Trader validation"
          git push origin HEAD:fix/high-alch-bulk-price-cache
