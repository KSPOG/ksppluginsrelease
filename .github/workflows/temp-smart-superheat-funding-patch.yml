name: Temporary Smart Superheat Funding Patch

on:
  push:
    branches:
      - fix/smart-superheat-funding-v0012

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Smart Superheat funding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          script = Path('kspsmartsuperheat/KspSmartSuperheatScript.java')
          text = script.read_text()
          pattern = re.compile(r'    private boolean ensureCoinsInInventory\(int required\)\n    \{.*?\n    \}\n\n    private int calculateAffordableRestockBars', re.S)
          replacement = base64.b64decode('').decode()
          patched, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one ensureCoinsInInventory replacement, got {count}')
          script.write_text(patched)

          plugin = Path('kspsmartsuperheat/KspSmartSuperheatPlugin.java')
          ptext = plugin.read_text()
          old = 'public static final String VERSION = "0.0.11";'
          new = 'public static final String VERSION = "0.0.12";'
          if old not in ptext:
              raise SystemExit('Expected v0.0.11 version marker not found')
          plugin.write_text(ptext.replace(old, new, 1))

          Path('.github/workflows/temp-smart-superheat-funding-patch.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Smart Superheat restock coin funding loop"
          git push origin HEAD:fix/smart-superheat-funding-v0012
