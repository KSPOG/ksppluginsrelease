name: Harden verified bank targets

on:
  push:
    branches:
      - harden-verified-bank-targets

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[verified-bank-targets-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified bank target patch
        run: python .github/scripts/harden_verified_bank_targets.py
      - name: Commit verified bank target changes
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: require verified bank targets across KSP plugins [verified-bank-targets-done]"
          git push
