name: Temporary Account Builder fix validation

on:
  push:
    branches:
      - fix/account-builder-playtime-smelting-latency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-builder-playtime-smelting-latency
          fetch-depth: 0
      - name: Parse all Java sources
        shell: bash
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-java
          python3 <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_java
          parser = Parser(Language(tree_sitter_java.language()))
          failures = []
          files = sorted(Path(".").rglob("*.java"))
          for path in files:
              tree = parser.parse(path.read_bytes())
              if tree.root_node.has_error:
                  failures.append(str(path))
          print(f"Parsed Java files: {len(files)}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
      - name: Validate key regressions
        shell: bash
        run: |
          grep -q 'import java.util.Comparator;' KSPGELooter/KSPGELooterScript.java
          ! grep -q 'TradeUnlock.readPlayTime' kspaccountbuilder/tasks/skilling/selling/sellscript/SellScript.java
          grep -q 'PLAY_TIME_READ_RETRY_MS = TimeUnit.SECONDS.toMillis(1)' kspaccountbuilder/KspAccountBuilderScript.java
          grep -q '0L, LOOP_DELAY_MS, TimeUnit.MILLISECONDS' kspaccountbuilder/tasks/skilling/smelting/smeltscript/SmeltScript.java
          ! grep -q 'sleepUntilHasWidgetText.*What would you like to smelt' kspaccountbuilder/tasks/skilling/smelting/smeltscript/SmeltScript.java
      - name: Whitespace validation
        run: git diff --check origin/main...HEAD
