name: Temporary Kebab Buyer Compile

on:
  push:
    branches:
      - fix/kebab-karim-interaction-state

concurrency:
  group: kebab-karim-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KSP source
        uses: actions/checkout@v4
        with:
          path: release
      - name: Checkout Microbot
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: microbot
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Copy Kebab Buyer sources
        run: |
          mkdir -p microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspkebabbuyer
          cp release/kspkebabbuyer/*.java microbot/runelite-client/src/main/java/net/runelite/client/plugins/microbot/kspkebabbuyer/
      - name: Compile client
        working-directory: microbot
        run: ./gradlew :client:compileJava --no-daemon
