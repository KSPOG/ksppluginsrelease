name: Adjust Jewelry GE Price Delay

on:
  push:
    branches:
      - fix/jewelry-client-thread-ge
    paths:
      - .github/workflows/adjust-jewelry-ge-price-delay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jewelry-client-thread-ge

      - name: Add deliberate GE price click pacing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          text = path.read_text(encoding='utf-8')

          old_constants = '''    private static final int GE_SEARCH_PROMPT_CHILD = 52;\n    private static final long TARGET_INTERACTION_TIMEOUT_MS = 8_000L;'''
          new_constants = '''    private static final int GE_SEARCH_PROMPT_CHILD = 52;\n    private static final int GE_PRICE_CLICK_DELAY_MIN_MS = 650;\n    private static final int GE_PRICE_CLICK_DELAY_MAX_MS = 950;\n    private static final long TARGET_INTERACTION_TIMEOUT_MS = 8_000L;'''
          if text.count(old_constants) != 1:
              raise SystemExit('Expected GE constant insertion point exactly once')
          text = text.replace(old_constants, new_constants, 1)

          old_set = '''        status = "Setting GE " + label + ": " + value;\n        if (!clickGeSetupChildSafely(child)) return false;'''
          new_set = '''        status = "Setting GE " + label + ": " + value;\n        if (child == GE_PRICE_X_CHILD)\n            sleep(GE_PRICE_CLICK_DELAY_MIN_MS, GE_PRICE_CLICK_DELAY_MAX_MS);\n        if (!clickGeSetupChildSafely(child)) return false;'''
          if text.count(old_set) != 1:
              raise SystemExit('Expected setGeOfferValue price click point exactly once')
          text = text.replace(old_set, new_set, 1)

          old_modify = '''        if (!clickGeSetupChildSafely(GE_PRICE_X_CHILD))\n        {\n            status = "Unable to open GE price input";'''
          new_modify = '''        sleep(GE_PRICE_CLICK_DELAY_MIN_MS, GE_PRICE_CLICK_DELAY_MAX_MS);\n        if (!clickGeSetupChildSafely(GE_PRICE_X_CHILD))\n        {\n            status = "Unable to open GE price input";'''
          if text.count(old_modify) != 1:
              raise SystemExit('Expected modify-offer price click point exactly once')
          text = text.replace(old_modify, new_modify, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify price pacing
        shell: bash
        run: |
          grep -n "GE_PRICE_CLICK_DELAY_MIN_MS\|GE_PRICE_CLICK_DELAY_MAX_MS" kspjewelrycrafter/KspJewelryCrafterScript.java
          test "$(grep -c 'sleep(GE_PRICE_CLICK_DELAY_MIN_MS, GE_PRICE_CLICK_DELAY_MAX_MS)' kspjewelrycrafter/KspJewelryCrafterScript.java)" -eq 2

      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/adjust-jewelry-ge-price-delay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspjewelrycrafter/KspJewelryCrafterScript.java .github/workflows/adjust-jewelry-ge-price-delay.yml
          git commit -m "Slow Jewelry Crafter GE price button interaction"
          git push origin HEAD:fix/jewelry-client-thread-ge
