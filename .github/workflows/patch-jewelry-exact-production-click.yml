name: Patch Jewelry Crafter exact production selection
on:
  push:
    branches: [fix-jewelry-output-input-confusion]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-jewelry-output-input-confusion
      - name: Require exact production widget match
        shell: python
        run: |
          from pathlib import Path
          p = Path('kspjewelrycrafter/KspJewelryCrafterScript.java')
          s = p.read_text(encoding='utf-8')
          old = '        if (!Rs2Widget.clickWidget(widgetName))\n'
          new = '        if (!Rs2Widget.clickWidget(widgetName, true))\n'
          if s.count(old) != 1:
              raise SystemExit('expected production widget click not found exactly once')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/patch-jewelry-exact-production-click.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: select exact Jewelry production widget'
          git push origin HEAD:fix-jewelry-output-input-confusion
