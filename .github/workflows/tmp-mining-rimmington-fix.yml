name: Temporary Mining Rimmington interaction patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-mining-rimmington-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mining-rimmington-walker-interaction
          fetch-depth: 0
      - name: Patch MiningScript
        run: echo '' | base64 -d > /tmp/patch.py && python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java
          git commit -m 'Prevent mining walker from cancelling rock interactions'
          git push origin HEAD:fix/mining-rimmington-walker-interaction
