name: Temporary Mining Rimmington interaction patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-mining-rimmington-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mining-rimmington-walker-interaction
          fetch-depth: 0
      - name: Correct mining areas and walker ownership
        shell: bash
        run: |
          cat > kspaccountbuilder/tasks/skilling/mining/areas/Areas.java <<'JAVA'
          package net.runelite.client.plugins.microbot.kspaccountbuilder.tasks.skilling.mining.areas;

          import net.runelite.api.coords.WorldArea;
          import net.runelite.api.coords.WorldPoint;
          import net.runelite.client.plugins.microbot.kspaccountbuilder.tasks.skilling.mining.rocklevel.RockLevel;

          import java.util.Arrays;
          import java.util.EnumSet;
          import java.util.concurrent.ThreadLocalRandom;

          public enum Areas
          {
              TIN_COPPER_VARROCK_EAST(
                      "Varrock East Tin & Copper",
                      new WorldArea(3281, 3360, 11, 6, 0),
                      RockLevel.COPPER, RockLevel.TIN
              ),

              // RuneLite MiningSiteLocation confirms Rimmington contains Copper/Tin/Iron/Gold.
              // Keep ore-specific sub-areas so the walker stays around the rocks needed by the
              // currently selected ore instead of treating the entire mine as one shared area.
              TIN_COPPER_RIMMINGTON(
                      "Rimmington Tin & Copper",
                      new WorldArea(2963, 3226, 31, 27, 0),
                      RockLevel.COPPER, RockLevel.TIN
              ),
              IRON_RIMMINGTON(
                      "Rimmington Iron",
                      new WorldArea(2966, 3231, 20, 12, 0),
                      RockLevel.IRON
              ),
              GOLD_RIMMINGTON(
                      "Rimmington Gold",
                      new WorldArea(2973, 3231, 7, 5, 0),
                      RockLevel.GOLD
              ),

              LUMBRIDGE_SWAMP_EAST(
                      "Lumbridge Swamp East Tin & Copper",
                      new WorldArea(3219, 3143, 14, 10, 0),
                      RockLevel.COPPER, RockLevel.TIN
              ),

              TIN_COPPER_DWARVEN_NORTH(
                      "Dwarven Mine North Tin & Copper",
                      new WorldArea(3028, 9821, 8, 10, 0),
                      RockLevel.COPPER, RockLevel.TIN
              ),
              TIN_COPPER_DWARVEN_SOUTH(
                      "Dwarven Mine South Tin & Copper",
                      new WorldArea(3035, 9777, 23, 9, 0),
                      RockLevel.COPPER, RockLevel.TIN
              ),

              IRON_VARROCK_EAST(
                      "Varrock East Iron",
                      new WorldArea(3284, 3367, 6, 4, 0),
                      RockLevel.IRON
              ),
              IRON_VARROCK_WEST(
                      "Varrock West Iron",
                      new WorldArea(3171, 3364, 13, 12, 0),
                      RockLevel.IRON
              ),
              IRON_DWARVEN_WEST(
                      "Dwarven Mine West Iron",
                      new WorldArea(3028, 9821, 8, 9, 0),
                      RockLevel.IRON
              ),
              IRON_DWARVEN_EAST(
                      "Dwarven Mine East Iron",
                      new WorldArea(3051, 9821, 6, 8, 0),
                      RockLevel.IRON
              ),
              IRON_DWARVEN_SOUTH(
                      "Dwarven Mine South Iron",
                      new WorldArea(3032, 9764, 17, 15, 0),
                      RockLevel.IRON
              ),

              CLAY_VARROCK_WEST(
                      "Varrock West Clay",
                      new WorldArea(3179, 3370, 6, 8, 0),
                      RockLevel.CLAY
              ),
              SILVER_VARROCK_WEST(
                      "Varrock West Silver",
                      new WorldArea(3171, 3363, 10, 8, 0),
                      RockLevel.SILVER
              ),

              COAL_BARBARIAN_VILLAGE(
                      "Barbarian Village Coal",
                      new WorldArea(3076, 3418, 10, 7, 0),
                      RockLevel.COAL
              ),
              COAL_DWARVEN_SOUTH(
                      "Dwarven Mine South Coal",
                      new WorldArea(3035, 9759, 21, 8, 0),
                      RockLevel.COAL
              ),
              COAL_DWARVEN_CENTRAL(
                      "Dwarven Mine Central Coal",
                      new WorldArea(3047, 9774, 7, 4, 0),
                      RockLevel.COAL
              ),
              COAL_DWARVEN_NORTH(
                      "Dwarven Mine North Coal",
                      new WorldArea(3036, 9797, 5, 4, 0),
                      RockLevel.COAL
              ),
              COAL_LUMBRIDGE_SWAMP(
                      "Lumbridge Swamp Coal",
                      new WorldArea(3143, 3147, 6, 7, 0),
                      RockLevel.COAL
              ),

              GOLD_DWARVEN_MINE(
                      "Dwarven Mine Gold",
                      new WorldArea(3048, 9759, 4, 2, 0),
                      RockLevel.GOLD
              ),

              MITHRIL_DWARVEN_MINE(
                      "Dwarven Mine Mithril",
                      new WorldArea(3033, 9770, 7, 4, 0),
                      RockLevel.MITHRIL
              ),
              MITHRIL_LUMBRIDGE_SWAMP(
                      "Lumbridge Swamp Mithril",
                      new WorldArea(3141, 3143, 10, 5, 0),
                      RockLevel.MITHRIL
              ),

              ADAMANT_DWARVEN_MINE(
                      "Dwarven Mine Adamantite",
                      new WorldArea(3034, 9763, 10, 13, 0),
                      RockLevel.ADAMANT
              ),

              PORT_SARIM_DEPOSIT_BOX(
                      "Port Sarim Deposit Box",
                      new WorldArea(3044, 3234, 9, 4, 0)
              );

              private final String displayName;
              private final WorldArea worldArea;
              private final EnumSet<RockLevel> supportedRocks;

              Areas(String displayName, WorldArea worldArea, RockLevel... supportedRocks)
              {
                  this.displayName = displayName;
                  this.worldArea = worldArea;
                  this.supportedRocks = supportedRocks.length == 0
                          ? EnumSet.noneOf(RockLevel.class)
                          : EnumSet.copyOf(Arrays.asList(supportedRocks));
              }

              public static Areas randomTinCopperArea()
              {
                  Areas[] matching = Arrays.stream(values())
                          .filter(area -> area.supportsRock(RockLevel.TIN) && area.supportsRock(RockLevel.COPPER))
                          .toArray(Areas[]::new);
                  return randomFrom(matching);
              }

              public static Areas randomIronArea() { return randomAreaForRock(RockLevel.IRON); }
              public static Areas randomCoalArea() { return randomAreaForRock(RockLevel.COAL); }
              public static Areas randomGoldArea() { return randomAreaForRock(RockLevel.GOLD); }
              public static Areas randomMithrilArea() { return randomAreaForRock(RockLevel.MITHRIL); }
              public static Areas randomAdamantArea() { return randomAreaForRock(RockLevel.ADAMANT); }

              private static Areas randomAreaForRock(RockLevel rock)
              {
                  Areas[] matching = Arrays.stream(values())
                          .filter(area -> area.supportsRock(rock))
                          .toArray(Areas[]::new);
                  return randomFrom(matching);
              }

              private static Areas randomFrom(Areas[] matching)
              {
                  if (matching.length == 0)
                  {
                      throw new IllegalStateException("No mining areas matched the requested rock");
                  }
                  return matching[ThreadLocalRandom.current().nextInt(matching.length)];
              }

              public boolean supportsRock(RockLevel rock)
              {
                  return rock != null && supportedRocks.contains(rock);
              }

              public boolean isTinCopperArea() { return supportsRock(RockLevel.TIN) && supportsRock(RockLevel.COPPER); }
              public boolean isIronArea() { return supportsRock(RockLevel.IRON); }
              public boolean isCoalArea() { return supportsRock(RockLevel.COAL); }
              public boolean isGoldArea() { return supportsRock(RockLevel.GOLD); }
              public boolean isMithrilArea() { return supportsRock(RockLevel.MITHRIL); }
              public boolean isAdamantArea() { return supportsRock(RockLevel.ADAMANT); }

              public boolean isRimmingtonArea()
              {
                  return this == TIN_COPPER_RIMMINGTON
                          || this == IRON_RIMMINGTON
                          || this == GOLD_RIMMINGTON;
              }

              public String getDisplayName() { return displayName; }
              public WorldArea toWorldArea() { return worldArea; }

              public WorldPoint getSouthWest()
              {
                  return new WorldPoint(worldArea.getX(), worldArea.getY(), worldArea.getPlane());
              }

              public WorldPoint getNorthEast()
              {
                  return new WorldPoint(
                          worldArea.getX() + worldArea.getWidth() - 1,
                          worldArea.getY() + worldArea.getHeight() - 1,
                          worldArea.getPlane());
              }

              public WorldPoint getRandomPoint()
              {
                  ThreadLocalRandom random = ThreadLocalRandom.current();
                  int x = random.nextInt(worldArea.getX(), worldArea.getX() + worldArea.getWidth());
                  int y = random.nextInt(worldArea.getY(), worldArea.getY() + worldArea.getHeight());
                  return new WorldPoint(x, y, worldArea.getPlane());
              }
          }
          JAVA

          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java')
          s = p.read_text()

          s = s.replace('''                if (targetArea == Areas.GOLD_RIMMINGTON)
                {
                    depositGoldOresAtPortSarim(miningLevel);
                }
                else
                {
                    bankOresOnly(miningLevel);
                }''', '''                if (targetArea.isRimmingtonArea())
                {
                    depositRimmingtonOresAtPortSarim(miningLevel);
                }
                else
                {
                    bankOresOnly(miningLevel);
                }''')
          s = s.replace('private void depositGoldOresAtPortSarim(int miningLevel)',
                        'private void depositRimmingtonOresAtPortSarim(int miningLevel)')

          old = '''        WorldArea area = targetArea.toWorldArea();

        if (area.contains(playerLocation))
        {
            clearTargetAreaWalkIfNeeded(area);
            return true;
        }

        Microbot.status = "Walking to " + targetArea.getDisplayName();
'''
          new = '''        WorldArea area = targetArea.toWorldArea();

        if (area.contains(playerLocation))
        {
            clearTargetAreaWalkIfNeeded(area);
            return true;
        }

        // A Mine click can make the player step onto a valid interaction tile just
        // outside the configured ore-specific rectangle. The pending Mine action owns
        // movement until it starts or times out; never let WebWalker cancel it.
        if (isMiningInteractionPending())
        {
            Microbot.status = Rs2Player.isAnimating() ? "Mining" : "Moving to mining rock";
            return true;
        }

        Microbot.status = "Walking to " + targetArea.getDisplayName();
'''
          assert old in s, 'ensureInTargetArea block not found'
          s = s.replace(old, new, 1)

          marker = '''    private boolean canStartMiningInTargetArea(long now)
    {
'''
          helper = '''    private boolean isMiningInteractionPending()
    {
        if (pendingObjectInteractionAtMs <= 0L)
        {
            return false;
        }

        long age = System.currentTimeMillis() - pendingObjectInteractionAtMs;
        if (age >= OBJECT_INTERACTION_START_TIMEOUT_MS)
        {
            pendingObjectInteractionAtMs = 0L;
            return false;
        }

        return Rs2Player.isMoving() || Rs2Player.isAnimating() || Rs2Player.isInteracting();
    }

'''
          assert marker in s, 'canStartMiningInTargetArea marker not found'
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/mining/areas/Areas.java kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java
          git commit -m "Correct ore-specific mining areas and Rimmington banking"
          git push origin HEAD:fix/mining-rimmington-walker-interaction
