name: Temporary Mining Rimmington interaction patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-mining-rimmington-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mining-rimmington-walker-interaction
          fetch-depth: 0
      - name: Patch MiningScript walker ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java')
          s = p.read_text()

          old = '''        WorldArea area = targetArea.toWorldArea();

        if (area.contains(playerLocation))
        {
            clearTargetAreaWalkIfNeeded(area);
            return true;
        }

        Microbot.status = "Walking to " + targetArea.getDisplayName();
'''
          new = '''        WorldArea area = targetArea.toWorldArea();

        if (area.contains(playerLocation))
        {
            clearTargetAreaWalkIfNeeded(area);
            return true;
        }

        // A Mine click can legitimately make the player step onto an interaction tile
        // just outside the configured mining rectangle. Do not let the area walker
        // immediately steal movement from that freshly-dispatched rock interaction.
        if (isMiningInteractionPending())
        {
            Microbot.status = Rs2Player.isAnimating() ? "Mining" : "Moving to mining rock";
            return true;
        }

        Microbot.status = "Walking to " + targetArea.getDisplayName();
'''
          assert old in s, 'ensureInTargetArea block not found'
          s = s.replace(old, new, 1)

          marker = '''    private boolean canStartMiningInTargetArea(long now)
    {
'''
          helper = '''    private boolean isMiningInteractionPending()
    {
        if (pendingObjectInteractionAtMs <= 0L)
        {
            return false;
        }

        long age = System.currentTimeMillis() - pendingObjectInteractionAtMs;
        if (age >= OBJECT_INTERACTION_START_TIMEOUT_MS)
        {
            pendingObjectInteractionAtMs = 0L;
            return false;
        }

        return Rs2Player.isMoving() || Rs2Player.isAnimating() || Rs2Player.isInteracting();
    }

'''
          assert marker in s, 'canStartMiningInTargetArea marker not found'
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java
          git commit -m "Prevent mining walker from cancelling rock interactions"
          git push origin HEAD:fix/mining-rimmington-walker-interaction
