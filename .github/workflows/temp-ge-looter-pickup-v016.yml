name: GELooterPickupV016
on:
  push:
    branches: [fix/ge-looter-reliable-pickup-v016]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reliable pickup
        shell: python
        run: |
          from pathlib import Path
          p = Path('KSPGELooter/KSPGELooterScript.java')
          s = p.read_text()
          s = s.replace('import net.runelite.client.plugins.microbot.util.inventory.Rs2ItemModel;\n', 'import net.runelite.client.plugins.microbot.util.inventory.Rs2ItemModel;\nimport net.runelite.client.plugins.microbot.util.keyboard.Rs2Keyboard;\n')
          s = s.replace('import java.time.Duration;\n', 'import java.awt.event.KeyEvent;\nimport java.time.Duration;\n')
          old = '''    private void spamLoot(Rs2TileItemModel item, KSPGELooterConfig config)\n    {\n        if (item == null || !KSPGELooterArea.contains(item.getWorldLocation())) return;\n        if (!prepareLootUi()) return;\n\n        int clicks = clamp(config.spamClicks(), 1, 12);\n        int delay = clamp(config.spamDelayMs(), 30, 250);\n        int itemId = item.getId();\n        int beforeQuantity = Rs2Inventory.itemQuantity(itemId);\n        int unitGePrice = getGePrice(itemId);\n\n        targetName = safeName(item);\n        targetGeValue = getGroundStackGeValue(item);\n        status = "Looting " + targetName;\n\n        for (int i = 0; i < clicks; i++)\n        {\n            if (!Microbot.isLoggedIn()) return;\n            WorldPoint player = Rs2Player.getWorldLocation();\n            if (!KSPGELooterArea.contains(player))\n            {\n                status = "OUTSIDE AREA - PAUSED";\n                insideArea = false;\n                return;\n            }\n            if (!KSPGELooterArea.contains(item.getWorldLocation())) return;\n\n            item.pickup();\n            if (i + 1 < clicks) sleep(delay);\n        }\n\n        sleepUntil(() -> Rs2Inventory.itemQuantity(itemId) > beforeQuantity, 900);\n        int gained = Math.max(0, Rs2Inventory.itemQuantity(itemId) - beforeQuantity);\n        if (gained > 0)\n        {\n            itemsLooted += gained;\n            totalLootGeValue += (long) unitGePrice * gained;\n            priorityReleaseAt = System.currentTimeMillis() + PRIORITY_RELEASE_GRACE_MS;\n        }\n        updateOverlayState();\n    }\n'''
          new = '''    private void spamLoot(Rs2TileItemModel item, KSPGELooterConfig config)\n    {\n        if (item == null || !KSPGELooterArea.contains(item.getWorldLocation()) || !prepareLootUi()) return;\n\n        int attempts = clamp(config.spamClicks(), 1, 12);\n        int delay = clamp(config.spamDelayMs(), 30, 250);\n        int itemId = item.getId();\n        WorldPoint tile = item.getWorldLocation();\n        int beforeQuantity = Rs2Inventory.itemQuantity(itemId);\n        int unitGePrice = getGePrice(itemId);\n\n        targetName = safeName(item);\n        targetGeValue = getGroundStackGeValue(item);\n        status = "Looting " + targetName;\n\n        for (int i = 0; i < attempts && Microbot.isLoggedIn(); i++)\n        {\n            WorldPoint player = Rs2Player.getWorldLocation();\n            if (!KSPGELooterArea.contains(player))\n            {\n                status = "OUTSIDE AREA - PAUSED";\n                insideArea = false;\n                return;\n            }\n\n            Rs2TileItemModel live = findLiveGroundItem(itemId, tile);\n            if (live == null || Rs2Inventory.itemQuantity(itemId) > beforeQuantity) break;\n            if (!clearSelectedWidget()) return;\n\n            boolean dispatched = live.pickup();\n            if (!dispatched)\n            {\n                status = "Retrying Take " + targetName;\n                sleep(delay);\n                continue;\n            }\n\n            int distance = distance(player, tile);\n            int wait = Math.min(2_500, Math.max(350, 350 + distance * 220));\n            if (sleepUntil(() -> Rs2Inventory.itemQuantity(itemId) > beforeQuantity\n                    || findLiveGroundItem(itemId, tile) == null, wait)) break;\n            if (i + 1 < attempts) sleep(delay);\n        }\n\n        sleepUntil(() -> Rs2Inventory.itemQuantity(itemId) > beforeQuantity\n                || findLiveGroundItem(itemId, tile) == null, 1_200);\n        int gained = Math.max(0, Rs2Inventory.itemQuantity(itemId) - beforeQuantity);\n        if (gained > 0)\n        {\n            itemsLooted += gained;\n            totalLootGeValue += (long) unitGePrice * gained;\n            priorityReleaseAt = System.currentTimeMillis() + PRIORITY_RELEASE_GRACE_MS;\n        }\n        else if (findLiveGroundItem(itemId, tile) != null)\n        {\n            status = "Take not confirmed - retrying " + targetName;\n            priorityReleaseAt = System.currentTimeMillis() + PRIORITY_RELEASE_GRACE_MS;\n        }\n        updateOverlayState();\n    }\n\n    private Rs2TileItemModel findLiveGroundItem(int itemId, WorldPoint tile)\n    {\n        return Microbot.getRs2TileItemCache().getStream()\n                .filter(i -> i != null && !i.isDespawned() && i.getId() == itemId)\n                .filter(i -> tile.equals(i.getWorldLocation()) && KSPGELooterArea.contains(i.getWorldLocation()))\n                .findFirst().orElse(null);\n    }\n\n    private boolean clearSelectedWidget()\n    {\n        if (!Microbot.getClient().isWidgetSelected()) return true;\n        status = "Clearing stale selection for Take";\n        Rs2Keyboard.keyPress(KeyEvent.VK_ESCAPE);\n        return sleepUntil(() -> !Microbot.getClient().isWidgetSelected(), 600);\n    }\n'''
          if old not in s:
              raise SystemExit('spamLoot block did not match')
          p.write_text(s.replace(old, new))

          p = Path('KSPGELooter/KSPGELooterPlugin.java')
          s = p.read_text()
          if 'VERSION = "0.1.5"' not in s:
              raise SystemExit('version did not match')
          p.write_text(s.replace('VERSION = "0.1.5"', 'VERSION = "0.1.6"'))
      - uses: actions/checkout@v4
        with:
          repository: chsami/Microbot
          path: upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile GE Looter against Microbot
        shell: bash
        run: |
          mkdir -p upstream/runelite-client/src/main/java/net/runelite/client/plugins/microbot/KSPGELooter
          cp KSPGELooter/*.java upstream/runelite-client/src/main/java/net/runelite/client/plugins/microbot/KSPGELooter/
          if [ ! -f upstream/runelite-client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java ]; then
            cat > upstream/runelite-client/src/main/java/net/runelite/client/plugins/microbot/PluginConstants.java <<'EOF'
          package net.runelite.client.plugins.microbot;
          public final class PluginConstants {
              public static final String KSP = "[KSP] ";
              public static final boolean DEFAULT_ENABLED = false;
              public static final boolean IS_EXTERNAL = true;
              private PluginConstants() {}
          }
          EOF
          fi
          cd upstream
          ./gradlew :client:compileJava --no-daemon
      - name: Commit fix and remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name KSPOG
          git config user.email kratosmaximusosrs@gmail.com
          git add KSPGELooter/KSPGELooterScript.java KSPGELooter/KSPGELooterPlugin.java
          git commit -m "Fix GE Looter intermittent pickup failures"
          git rm .github/workflows/temp-ge-looter-pickup-v016.yml
          git commit -m "Remove temporary GE Looter validation workflow"
          git push