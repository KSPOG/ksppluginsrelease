name: Patch Smart Smelter Edgeville walk

on:
  push:
    branches:
      - fix-smart-smelter-edgeville-walk

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[edgeville-walk-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-smart-smelter-edgeville-walk
      - name: Apply Smart Smelter Edgeville walking fix
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          rm .github/workflows/patch-smart-smelter-edgeville-walk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kspsmartsmelter/KspSmartSmelterScript.java kspsmartsmelter/KspSmartSmelterPlugin.java .github/workflows/patch-smart-smelter-edgeville-walk.yml
          git commit -m "fix: walk Smart Smelter to Edgeville [edgeville-walk-done]"
          git push origin HEAD:fix-smart-smelter-edgeville-walk
