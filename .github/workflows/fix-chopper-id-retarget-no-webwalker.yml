name: Fix Chopper retarget and disable WebWalker

on:
  push:
    branches:
      - fix-chopper-id-retarget-no-webwalker

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chopper-retarget-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Chopper fix
        run: python .github/scripts/fix_chopper_retarget_no_webwalker.py
      - name: Commit Chopper fix
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: retarget on tree ID change without WebWalker [chopper-retarget-fixed]"
          git push
