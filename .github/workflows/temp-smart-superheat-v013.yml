name: SmartSuperheatV013Patch

on:
  push:
    branches:
      - fix/smart-superheat-jewelry-ge-v013

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Smart Superheat call sites
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('kspsmartsuperheat/KspSmartSuperheatScript.java'); s=p.read_text(); s=s.replace('SmartGeTrader.buyToBank(\n            itemName,', 'SmartGeTrader.buyToBank(\n            itemId,\n            itemName,', 1); s=s.replace('SmartGeTrader.sellFromInventory(\n            saleRecipe.getOutputName(),', 'SmartGeTrader.sellFromInventory(\n            saleRecipe.getOutputId(),\n            saleRecipe.getOutputName(),', 1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('kspsmartsuperheat/KspSmartSuperheatPlugin.java'); s=p.read_text().replace('public static final String VERSION = \"0.0.12\";', 'public static final String VERSION = \"0.0.13\";', 1); p.write_text(s)"
          grep -q 'SmartGeTrader.buyToBank(' kspsmartsuperheat/KspSmartSuperheatScript.java
          grep -q 'public static final String VERSION = "0.0.13";' kspsmartsuperheat/KspSmartSuperheatPlugin.java
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/temp-smart-superheat-v013.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspsmartsuperheat/KspSmartSuperheatScript.java kspsmartsuperheat/KspSmartSuperheatPlugin.java .github/workflows/temp-smart-superheat-v013.yml
          git commit -m "Wire Jewellery-style GE handling into Smart Superheat v0.0.13"
          git push
