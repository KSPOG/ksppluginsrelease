name: Build KSP Account Builder

on:
  pull_request:
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/tests/accountbuilder/**'
      - '.github/workflows/account-builder-build.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/tests/accountbuilder/**'
      - '.github/workflows/account-builder-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-builder-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile KspAccountBuilderPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Verify all Account Builder source files remain present
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(find release/kspaccountbuilder -type f -name '*.java' | wc -l)"
          echo "Account Builder Java sources: $ACTUAL"
          test "$ACTUAL" -ge 135
          # Strict preservation: assert every pre-existing Java source still exists.
          git -C release fetch --depth=1 origin 841cc614883156f92fd1356a265eef1676272046
          python -c 'import pathlib, subprocess; root=pathlib.Path("release"); paths=subprocess.check_output(["git","-C","release","ls-tree","-r","--name-only","841cc614883156f92fd1356a265eef1676272046","--","kspaccountbuilder"],text=True).splitlines(); missing=[p for p in paths if p.endswith(".java") and not (root/p).is_file()]; assert not missing, "Missing original Java sources: "+str(missing)'
          test -s release/kspaccountbuilder/KSPAccountBuilderOverlay.java
          test -s release/kspaccountbuilder/KspAccountBuilderScript.java
          test -s release/kspaccountbuilder/KspAccountBuilderPlugin.java
          test -s release/kspaccountbuilder/KspCinematicHudRenderer.java

      - name: Verify all Rune Essence portal variants and shared recovery
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('release/kspaccountbuilder')
          task = (root / 'tasks/skilling/runeessence/runeessscript/EssenceMining.java').read_text()
          parent = (root / 'KspAccountBuilderScript.java').read_text()
          scene = (root / 'ksputil/KspLiveScene.java').read_text()

          def ids(name):
              match = re.search(r'\b' + name + r'\s*=\s*\{([^}]*)\}', task)
              assert match, f'Missing portal registry: {name}'
              return {int(token) for token in re.findall(r'\d+', match.group(1))}

          assert ids('PORTAL_NPC_IDS') == {3086, 3088}, 'Incomplete NPC portal variants'
          assert ids('PORTAL_OBJECT_IDS') == {34774, 34775, 34776, 34777, 34778}, 'Incomplete object portal variants'
          assert 'id == 34775 || id == 34777' in task, 'Exit-action variants missing'
          assert 'nearestTileObject(PORTAL_OBJECT_IDS' in task, 'All-layer object discovery missing'
          assert 'getLocalLocation()' in scene, 'Instanced scene coordinate distance missing'
          assert 'objectLocal.getWorldView() == playerLocal.getWorldView()' in scene, 'Portal/player WorldView mismatch guard missing'
          assert 'KspWalkerGuard.clear(WALK_KEY_PORTAL);' in task, 'Portal discovery must cancel fallback walking'
          assert 'resolvedObjectId(liveObject)' in task, 'Active morph resolution missing'
          assert 'nearestNpcId(PORTAL_NPC_IDS' in task, 'NPC discovery missing'
          assert 'public static TileObject nearestTileObject(' in scene, 'Shared scene object resolver missing'
          assert 'essenceMining.recoverFromEssenceMine()' in parent, 'Parent scheduler recovery must delegate'
          assert 'essenceMining.getStatus()' in parent, 'Parent scheduler must report portal status'
          print('PASS: all 7 Rune Essence portal variants and shared recovery routing')

      - name: Verify state-preserving pause and fitted chatbox controls
        shell: python
        run: |
          from pathlib import Path
          root = Path('release/kspaccountbuilder')
          parent = (root / 'KspAccountBuilderScript.java').read_text()
          gate = (root / 'KspAccountBuilderPauseGate.java').read_text()
          walker = (root / 'KspWalkerGuard.java').read_text()
          renderer = (root / 'KspCinematicHudRenderer.java').read_text()
          assert 'public static boolean isPaused()' in gate
          assert 'KspAccountBuilderPauseGate.setPaused(true);' in parent
          assert 'KspAccountBuilderPauseGate.setPaused(false);' in parent
          assert 'KspWalkerGuard.pauseOwnedWalker();' in parent
          assert 'public static void pauseOwnedWalker()' in walker
          beginning = parent.index('if (manualPaused)', parent.index('private void runLoop()'))
          resume = parent.index('if (manualPauseApplied)', beginning)
          paused = parent[beginning:resume]
          assert 'stopCurrentTaskScript()' not in paused, 'Pause must not restart child state'
          assert 'taskStarted = false' not in paused, 'Pause must not reset taskStarted'
          guarded = 0
          for path in (root / 'tasks').rglob('*.java'):
              content = path.read_text()
              if '!super.run()' in content:
                  guarded += 1
                  assert 'KspAccountBuilderPauseGate.isPaused() || !super.run()' in content, str(path)
          assert guarded >= 18, f'Expected all runnable tasks, found {guarded}'
          reference = renderer[renderer.index('private void paintReferenceBackedHud('):renderer.index('private void paintChatboxHd(')]
          for action in ('pause','resume','stop','skip','settings','nav:Queue'):
              assert 'hot("' + action + '"' in reference, 'Missing interactive reference control: ' + action
          assert 'paintReferenceStats(g, reference, kind);' in reference
          assert 'paintReferenceSkill(g, reference);' in reference
          assert 'KspClassicReferenceSkin.get()' in renderer
          skin = (root / 'KspClassicReferenceSkin.java').read_text()
          for i in range(4):
              assert f'KspClassicReferenceData{i}.text()' in skin
              source = root / f'KspClassicReferenceData{i}.java'
              assert source.is_file() and source.stat().st_size < 1000000, str(source)
          assert 'while (size > 9f' in renderer, 'Legacy control sizing guard missing'
          print(f'PASS: {guarded} child loops preserve pause; reference skin and six interactive HUD controls verified')

      - name: Run dependency-free HUD and queue regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ksp-accountbuilder-tests/src /tmp/ksp-accountbuilder-tests/bin
          cp release/kspaccountbuilder/KspAccountBuilderHudMath.java /tmp/ksp-accountbuilder-tests/src/
          cp release/kspaccountbuilder/KspAccountBuilderTaskQueue.java /tmp/ksp-accountbuilder-tests/src/
          cp release/.github/tests/accountbuilder/HudAndQueueRegressionTest.java.txt /tmp/ksp-accountbuilder-tests/src/HudAndQueueRegressionTest.java
          javac --release 11 -d /tmp/ksp-accountbuilder-tests/bin /tmp/ksp-accountbuilder-tests/src/*.java
          java -cp /tmp/ksp-accountbuilder-tests/bin net.runelite.client.plugins.microbot.kspaccountbuilder.HudAndQueueRegressionTest

      - name: Verify Melee banking requires a real reason
        shell: bash
        run: |
          set -euo pipefail
          ROOT='release/kspaccountbuilder/tasks/skilling/combat/melee/meleescript'
          mkdir -p /tmp/ksp-melee-bank-tests/src /tmp/ksp-melee-bank-tests/bin
          cp "$ROOT/MeleeBankPolicy.java" /tmp/ksp-melee-bank-tests/src/
          cp release/.github/tests/accountbuilder/MeleeBankPolicyRegressionTest.java.txt /tmp/ksp-melee-bank-tests/src/MeleeBankPolicyRegressionTest.java
          javac --release 11 -d /tmp/ksp-melee-bank-tests/bin /tmp/ksp-melee-bank-tests/src/*.java
          java -cp /tmp/ksp-melee-bank-tests/bin net.runelite.client.plugins.microbot.kspaccountbuilder.tasks.skilling.combat.melee.meleescript.MeleeBankPolicyRegressionTest
          python3 - <<'PY'
          from pathlib import Path
          code = Path('release/kspaccountbuilder/tasks/skilling/combat/melee/meleescript/MeleeScript.java').read_text()
          assert 'this.shouldVisitBankForMissingWeapon()' in code
          assert 'MeleeBankPolicy.needsFoodBank(' in code
          assert 'Banking for known missing usable weapon' in code
          assert 'Banking for confirmed low-health/no-food' in code
          print('PASS: live MeleeScript integrates both guarded bank policies')
          PY

      - name: Install KSP Account Builder sources into Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspaccountbuilder" "$ROOT/kspsupport"
          cp -R release/kspaccountbuilder "$ROOT/kspaccountbuilder"
          cp -R release/kspsupport "$ROOT/kspsupport"

      - name: Install Arcane Codex artwork as Gradle resource
        shell: bash
        run: |
          set -euo pipefail
          ASSET='release/kspaccountbuilder/arcane_codex_background.png'
          test -s "$ASSET"
          DEST='hub/src/main/resources/net/runelite/client/plugins/microbot/kspaccountbuilder'
          mkdir -p "$DEST"
          cp "$ASSET" "$DEST/arcane_codex_background.png"
          file "$DEST/arcane_codex_background.png"

      - name: Install all cinematic artwork resources
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='release/kspaccountbuilder/cinematic'
          DEST='hub/src/main/resources/net/runelite/client/plugins/microbot/kspaccountbuilder/cinematic'
          mkdir -p "$DEST"
          for skill in woodcutting mining fishing runecrafting combat crafting cooking firemaking smithing; do
            test -s "$SOURCE/$skill.png" || { echo "Missing committed artwork: $skill.png"; exit 1; }
            cp "$SOURCE/$skill.png" "$DEST/$skill.png"
          done

      - name: Include shared KSP support in Account Builder source set
        shell: python
        run: |
          from pathlib import Path

          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = '''include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    if (plugin.name == "KspAccountBuilderPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                    }'''
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Make Gradle wrapper executable
        run: chmod +x hub/gradlew

      - name: Build KSP Account Builder
        working-directory: hub
        run: ./gradlew clean build -PpluginList=KspAccountBuilderPlugin --stacktrace --no-daemon

      - name: Run eleven Account Builder JUnit regression suites
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT=release/.github/tests/accountbuilder/src/test/java
          TEST_DIR=/tmp/ksp-accountbuilder-junit/classes
          REPORT_DIR=/tmp/ksp-accountbuilder-junit/reports
          JUNIT_JAR=/tmp/ksp-accountbuilder-junit/junit-platform-console-standalone-1.10.2.jar
          mkdir -p "${TEST_DIR}" "${REPORT_DIR}"
          PLUGIN_JAR=$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)
          test -n "${PLUGIN_JAR}"
          curl --fail --location --silent --show-error --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar -o "${JUNIT_JAR}"
          mapfile -t TEST_FILES < <(find "${TEST_ROOT}" -type f -name '*Test.java' | sort)
          test "${#TEST_FILES[@]}" -eq 11
          javac --release 11 -cp "${JUNIT_JAR}:${PLUGIN_JAR}" -d "${TEST_DIR}" "${TEST_FILES[@]}"
          java -jar "${JUNIT_JAR}" execute --class-path "${PLUGIN_JAR}:${TEST_DIR}" --scan-class-path="${TEST_DIR}" --reports-dir "${REPORT_DIR}" --details summary
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("/tmp/ksp-accountbuilder-junit/reports").rglob("*.xml"))
          assert reports, "JUnit produced no XML results"
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          actual = {case.attrib.get("classname", "").split(".")[-1] for case in cases}
          expected = {"CraftingBankStallTrackerTest", "MeleeBankPolicyTest", "CraftingRecipeSupplyPolicyTest", "MiningRockRetryPolicyTest", "EssenceBankCompletionPolicyTest", "CraftingEssentialAffordabilityPolicyTest", "CraftingSupplyPriorityPolicyTest", "GeOfferCommitPolicyTest", "GeSupplyReceiptPolicyTest", "SmeltingBatchTrackerTest", "KspAccountPlayTimePolicyTest"
          assert expected.issubset(actual), f"Missing executed JUnit suites: {sorted(expected - actual)}"
          failures = [case for case in cases if any(node.tag in ("failure", "error", "skipped") for node in case)]
          assert not failures, f"Failed, errored or skipped test cases: {len(failures)}"
          assert len(cases) >= 14, f"Expected at least fourteen executed tests, got {len(cases)}"
          print(f"PASS: {len(cases)} JUnit cases executed across all {len(expected)} Account Builder regression suites")
          PY

      - name: Show produced JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ls -lh hub/build/libs/
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)"

      - name: Assert Arcane Codex PNG embedded in plugin JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'net/runelite/client/plugins/microbot/kspaccountbuilder/arcane_codex_background.png'
          python - "$JAR" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              artwork = z.read('net/runelite/client/plugins/microbot/kspaccountbuilder/arcane_codex_background.png')
              assert artwork.startswith(bytes.fromhex('89504e470d0a1a0a')), 'Not a valid PNG'
              print(f'Verified Arcane Codex PNG embedded in JAR ({len(artwork)} bytes)')
          PY

      - name: Verify every cinematic PNG embedded without alteration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)"
          test -n "$JAR"
          python - "$JAR" <<'PY'
          from pathlib import Path
          import sys, struct, hashlib, zipfile
          skills = ('woodcutting', 'mining', 'fishing', 'runecrafting', 'combat',
                    'crafting', 'cooking', 'firemaking', 'smithing')
          root = Path('release/kspaccountbuilder/cinematic')
          prefix = 'net/runelite/client/plugins/microbot/kspaccountbuilder/cinematic/'
          with zipfile.ZipFile(sys.argv[1]) as artifact:
              for skill in skills:
                  source = (root / (skill + '.png')).read_bytes()
                  baked = artifact.read(prefix + skill + '.png')
                  assert source == baked, f'{skill}: bundled PNG differs from repository'
                  assert source[:8] == bytes.fromhex('89504e470d0a1a0a'), f'{skill}: invalid PNG'
                  assert struct.unpack('>II', source[16:24]) == (1328, 460), f'{skill}: unexpected artwork dimensions'
                  print(f'Embedded {skill}: {len(baked):,} bytes, sha256={hashlib.sha256(baked).hexdigest()}')
          print('PASS: all 9 cinematic scenes embedded byte-for-byte')
          PY

      - name: Upload Account Builder JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KspAccountBuilderPlugin-${{ github.sha }}
          path: hub/build/libs/KspAccountBuilderPlugin-*.jar
          if-no-files-found: error
          retention-days: 7
