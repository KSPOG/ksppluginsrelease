name: Build KSP Account Builder

on:
  pull_request:
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/workflows/account-builder-build.yml'
  push:
    branches:
      - main
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/workflows/account-builder-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: account-builder-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-crafting:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crafting-random-areas
      - name: Patch CraftingScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kspaccountbuilder/tasks/skilling/crafting/craftingscript/CraftingScript.java')
          s = p.read_text()
          s = s.replace('    private volatile CraftInventory targetRecipe = CraftInventory.LEATHER_GLOVES;\n', '    private volatile CraftInventory targetRecipe = CraftInventory.LEATHER_GLOVES;\n    private volatile Areas selectedLeatherArea = Areas.EDGE_BANK;\n    private volatile Areas selectedFurnaceArea = Areas.EDGE_FURNACE;\n', 1)
          s = s.replace('        targetRecipe = CraftInventory.valueOf(targetLevel.name());\n        state = CraftingState.CHECKING_RESOURCES;\n', '        targetRecipe = CraftInventory.valueOf(targetLevel.name());\n        selectedLeatherArea = Areas.randomLeatherArea();\n        selectedFurnaceArea = Areas.randomFurnaceArea();\n        debug("Selected Crafting areas | leather={} furnace={}", selectedLeatherArea.getDisplayName(), selectedFurnaceArea.getDisplayName());\n        state = CraftingState.CHECKING_RESOURCES;\n', 1)
          s = s.replace('                if (!ensureInArea(Areas.EDGE_FURNACE, FURNACE_WALK_KEY))\n', '                if (!ensureInArea(selectedFurnaceArea, FURNACE_WALK_KEY))\n', 1)
          old = '''            if (!ensureInArea(Areas.EDGE_BANK, BANK_WALK_KEY))
            {
                state = CraftingState.WALKING_TO_BANK;
                return;
            }

            state = targetRecipe.getRecipeType() == RecipeType.LEATHER
                    ? CraftingState.CRAFTING_LEATHER
                    : CraftingState.CUTTING_GEMS;
'''
          new = '''            Areas inventoryCraftArea = targetRecipe.getRecipeType() == RecipeType.LEATHER
                    ? selectedLeatherArea
                    : Areas.EDGE_BANK;
            if (!ensureInArea(inventoryCraftArea, BANK_WALK_KEY))
            {
                state = CraftingState.WALKING_TO_BANK;
                return;
            }

            state = targetRecipe.getRecipeType() == RecipeType.LEATHER
                    ? CraftingState.CRAFTING_LEATHER
                    : CraftingState.CUTTING_GEMS;
'''
          if old not in s:
              raise SystemExit('non-furnace area block not found')
          s = s.replace(old, new, 1)
          old = '''        if (!ensureInArea(Areas.EDGE_BANK, BANK_WALK_KEY))
        {
            state = CraftingState.WALKING_TO_BANK;
            return;
        }

        if (!Rs2Bank.isOpen())
        {
            if (!isWorldActionPending("open-bank") && Rs2Bank.openBank()) markWorldAction("open-bank");
            return;
        }
'''
          new = '''        if (!Rs2Bank.isOpen())
        {
            state = CraftingState.WALKING_TO_BANK;
            Microbot.status = "Walking to nearest bank";
            if (!Rs2Player.isMoving())
            {
                if (!isWorldActionPending("open-bank") && Rs2Bank.openBank())
                {
                    markWorldAction("open-bank");
                }
                else
                {
                    Rs2Bank.walkToBankAndUseBank();
                }
            }
            return;
        }
'''
          if old not in s:
              raise SystemExit('bank preparation block not found')
          s = s.replace(old, new, 1)
          s = s.replace('            Microbot.status = "Waiting for Edgeville furnace";\n', '            Microbot.status = "Waiting for " + selectedFurnaceArea.getDisplayName();\n', 1)
          s = s.replace('                        && Areas.EDGE_FURNACE.getArea().contains(object.getWorldLocation()))\n', '                        && selectedFurnaceArea.getArea().contains(object.getWorldLocation()))\n', 1)
          p.write_text(s)
          PY
      - name: Commit Crafting changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder/tasks/skilling/crafting/craftingscript/CraftingScript.java
          git commit -m "Randomize Crafting furnace and leather areas"
          git push origin HEAD:feature/crafting-random-areas

  build:
    name: Compile KspAccountBuilderPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install KSP Account Builder sources into Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspaccountbuilder" "$ROOT/kspsupport"
          cp -R release/kspaccountbuilder "$ROOT/kspaccountbuilder"
          cp -R release/kspsupport "$ROOT/kspsupport"

      - name: Include shared KSP support in Account Builder source set
        shell: python
        run: |
          from pathlib import Path

          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = '''include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    if (plugin.name == "KspAccountBuilderPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                    }'''
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Make Gradle wrapper executable
        run: chmod +x hub/gradlew

      - name: Build KSP Account Builder
        working-directory: hub
        run: ./gradlew clean build -PpluginList=KspAccountBuilderPlugin --stacktrace --no-daemon

      - name: Show produced JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ls -lh hub/build/libs/
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)"

      - name: Upload Account Builder JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KspAccountBuilderPlugin-${{ github.sha }}
          path: hub/build/libs/KspAccountBuilderPlugin-*.jar
          if-no-files-found: error
          retention-days: 7