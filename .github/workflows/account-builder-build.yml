name: Build KSP Account Builder

on:
  pull_request:
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/workflows/account-builder-build.yml'
  push:
    branches:
      - main
      - feature/mining-random-copper-tin-iron-areas
    paths:
      - 'kspaccountbuilder/**'
      - 'kspsupport/**'
      - '.github/workflows/account-builder-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: account-builder-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-mining:
    if: github.ref == 'refs/heads/feature/mining-random-copper-tin-iron-areas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MiningScript
        shell: python
        run: |
          from pathlib import Path

          path = Path('kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java')
          text = path.read_text(encoding='utf-8')

          if 'private Areas selectedTinCopperArea' not in text:
              text = text.replace(
                  '    private Areas targetArea = Areas.TIN_COPPER_VARROCK_EAST;\n',
                  '    private Areas targetArea = Areas.TIN_COPPER_VARROCK_EAST;\n'
                  '    private Areas selectedTinCopperArea = Areas.TIN_COPPER_VARROCK_EAST;\n'
                  '    private Areas selectedIronArea = Areas.IRON_VARROCK_EAST;\n',
                  1)

          if 'Selected mining areas | tinCopper=' not in text:
              text = text.replace(
                  '        this.targetArea = area;\n        this.startingTargetRockInitialized = false;\n',
                  '        this.selectedTinCopperArea = Areas.randomTinCopperArea();\n'
                  '        this.selectedIronArea = Areas.randomIronArea();\n'
                  '        this.targetArea = progressiveMining ? selectedTinCopperArea : area;\n'
                  '        debug("Selected mining areas | tinCopper={} iron={}", selectedTinCopperArea.getDisplayName(), selectedIronArea.getDisplayName());\n'
                  '        this.startingTargetRockInitialized = false;\n',
                  1)

          text = text.replace(
              '            RockLevel targetRock = targetArea == Areas.TIN_COPPER_VARROCK_EAST\n                    ? getStarterRockToMine()\n                    : resolveTargetRock(miningLevel);\n',
              '            RockLevel targetRock = targetArea.isTinCopperArea()\n                    ? getStarterRockToMine()\n                    : resolveTargetRock(miningLevel);\n')
          text = text.replace(
              '        RockLevel targetRock = targetArea == Areas.TIN_COPPER_VARROCK_EAST\n                ? getStarterRockToMine()\n                : resolveTargetRock(miningLevel);\n',
              '        RockLevel targetRock = targetArea.isTinCopperArea()\n                ? getStarterRockToMine()\n                : resolveTargetRock(miningLevel);\n')

          bank_start = text.find('    private void bankOresOnly(int miningLevel)\n')
          bank_end = text.find('    private void depositGoldOresAtPortSarim(int miningLevel)\n')
          if bank_start >= 0 and bank_end > bank_start and 'Walking to nearest bank' not in text[bank_start:bank_end]:
              new_bank = '\n'.join([
                  '    private void bankOresOnly(int miningLevel)',
                  '    {',
                  '        if (!ensureInventoryTabOpenFast()) return;',
                  '',
                  '        if (!Rs2Bank.isOpen())',
                  '        {',
                  '            Microbot.status = "Walking to nearest bank";',
                  '            if (bankActionReady() && (Rs2Bank.openBank() || Rs2Bank.walkToBankAndUseBank())) markBankAction();',
                  '            return;',
                  '        }',
                  '',
                  '        KspWalkerGuard.clear(BANK_WALK_KEY);',
                  '        if (KspBankWidgetHelper.closeBankTutorialOverlayIfOpen()) return;',
                  '        if (!bankActionReady() || bankInventoryActionPending()) return;',
                  '',
                  '        String keep = resolveInventoryPickaxeToKeep(miningLevel);',
                  '        int before = Rs2Inventory.emptySlotCount();',
                  '        boolean deposited = keep != null ? Rs2Bank.depositAllExcept(keep) : Rs2Bank.depositAll();',
                  '        if (deposited) markBankInventoryAction(before);',
                  '        markBankAction();',
                  '    }',
                  '',
                  ''
              ])
              text = text[:bank_start] + new_bank + text[bank_end:]

          text = text.replace('import net.runelite.client.plugins.microbot.util.bank.enums.BankLocation;\n', '')
          text = text.replace(
              '        if (targetRock == RockLevel.IRON)\n        {\n            return Areas.IRON_VARROCK_EAST;\n        }\n\n        return Areas.TIN_COPPER_VARROCK_EAST;\n',
              '        if (targetRock == RockLevel.IRON)\n        {\n            return selectedIronArea;\n        }\n\n        return selectedTinCopperArea;\n',
              1)
          text = text.replace('return canMineIronSafely() ? RockLevel.IRON : null;', 'return canMineSelectedIronSafely() ? RockLevel.IRON : null;')
          text = text.replace('if (canMineIronSafely() && canMineSilverSafely())', 'if (canMineSelectedIronSafely() && canMineSilverSafely())')
          text = text.replace('else if (canMineIronSafely())', 'else if (canMineSelectedIronSafely())')

          if 'private boolean canMineSelectedIronSafely()' not in text:
              marker = '    private boolean canMineIronSafely()\n'
              helper = '    private boolean canMineSelectedIronSafely()\n    {\n        return selectedIronArea != Areas.IRON_VARROCK_EAST || canMineIronSafely();\n    }\n\n'
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patched MiningScript
        shell: bash
        run: |
          if git diff --quiet -- kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kspaccountbuilder/tasks/skilling/mining/miningscript/MiningScript.java
          git commit -m "Randomize Copper Tin and Iron mining areas"
          git push origin HEAD:feature/mining-random-copper-tin-iron-areas

  build:
    name: Compile KspAccountBuilderPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KSP plugin sources
        uses: actions/checkout@v4
        with:
          path: release

      - name: Checkout latest Microbot Hub
        uses: actions/checkout@v4
        with:
          repository: chsami/Microbot-Hub
          ref: main
          path: hub

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: hub/**/*.gradle*

      - name: Install KSP Account Builder sources into Hub
        shell: bash
        run: |
          set -euo pipefail
          ROOT='hub/src/main/java/net/runelite/client/plugins/microbot'
          rm -rf "$ROOT/kspaccountbuilder" "$ROOT/kspsupport"
          cp -R release/kspaccountbuilder "$ROOT/kspaccountbuilder"
          cp -R release/kspsupport "$ROOT/kspsupport"

      - name: Include shared KSP support in Account Builder source set
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/gradle/plugin-utils.gradle')
          text = path.read_text(encoding='utf-8')
          needle = 'include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"'
          replacement = '''include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    if (plugin.name == "KspAccountBuilderPlugin") {
                        include "${project.ext.getPluginsIncludePath()}/kspsupport/**"
                    }'''
          if needle not in text:
              raise SystemExit('Could not locate Microbot-Hub source include rule')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Make Gradle wrapper executable
        run: chmod +x hub/gradlew

      - name: Build KSP Account Builder
        working-directory: hub
        run: ./gradlew clean build -PpluginList=KspAccountBuilderPlugin --stacktrace --no-daemon

      - name: Show produced JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ls -lh hub/build/libs/
          test -n "$(find hub/build/libs -maxdepth 1 -type f -name 'KspAccountBuilderPlugin-*.jar' -print -quit)"

      - name: Upload Account Builder JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KspAccountBuilderPlugin-${{ github.sha }}
          path: hub/build/libs/KspAccountBuilderPlugin-*.jar
          if-no-files-found: error
          retention-days: 7