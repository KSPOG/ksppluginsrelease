name: Apply Smart Smelter market and overlay patch

on:
  push:
    branches:
      - fix/smart-smelter-market-overlay

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[smart-smelter-market-overlay-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-smelter-market-overlay
      - name: Apply Smart Smelter patch
        run: python .github/scripts/apply_smart_smelter_market_overlay.py
      - name: Commit generated source changes
        run: |
          git config user.name "KSP Automation"
          git config user.email "ksp-automation@users.noreply.github.com"
          git add kspsmartsmelter
          git diff --cached --quiet && exit 0
          git commit -m "fix: use live market prices and compact Smart Smelter overlay [smart-smelter-market-overlay-done]"
          git push origin HEAD:fix/smart-smelter-market-overlay
